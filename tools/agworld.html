<script type="text/x-lumen">

const WMLOC={spell:[50,31,'🏰'],dash:[23,35,'🕳️'],gate:[78,38.5,'🛡️'],pets:[52,56,'🐾'],blocks:[36,63,'🧱'],kart:[70,71.5,'🏁'],snake:[21,71.5,'🐍'],mansion:[85,60,'🏚️'],ocean:[8,62,'🌊'],island:[88,77,'🏝️']};

  const ridge=(px,py)=>{let t=0,a=.5,f=1;for(let k=0;k<4;k++){t+=a*(1-Math.abs(vn(px*f+31,py*f+7)*2-1));f*=2.1;a*=.5}return t};

  const VOL=[.62,.44],hgt=new Float32Array(W*H),FOR=new Uint8Array(W*H),seg=(u,v,a,b,c2,d2)=>{const dx=c2-a,dy=d2-b,t=Math.max(0,Math.min(1,((u-a)*dx+(v-b)*dy)/(dx*dx+dy*dy)));return Math.hypot(u-a-t*dx,(v-b-t*dy)*.8)};

  const RIV=[[[.3,.25],[.34,.42],[.29,.6],[.31,.8],[.3,.97]],[[.48,.2],[.51,.38],[.45,.56],[.5,.78],[.56,1]],[[.76,.38],[.72,.52],[.8,.68],[.99,.6]],[[.22,.36],[.15,.42],[.05,.45]],[[.6,.24],[.66,.12],[.63,0]]];
  for(const R of RIV){const P=[];for(let q=0;q<R.length-1;q++){const [a,b]=R[q],[c2,d2]=R[q+1];for(let t=0;t<1;t+=.02){const u=a+(c2-a)*t,v=b+(d2-b)*t,m=(vn(u*30+q,v*30)-.5)*.025;P.push([(u+m)*W,(v+(vn(u*30,v*30+q)-.5)*.025)*H])}}

  at('island',()=>{box(-4,2,8,6,'#D9B48A','#A0782C',.6);x.strokeStyle='#7A5634';x.lineWidth=1.2;x.beginPath();x.moveTo(6,4);x.lineTo(7,-6);x.stroke();x.fillStyle='#2F8A3E';for(let a=0;a<6.28;a+=1.05){x.beginPath();x.ellipse(7+Math.cos(a)*3,-6+Math.sin(a)*1.6,3.2,1.2,a,0,7);x.fill()}x.fillStyle='#8A5A2B';x.fillRect(-14,6,8,1.5)});
  /* soft surf on the coast and a vignette */
  const g=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(4,20,40,.45)');x.fillStyle=g;x.fillRect(0,0,W,H);
  WMIMG=c.toDataURL('image/jpeg',.88);try{localStorage.setItem('wmter_v3',WMIMG)}catch(e){}return WMIMG}
function wmLoad(){if(WMIMG||WMBUSY)return;WMBUSY=wmTerrain().then(u=>{WMBUSY=null;document.querySelectorAll('.wmter').forEach(i=>{i.src=u;i.classList.add('on')})})}
function wmArt(){const cmp=`<g transform="translate(940 70)" opacity=".9"><circle r="34" fill="rgba(12,30,50,.55)" stroke="#F5E6C8" stroke-width="2"/><path d="M0 -30L7 0L0 30L-7 0Z" fill="#F5E6C8"/><path d="M0 -30L7 0H-7Z" fill="#E4572E"/><path d="M-30 0L0 -6L30 0L0 6Z" fill="#F5E6C8" opacity=".7"/><text y="-38" text-anchor="middle" fill="#F5E6C8" font-size="14" font-weight="800" font-family="sans-serif">N</text></g>`;
  if(!WMIMG)setTimeout(wmLoad,30);return `<img class="wmter ${WMIMG?'on':''}" ${WMIMG?`src="${WMIMG}"`:''} alt=""><svg viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${cmp}</svg>`}
function wmView(){const out=!noLimit()&&playLeft()<=0,qg=new Set(aqList().filter(k=>!aqDone(k)).map(k=>AQS[k].g).filter(Boolean));
  return `<div class="wmap" role="group" aria-label="Arcade world map">${wmArt()}${Object.entries(WMLOC).map(([id,[x,y,e]])=>{const g=GAMES.find(q=>q.id===id);
    if(!g)return WMSOON[id]?`<span class="wmloc soon" style="left:${x}%;top:${y}%" aria-label="${esc(WMSOON[id])}, coming soon"><span aria-hidden="true">${e}</span><span class="t">${esc(WMSOON[id])}</span> · Soon</span>`:'';
    const rest=out&&id!=='pets';return `<button class="wmloc ${rest?'dim':''}" style="left:${x}%;top:${y}%" onclick="openGame('${id}')" aria-label="${esc(g.n)}${qg.has(id)?', has a quest today':''}"><span aria-hidden="true">${e}</span><span class="t">${esc(g.n)}</span>${qg.has(id)?'<span class="bdg" aria-hidden="true">!</span>':''}</button>`}).join('')}</div>`}

/* ---------- Daily arcade quests ---------- */
const AQS={gok:{i:'✅',t:'Get 10 right answers in arcade games',n:10,v:D=>D.gok||0},games3:{i:'🎮',t:'Play 3 different arcade games',n:3,v:D=>Object.keys(D.ag||{}).length},
  kartmed:{i:'🏎️',t:'Win a medal in Turbo Trivia Kart',n:1,g:'kart'},sqf:{i:'🤝',t:'Befriend a creature in Spell Quest',n:1,g:'spell'},bbc:{i:'🧱',t:'Clear 8 groups in Block Builder',n:8,g:'blocks'},
  ggw:{i:'🛡️',t:'Win 3 waves in Goblin Gate',n:3,g:'gate'},px:{i:'🧭',t:'Take your pet exploring',n:1,g:'pets'},bd:{i:'🏗️',t:'Place 20 blocks in Building mode',n:20,g:'blocks'},petg:{i:'⭐',t:'Play a Pet Pals mini-game',n:1,g:'pets'}};
const aqV=(k,D=DAY())=>Math.min(AQS[k].n,AQS[k].v?AQS[k].v(D):((D.aqk||{})[k]||0));
const aqDone=k=>(DAY().aqd||[]).includes(k);
function aqList(){const D=DAY();if(!D.aql||D.aql.some(k=>!AQS[k])){let h=11;for(const c of D.d+':aq:'+(ME.id||0))h=(h*31+c.charCodeAt(0))>>>0;const r=()=>(h=(h*1103515245+12345)>>>0)/4294967296;
    const pool=Object.keys(AQS).filter(k=>!AQS[k].g||GAMES.some(g=>g.id===AQS[k].g)),out=[];while(out.length<3&&pool.length)out.push(pool.splice(Math.floor(r()*pool.length),1)[0]);D.aql=out;D.aqd=D.aqd||[]}
  return D.aql}
function aqCheck(){if(!gameOn())return;const D=DAY(),got=[];D.aqd=D.aqd||[];for(const k of aqList())if(!D.aqd.includes(k)&&aqV(k,D)>=AQS[k].n){D.aqd.push(k);addGems(4);got.push(`Arcade quest done: ${AQS[k].t}. +4 💎`)}
  if(!D.aqc&&D.aqd.length>=3){D.aqc=1;addGems(8);got.push('Every arcade quest done! Arcade chest: +8 💎')}if(got.length){SYNC();celebrate(got,D.aqc===1&&got.length>0)}}
function aqBump(k,n=1){const D=DAY();D.aqk=D.aqk||{};D.aqk[k]=(D.aqk[k]||0)+n;aqCheck()}
const aqCard=()=>{const D=DAY(),L=aqList(),n=L.filter(aqDone).length;return `<div class="gcard parch aqcard"><div class="split"><h3>🎮 Arcade quests</h3><span class="sol">${n} of 3 done</span></div>
  ${L.map(k=>{const Q=AQS[k],v=aqV(k),d=aqDone(k);return `<div class="quest ${d?'done':''}"><span class="qi" aria-hidden="true">${d?'✔️':Q.i}</span><div class="qt"><b>${esc(Q.t)}</b><div class="bar"><i style="width:${v/Q.n*100}%"></i></div></div><span class="rw">${d?'Done':`${v}/${Q.n}`}</span></div>`}).join('')}
  <p class="sol" style="margin:8px 0 0">Each quest gives 4 💎. Finish all three for the arcade chest (+8 💎). New quests every day.</p></div>`};
/* the hooks: count what happens in each game */
const _agpW=AG.play;AG.play=function(id,o){const r=_agpW(id,o);if(AG.cur&&AG.cur.id===id){const D=DAY(),k={petstars:'pets',petsort:'pets',sq:'spell',bbuild:'blocks'}[id]||id;D.ag=D.ag||{};if(!D.ag[k]){D.ag[k]=1;aqCheck()}if(id==='petstars'||id==='petsort')aqBump('petg')}return r};
const _ogW=openGame;openGame=function(id){_ogW(id);if(id==='dash'||id==='snake'){const D=DAY();D.ag=D.ag||{};if(!D.ag[id]){D.ag[id]=1;aqCheck()}}};
const _ansW=AG.answered;AG.answered=function(...a){const r=_ansW(...a);aqCheck();return r};
const _krW=kresult;kresult=function(T){const r=_krW(T);if(r.medal)aqBump('kartmed');return r};
const _swW=sqWin;sqWin=function(Z,how){_swW(Z,how);aqBump('sqf')};
const _bbW=bbresult;bbresult=function(Z,why){const r=_bbW(Z,why);if(Z.clears)aqBump('bbc',Z.clears);return r};
const _gwW=ggWaveDone;ggWaveDone=function(Z){_gwW(Z);aqBump('ggw')};
const _pxW=pxGo;pxGo=function(pl){const n=pxTrips();_pxW(pl);if(pxTrips()<n)aqBump('px')};
const _bdW=bdApply;bdApply=function(Z,c,r,tool){const b=bdS().bricks;_bdW(Z,c,r,tool);if(bdS().bricks<b)aqBump('bd')};
/* the hub: the map first, and the arcade quests beside today's quests */
const _hvW=hubView;hubView=function(){const h=_hvW();return h.replace('<div class="tiles">',`${wmView()}<h3 style="margin:0 0 10px;color:#fff">All games</h3><div class="tiles">`)
  .replace('<div class="gcard parch"><div class="split"><h3>⚔️ Today','<div style="display:grid;gap:18px;align-content:start"><div class="gcard parch"><div class="split"><h3>⚔️ Today').replace(/<\/div><\/div><\/div>$/,`</div>${aqCard()}</div></div></div>`)};

/* ---------- Owner perks (Owner console): unlimited currency in every game, and the exclusive Royal turtle ----------
   Unlimited currency keeps the Owner's balances full; anything bought stays. Switching it off brings back the balances from before. */
const OWNRICH=()=>{if(BOOT.role!=='owner'||!GM.rich)return;const N=999999,S=BOOT.state;S.gems=N;
  try{const g=ARS('gate');g.coins=N;g.shards=N}catch(e){}try{isS().coins=N}catch(e){}try{bdS().bricks=N}catch(e){}try{const P=PET();P.food=999;P.treat=999}catch(e){}
  try{if(AG.cur&&AG.cur.id==='gate'&&AG.cur.st&&AG.cur.st.gold<N/2)AG.cur.st.gold=N}catch(e){}};
function ownerRich(on){if(BOOT.role!=='owner')return;const S=BOOT.state;
  if(on&&!GM.rich){GM.richBak={gems:GEMS(),gate:(ARS('gate').coins||0),shards:(ARS('gate').shards||0),isl:(()=>{try{return isS().coins}catch(e){return 0}})(),bricks:(()=>{try{return bdS().bricks}catch(e){return 0}})()};GM.rich=1;OWNRICH()}
  else if(!on&&GM.rich){const B=GM.richBak||{};GM.rich=0;S.gems=B.gems||0;const g=ARS('gate');g.coins=B.gate||0;g.shards=B.shards||0;try{isS().coins=B.isl||0}catch(e){}try{bdS().bricks=B.bricks||0}catch(e){}delete GM.richBak}
  SYNC();renderMe();r2()}
if(BOOT.role==='owner'){if(GM.rich===undefined){GM.rich=0}if(!GM.own.includes('p_turtle'))GM.own=[...GM.own,'p_turtle'];OWNRICH();setInterval(OWNRICH,1500)}
let OPCL=null;

  busy(async()=>{const r=await api('POST',`/api/classes/${c}/awards`,{to,gems:1,reason:'An exclusive gift from the Owner',pet:'p_turtle'});msg(`🐢 Sent the Royal turtle to ${r.count} student${r.count===1?'':'s'}. They get it the next time they open Bose Academy.`)})}
O.perks=function(){if(OPCL===null){OPCL=[];LOAD.teacher().then(()=>{OPCL=ST.classes||[];r2()}).catch(()=>{OPCL=[];r2()})}
  const cs=OPCL||[],sel=+(ST.otc||0),c=cs.find(x=>x.id===sel)||cs[0],St=(c&&c.students)||[];
  return `<div class="card"><h3>💎 Unlimited currency</h3><p class="sol">Your account only. Gems, Goblin Gate coins and shards, Island coins, Block Builder bricks, pet food and treats, and gold in a Goblin Gate stage stay full. Anything you buy is yours to keep. Switch it off to get your old balances back.</p>
    <label class="ck2" style="display:flex;gap:10px;align-items:center;font-weight:700;margin-top:8px"><input type="checkbox" ${GM.rich?'checked':''} onchange="ownerRich(this.checked)"> Unlimited currency is ${GM.rich?'on':'off'}</label></div>
  <div class="card" style="margin-top:16px"><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div style="width:110px;flex:none">${heroSvg(GM,{eq:{pet:'p_turtle'},label:'The Royal turtle'})}</div>
    <div style="flex:1;min-width:240px"><h3>🐢 The Royal turtle</h3><p class="sol">An exclusive pet. It can't be bought: only you can give it. You already have it in your shop to wear.</p>
    ${cs.length?`<div class="row"><select id="otc" aria-label="Class" onchange="ST.otc=+this.value;r2()">${cs.map(x=>`<option value="${x.id}" ${c&&x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      <select id="ots" aria-label="Give to"><option value="all">Whole class</option>${St.map(s=>`<option value="${s.uid}">${esc(s.name)}</option>`).join('')}</select><button class="lamp" onclick="giveTurtle()">🐢 Give the turtle</button></div>`
      :`<p class="sol">${OPCL&&OPCL.length===0?'No classes yet. A student must be in a class to receive the turtle.':'Loading classes…'}</p>`}</div></div></div>`};
const _ovP=VIEWS.owner;VIEWS.owner=function(){const h=_ovP(),k='</div><div style="margin-top:16px">';return h.replace(k,`<button class="chip ${ST.ot==='perks'?'on':''}" onclick="ST.ot='perks';r2()">👑 Owner perks</button>`+k)};
</script>
