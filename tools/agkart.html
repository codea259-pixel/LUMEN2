  const r1=a.sw/7,r2=b.sw/7;kpoly(x,[[a.sx-a.sw-r1,a.sy],[a.sx-a.sw,a.sy],[b.sx-b.sw,b.sy],[b.sx-b.sw-r2,b.sy]],tr.rb[alt]);kpoly(x,[[a.sx+a.sw+r1,a.sy],[a.sx+a.sw,a.sy],[b.sx+b.sw,b.sy],[b.sx+b.sw+r2,b.sy]],tr.rb[alt]);
  kpoly(x,[[a.sx-a.sw,a.sy],[a.sx+a.sw,a.sy],[b.sx+b.sw,b.sy],[b.sx-b.sw,b.sy]],tr.road[alt]);
  if(alt){const l1=a.sw/40,l2=b.sw/40;for(const f of[-1/3,1/3]){const ax=a.sx+a.sw*f*2,bx=b.sx+b.sw*f*2;kpoly(x,[[ax-l1,a.sy],[ax+l1,a.sy],[bx+l2,b.sy],[bx-l2,b.sy]],tr.ln)}}}
/* A sprite, cut off where a nearer hill hides it */
function ksprite(x,img,dx,dy,w,h,clip){if(w<1||h<1)return;const ch=clip?Math.max(0,dy+h-clip):0;if(ch>=h)return;x.drawImage(img,0,0,img.width,img.height*(1-ch/h),dx,dy,w,h-ch)}
/* A gate: an arch over the road, one answer over each lane */
function kgatedraw(x,T,s,p){const g=T.Z.gates[s.gate],q=T.q&&T.q.g===g?T.q:null,w=p.sw,h=w*.55,top=p.sy-h;if(top>s.clip||w<6)return;
  x.fillStyle='#ffffff';x.fillRect(p.sx-w*1.08,top,w*.06,h);x.fillRect(p.sx+w*1.02,top,w*.06,h);
  x.fillStyle='rgba(30,20,70,.88)';x.fillRect(p.sx-w*1.08,top-h*.32,w*2.16,h*.34);
  if(q&&w>40){x.font=`800 ${Math.max(8,Math.min(26,w*.09))}px "Atkinson Hyperlegible",sans-serif`;x.textAlign='center';x.textBaseline='middle';
    q.L.forEach((t,i)=>{const cx=p.sx+w*(i-1)*.68;x.fillStyle=['#ff7aa8','#ffd34d','#5ff3ff'][i];x.fillText(String(t).slice(0,14),cx,top-h*.15)})}}
function kspeedo(x,T){const v=Math.round(T.v/KTIER[2].vmax*140),cx=58,cy=KH-30;x.fillStyle='rgba(15,10,40,.62)';x.beginPath();x.arc(cx,cy,30,Math.PI,0);x.fill();
  x.strokeStyle=T.boost>0?'#ff7a1a':'#5ff3ff';x.lineWidth=5;x.beginPath();x.arc(cx,cy,24,Math.PI,Math.PI+Math.PI*Math.min(1,v/160));x.stroke();
  x.fillStyle='#fff';x.font='800 15px "Atkinson Hyperlegible",sans-serif';x.textAlign='center';x.textBaseline='alphabetic';x.fillText(v,cx,cy-4);x.font='700 8px sans-serif';x.fillText('KM/H',cx,cy+6)}
/* Where the ghost of the best run is now */
function kghostZ(T){const g=T.ghost;if(!g)return null;const i=Math.floor(T.time/.25)*2,s=g.s;if(i+3>=s.length)return null;const f=(T.time%.25)/.25;return{z:(s[i]+(s[i+2]-s[i])*f)*10,x:(s[i+1]+(s[i+3]-s[i+1])*f)/100}}

/* ---------- The words around the road ---------- */
function kqshow(T,done,lane){const box=$('kq'),L=document.querySelectorAll('.klanes2 button');if(!box)return;const q=done||T.q;
  if(!q||q.none){box.className='kqbox idle';box.innerHTML='<span>🏎️ Drive on! The next question appears before the next gate.</span>';L.forEach(b=>{b.className='';b.querySelector('.kl').textContent='…';b.disabled=true});return}
  box.className='kqbox';box.innerHTML=`<span class="sol">Gate ${q.g.seg?T.Z.gates.indexOf(q.g)+1:''} of ${T.Z.gates.length}${SK[q.k]?' · '+esc(SK[q.k].n):''}</span><div class="kqt">${q.q.q}</div>${done?'':'<div class="kqbar"><i id="kqbar"></i></div>'}`;
  L.forEach((b,i)=>{b.querySelector('.kl').textContent=q.L[i];b.disabled=!!done;b.className=done?(i===q.cor?'right':i===lane?'wrong':''):''});
  if(done)setTimeout(()=>{if(AG.cur&&AG.cur.st===T&&!T.q)kqshow(T)},1600)}
function khud(T){const h=$('khud');if(!h)return;const g=T.Z.gates,gi=Math.min(g.length,g.filter(x=>x.done).length+1),gz=kghostZ(T);
  let gd='';if(gz){const d=(gz.z-T.pos)/Math.max(1500,T.v);gd=`<span>👻 ${d>0?'+':''}${d.toFixed(1)} s</span>`}
  h.innerHTML=`<span>🏁 ${gi}/${g.length}</span><span>⏱ ${T.time.toFixed(1)}</span><span>🪙 ${T.coins}${T.x2>0?' ×2':''}</span><span>✅ ${T.ok}</span>${gd}`;
  const lane=T.x<-.31?0:T.x>.31?2:1;document.querySelectorAll('.klanes2 button').forEach((b,i)=>{b.classList.toggle('on',i===lane);b.setAttribute('aria-pressed',i===lane)});
  const bar=$('kqbar');if(bar&&T.q&&!T.q.none){const tot=T.q.g.z-(T.q.z0+KCAMH*KCAMD),left=T.q.g.z-(T.pos+KCAMH*KCAMD);bar.style.transform=`scaleX(${Math.max(0,Math.min(1,left/tot))})`}
  const p=$('kpow');if(p){p.disabled=!T.pw;p.innerHTML=T.pw?`${KPOW[T.pw][0]}<small>${KPOW[T.pw][1]}</small>`:`·<small>Power</small>`;p.setAttribute('aria-label',T.pw?`Use ${KPOW[T.pw][1]}`:'No power-up yet')}
  const f=$('kfb2');if(f){f.classList.toggle('off',!T.fb);if(T.fb)f.innerHTML=`${esc(T.fb.a)}${T.fb.b?`<br><small style="font-size:.7em">${esc(T.fb.b)}</small>`:''}`}}

/* ---------- The end of a race: medals, personal bests, the ghost, gems and achievements ---------- */
function kresult(T){const tr=T.tr,S=ktS(),f=T.n?T.ok/T.n:0,medal=f>=.9?3:f>=.7?2:f>=.5?1:0,time=+T.time.toFixed(1),score=T.coins*10+T.ok*100+T.best*25+Math.max(0,Math.round((T.Z.gates.length*14-time)*5));
  const pb=S.pb[tr.id]||{},nb={time:medal&&(pb.time==null||time<pb.time),ok:T.ok>(pb.ok||0),score:score>(pb.score||0),streak:T.best>(pb.streak||0)};
  const beatGhost=!!(T.ghost&&medal&&nb.time);
  S.pb[tr.id]={time:nb.time?time:pb.time,ok:Math.max(T.ok,pb.ok||0),score:Math.max(score,pb.score||0),streak:Math.max(T.best,pb.streak||0)};
  if(nb.time)S.gh[tr.id]={s:T.rec.slice(0,1600)};
  const i=KTR.indexOf(tr),unlock=medal>0&&!(S.med[tr.id]>0)&&KTR[i+1];S.med[tr.id]=Math.max(S.med[tr.id]||0,medal);S.races=(S.races||0)+1;
  const gems=medal+(nb.time&&medal?2:0)+Math.min(2,Math.floor(T.coins/40));if(gems)addGems(gems);
  AG.ach('kart','first');if(medal===3)AG.ach('kart','gold');if(T.coins>=40)AG.ach('kart','coins');if(!T.hits)AG.ach('kart','clean');if(beatGhost)AG.ach('kart','ghost');
  if(tr.id==='space')AG.ach('kart','night');if(KTR.every((_,j)=>ktOpen(j)))AG.ach('kart','tour');
  S.tok=(S.tok||0)+T.ok;if(medal){S.meds=(S.meds||0)+1;if(medal===3)S.golds=(S.golds||0)+1}if(beatGhost)S.ghb=(S.ghb||0)+1;
  if(S.tok>=50)AG.ach('kart','gates50');if(medal>=2)AG.ach('kart','silver');if(S.meds>=3)AG.ach('kart','medals3');if(S.races>=10)AG.ach('kart','races10');if(T.n&&T.ok===T.n&&T.n>=tr.g)AG.ach('kart','perfect');
  if(medal===3&&tr.id==='space')AG.ach('kart','spacegold');if(medal&&tr.id==='candy')AG.ach('kart','candy');if(medal&&tr.id==='jungle')AG.ach('kart','jungle');if(medal===3&&tr.id==='neon')AG.ach('kart','neonw');
  if(S.ghb>=3)AG.ach('kart','ghost3');if(KTR.every(t=>S.med[t.id]===3))AG.ach('kart','allgold');if(T.best>=10)AG.ach('kart','streak10');if((S.golds||0)>=3)AG.ach('kart','first3');
  SND.play(medal?'win':'lose','ui');return{why:'done',tr:tr.id,medal,time,score,coins:T.coins,ok:T.ok,n:T.n,best:T.best,nb,beatGhost,unlock:unlock&&unlock.n,gems}}

/* ---------- The menu: tracks, the kart, personal bests and the last result ---------- */
function kwinPreview(){const c=$('kcard');if(!c)return;const o=c.querySelector('.kwinfx');if(o)o.remove();c.insertAdjacentHTML('afterbegin',kwinFx(ktWin()));setTimeout(()=>{const f=c.querySelector('.kwinfx');if(f)f.remove()},3800)}
const ktThumb=t=>kimg('th'+t.id,160,72,(x)=>{x.drawImage(ksky(t),0,0,KW,KH*.9,0,0,160,72);x.fillStyle=t.gr[0];x.fillRect(0,46,160,26);kpoly(x,[[60,46],[100,46],[150,72],[10,72]],t.road[0]);kpoly(x,[[78,46],[82,46],[84,72],[76,72]],t.ln)});
GVIEW.kart=function(){const C=AG.cur&&AG.cur.id==='kart'?AG.cur:null;
  if(C&&['load','play','crash'].includes(C.phase))return AG.screen('kart',{above:`<div class="kqbox idle" id="kq" aria-live="polite"><span>🏎️ Get ready…</span></div>`,
    over:`<div class="khud2" id="khud"></div><button class="kpow" id="kpow" disabled onclick="AG.cur&&kuse(AG.cur.st)" aria-label="No power-up yet">·</button><div class="kfb2 off" id="kfb2" role="status"></div>`,
    below:`<div class="klanes2" role="group" aria-label="Pick a lane">${[0,1,2].map(i=>`<button onclick="AG.cur&&(AG.cur.st.lane=${i})" disabled><span class="key" aria-hidden="true">${i+1}</span><span class="kl">…</span></button>`).join('')}</div>${AG.pad([[{k:'left',l:'◀',a:'Steer left'},{k:'right',l:'▶',a:'Steer right'}],[{k:'act',l:'⚡',a:'Use power-up'}]])}`});
  const S=ktS(),tr=ktCur(),r=C&&C.phase==='end'?C.res:null,pb=S.pb[tr.id]||{};let card='';
  if(r&&r.why==='done')card=`<div class="gcard endcard" style="margin-bottom:16px">${r.medal&&!r.seen?kwinFx(ktWin()):''}<div class="big" aria-hidden="true">${['🏁','🥉','🥈','🥇'][r.medal]}</div><h3>${r.medal?['','Bronze','Silver','Gold'][r.medal]+' medal!':'Race finished!'}</h3>
    <p>${r.ok} of ${r.n} gates right · ${r.time} s · 🪙 ${r.coins} · ${r.score} points${r.gems?` · 💎 +${r.gems}`:''}</p>
    ${Object.entries({time:'⏱ New best time!',score:'🏆 New high score!',streak:'🔥 Longest streak!',ok:'✅ Most right answers!'}).filter(([k])=>r.nb[k]).map(([,t])=>`<span class="agtier">${t}</span>`).join(' ')}
    ${r.beatGhost?'<p><b>👻 You beat your own ghost!</b></p>':''}${r.unlock?`<p><b>🔓 New track: ${esc(r.unlock)}!</b></p>`:''}${r.medal?'':`<p class="sol">Get half the gates right for a medal. Every wrong lane showed you the answer, so try again!</p>`}</div>`;
  if(r&&r.why==='done')r.seen=1;
  else if(r&&r.why==='time')card=`<div class="gcard" style="margin-bottom:16px"><h3>🌙 Play time is over for today</h3><p>${esc(earnNote())}</p></div>`;
  const paint=ktPaint(),trail=ktTrail();
  return `<div class="gworld">${clouds()}${gameHead('Turbo Trivia Kart',`${tr.n}: race, answer, boost!`)}${outOfTime()?restCard():''}${card}${subjChips()}
  <div class="gcard kcard" id="kcard"><h3>🏆 Pick a track</h3><div class="ktracks2">${KTR.map((t,i)=>{const o=ktOpen(i),md=S.med[t.id]||0,b=(S.pb[t.id]||{}).time;return `<button class="ktr2 ${t.id===tr.id?'on':''}" ${o?'':'disabled'} aria-pressed="${t.id===tr.id}" onclick="ARS('kart').tr='${t.id}';SYNC();rerealm()"><img src="${ktThumb(t).toDataURL()}" alt=""><b>${o?'':'🔒 '}${esc(t.n)}</b><span class="sol">${t.g} gates · ${o?(md?['','🥉','🥈','🥇'][md]+(b!=null?` ${b} s`:''):'No medal yet'):'Win a medal on '+esc(KTR[i-1].n)}</span></button>`}).join('')}</div>
  <h3 style="margin-top:16px">📊 Personal bests on ${esc(tr.n)}</h3><div class="kpbs"><div><b>${pb.time!=null?pb.time+' s':'–'}</b>Best time</div><div><b>${pb.ok||0}</b>Most right</div><div><b>${pb.score||0}</b>High score</div><div><b>${pb.streak||0}</b>Longest streak</div></div>
  <p class="sol">${S.gh[tr.id]?'👻 Your best run races with you as a ghost. Beat it!':'Win a medal and your best run becomes a ghost to race against.'}</p>
  <h3 style="margin-top:16px">🎨 Your kart</h3><div class="kprev"><img id="kprevimg" src="${kkart(paint,0,ktWheel(),ktDriver()).toDataURL()}" alt="Your kart from behind"><span class="sol">Unlock wheels, helmets and victory animations with kart achievements. See them all in the 📖 Collection Book.</span></div><p class="sol" style="margin:0">Paint</p><div class="kcust">${Object.keys(KPAINT).map(p=>{const h=AG.has('kart.paint.'+p),it=AG.item('kart.paint.'+p);return `<button style="background:${KPAINT[p]}" ${h?'':'disabled'} class="${p===paint?'on':''}" aria-pressed="${p===paint}" aria-label="${esc(it.n)}${h?'':': '+esc(it.how)}" title="${esc(it.n)}${h?'':': '+esc(it.how)}" onclick="ARS('kart').paint='${p}';SYNC();rerealm()"></button>`}).join('')}</div>
  <p class="sol" style="margin:8px 0 0">Trail</p><div class="kcust">${Object.keys(KTRAIL).map(t=>{const h=AG.has('kart.trail.'+t),it=AG.item('kart.trail.'+t);return `<button ${h?'':'disabled'} class="${t===trail?'on':''}" aria-pressed="${t===trail}" aria-label="${esc(it.n)}${h?'':': '+esc(it.how)}" title="${esc(it.n)}${h?'':': '+esc(it.how)}" onclick="ARS('kart').trail='${t}';SYNC();rerealm()">${it.i}</button>`}).join('')}</div>
  <p class="sol" style="margin:8px 0 0">Wheels</p><div class="kcust">${Object.keys(KWHEEL).map(t=>{const h=AG.has('kart.wheel.'+t),it=AG.item('kart.wheel.'+t),on=t===ktWheel();return `<button ${h?'':'disabled'} class="${on?'on':''}" aria-pressed="${on}" aria-label="${esc(it.n)}${h?'':': '+esc(it.how)}" title="${esc(it.n)}${h?'':': '+esc(it.how)}" onclick="ARS('kart').wheel='${t}';SYNC();rerealm()">${it.i}</button>`}).join('')}</div>
  <p class="sol" style="margin:8px 0 0">Driver</p><div class="kcust">${Object.keys(KDRIVER).map(t=>{const h=AG.has('kart.driver.'+t),it=AG.item('kart.driver.'+t),on=t===ktDriver();return `<button ${h?'':'disabled'} class="${on?'on':''}" aria-pressed="${on}" aria-label="${esc(it.n)}${h?'':': '+esc(it.how)}" title="${esc(it.n)}${h?'':': '+esc(it.how)}" onclick="ARS('kart').driver='${t}';SYNC();rerealm()">${it.i}</button>`}).join('')}</div>
  <p class="sol" style="margin:8px 0 0">Victory animation</p><div class="kcust">${Object.keys(KWIN).map(t=>{const h=AG.has('kart.win.'+t),it=AG.item('kart.win.'+t),on=t===ktWin();return `<button ${h?'':'disabled'} class="w ${on?'on':''}" aria-pressed="${on}" aria-label="${esc(it.n)}${h?'':': '+esc(it.how)}" title="${esc(it.n)}${h?'':': '+esc(it.how)}" onclick="ARS('kart').win='${t}';SYNC();rerealm()">${it.i} ${esc(it.n)}</button>`}).join('')}<button class="w" onclick="kwinPreview()">▶ Preview</button></div>
  <label class="ckline" style="margin-top:12px"><input type="checkbox" ${S.relax?'checked':''} onchange="ARS('kart').relax=this.checked;SYNC()"> Relaxed driving: the slowest speed and the most time to read</label></div>
  <div style="margin-top:14px">${AG.intro('kart','AG.play(\'kart\')')}</div></div>`};
</script>
