<script type="text/x-lumen">
/* ===== Mystery Mansion =====
   The Great Clock has stopped, and its five golden gears are hidden in five rooms. In each room, inspect things: two clue notes
   open with a right answer, and then a logic lock gives up the gear (a number pattern, putting books in order, cookie trays,
   a flower pattern, which trunk). Pip the mouse hides in every room. Put the gears in the clock tower to finish.
   Saved in ARS('mansion'); a new mystery shuffles every puzzle. ===== */
const MMR=[{id:'hall',n:'Front Hall',e:'🚪'},{id:'library',n:'Library',e:'📚'},{id:'kitchen',n:'Kitchen',e:'🍪'},{id:'green',n:'Greenhouse',e:'🌷'},{id:'attic',n:'Attic',e:'🧳'},{id:'tower',n:'Clock Tower',e:'🕰️'}];
const mmS=()=>{const S=ARS('mansion');if(!S.seed)Object.assign(S,{seed:1+Math.floor(Math.random()*1e6),gears:{},clues:{},pip:{},tries:{}});S.gears=S.gears||{};S.clues=S.clues||{};S.pip=S.pip||{};S.tries=S.tries||{};return S};
const mmOpen=i=>i===0||(i<5?!!mmS().gears[MMR[i-1].id]:MMR.slice(0,5).every(r=>mmS().gears[r.id]));
/* this mystery's puzzles, from the seed */
function mmPuzzles(){const S=mmS(),R=krng(S.seed),g=Math.max(0,myGrade()),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),sh=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const opts=(ans,cands)=>sh([...new Set([ans,...cands.filter(v=>v>0&&v!==ans)])].slice(0,4));
  const d=g<=1?ri(1,2):g<=3?ri(2,5):ri(3,9),s0=g<=1?ri(1,4):ri(2,20),seq=[0,1,2,3,4].map(i=>s0+i*d),hole=3;
  const top=g<=1?20:g<=3?99:999,lo=g<=1?1:g<=3?10:100,books=[];while(books.length<4){const v=ri(lo,top);if(!books.includes(v))books.push(v)}
  const M=g<=1?2:ri(2,5),k=ri(2,g<=1?4:6);
  const fl=['🌷','🌻','🌹','🌼'],pat=[['A','B'],['A','B','C'],['A','A','B'],['A','B','B']][g<=1?ri(0,1):ri(0,3)],pick4=sh(fl.slice()),row=Array.from({length:7},(_,i)=>pick4['ABC'.indexOf(pat[i%pat.length])]),nxt=pick4['ABC'.indexOf(pat[7%pat.length])];
  const T=['red','blue','green'],gi=ri(0,2),notA=T.filter((_,i)=>i!==gi),a=notA[ri(0,1)],b=notA.find(x=>x!==a);
  return{hall:{k:'seq',seq,hole,ans:seq[hole],opts:opts(seq[hole],[seq[hole]+d,seq[hole]-d,seq[hole]+1,seq[hole]-1])},
    library:{k:'sort',books,ans:books.slice().sort((x,y)=>x-y)},
    kitchen:{k:'trays',M,kk:k,N:M*k,young:g<=1,ans:g<=1?M*k:k,opts:g<=1?opts(M*k,[M*k+M,M*k-1,M*k+1,M+k]):opts(k,[k+1,k-1,k+2,M])},
    green:{k:'pattern',row,ans:nxt,opts:sh(fl.slice())},
    attic:{k:'logic',T,g:T[gi],a,b,ans:T[gi]}}}
/* each room's things: [id, name, kind, x, y, w, h, text]. clue1/clue2 need a right answer; lock is the puzzle */
const MMO={
  hall:[['clock','Grandfather clock','flavor',470,70,70,230,'The grandfather clock stopped at 3 o\'clock. Every clock in the mansion needs the golden gears!'],['paint','Painting','clue1',250,60,110,80],['umb','Umbrella stand','clue2',80,230,50,80],['coat','Coat hooks','lock',150,90,80,40],['pip','Mouse hole','pip',380,206,26,20]],
  library:[['globe','Globe','flavor',440,200,70,100,'You spin the globe. It stops on the Pacific, the biggest ocean on Earth.'],['desk','Open book','clue1',300,215,90,40],['fire','Fireplace','clue2',40,150,120,150],['shelf','Bookshelf','lock',200,40,170,150],['pip','Under the armchair','pip',545,280,40,22]],
  kitchen:[['cat','Biscuit the cat','flavor',470,240,70,50,'Biscuit the cat purrs. She is guarding the cookie jar.'],['recipe','Recipe book','clue1',300,210,70,30],['jars','Jar shelf','clue2',60,60,140,90],['oven','Oven','lock',380,120,120,130],['pip','Behind the flour sack','pip',230,262,40,36]],
  green:[['fount','Fountain','flavor',470,190,100,100,'Plants use sunlight, water and air to make their own food.'],['can','Watering can','clue1',60,250,60,40],['bench','Bench','clue2',230,240,120,40],['bed','Flower bed','lock',60,150,380,60],['pip','Flower pot','pip',400,262,34,30]],
  attic:[['toys','Toy box','flavor',470,240,90,60,'A box of old toys. A wind-up robot waves at you!'],['win','Round window','clue1',280,40,80,80],['map','Old map','clue2',60,70,100,70],['trunks','Three trunks','lock',140,210,300,80],['pip','Behind the lamp','pip',575,190,30,40]],
  tower:[['face','The Great Clock','lock',220,30,200,200]]};
const MMCLUE={hall:['A note behind the painting: "The coat hooks are numbered in a pattern."','A note in the umbrella stand: "Find the missing hook number to open the lock."'],
  library:['A bookmark in the open book: "The gear is behind the books, if you put them in order."','A note on the fireplace: "Smallest number first, biggest number last."'],
  kitchen:[P=>P.young?`The recipe: "Bake ${P.kk} trays of cookies."`:`The recipe: "This makes ${P.N} cookies."`,P=>`A label on the shelf: "Each baking tray holds ${P.M} cookies."`],
  green:['A tag on the watering can: "The flowers grow in a repeating pattern."','A note on the bench: "Plant the next flower in the pattern to open the gate."'],
  attic:[P=>`Scratched on the window frame: "The gear is not in the ${P.a} trunk."`,P=>`Written on the old map: "The ${P.b} trunk is empty."`]};
const mmClue=(r,i,P)=>{const c=MMCLUE[r][i];return typeof c==='function'?c(P[r]):c};

AG.def({id:'mansion',name:'Mystery Mansion',w:640,h:340,maxW:1280,vh:470,snd:'blocks',music:'blocks',go:'Enter the mansion',sub:'Find the five golden gears',
  help:['You watch the mansion through security cameras. Turn the camera with the arrow keys or WASD; the arrows on the sides switch cameras (rooms).','Tap things to look at them, or point the middle of the camera at them and press Space. The scale at the bottom swings toward the nearest thing to look at.','Two clue notes in each room open when you answer a question. Then the lock asks a logic puzzle, and the golden gear is yours.','Each gear opens the next room. Put all five in the Great Clock in the tower. And look out for Pip the mouse!'],
  keys:[['← → ↑ ↓','turn the camera'],['Space','snap what is in the middle'],['Q E','switch cameras'],['P','pause']],timeup:true,
  ach:{gear:{i:'⚙️',n:'First gear',d:'Find a golden gear',gems:1},clock:{i:'🕰️',n:'Clockwork hero',d:'Start the Great Clock',gems:5},pip:{i:'🐭',n:'Pip\'s friend',d:'Find Pip in all five rooms',gems:2},
    sharp:{i:'🧠',n:'Sharp mind',d:'Open a lock on the first try',gems:1},again:{i:'🔁',n:'Mystery lover',d:'Solve the mansion twice',gems:3}},
  places:()=>MMR.map((r,i)=>({on:mmOpen(i),i:r.e,n:r.n,s:mmS().gears[r.id]?'⚙️ Gear found':'Open',how:i?`Find the gear in the ${MMR[i-1].n}`:''})),
  start(o){const S=mmS();let i=MMR.findIndex(r=>r.id===(o&&o.room||S.room));if(i<0||!mmOpen(i))i=Math.max(0,MMR.findIndex((r,j)=>mmOpen(j)&&!S.gears[r.id]));if(i<0)i=5;
    return{room:MMR[i].id,P:mmPuzzles(),hov:null,pz:null,msg:'',t:0,sort:[],trip:{gears:0,pip:0},spin:0,ptr:null,ptrT:-9,cam:[320,190],snap:0,stat:0,inT:0}},
  ready(Z){mmEnter(Z,Z.room,1);const cv=$('agcv');if(cv){cv.style.cursor='none';cv.onpointermove=e=>{const r=cv.getBoundingClientRect();Z.ptr=[(e.clientX-r.left)/r.width*640,(e.clientY-r.top)/r.height*340];Z.ptrT=Z.t};cv.onpointerleave=()=>{Z.ptr=null}}},
  step(dt,Z){Z.t+=dt;if(Z.spin>0){Z.spin+=dt;if(Z.spin>3.2){Z.spin=0;AG.finish(mmTrip(Z,'clock'))}}
    /* turn the camera: arrow keys or WASD (or the touch pad) */
    const dx=(AG.held.has('right')?1:0)-(AG.held.has('left')?1:0),dy=(AG.held.has('down')?1:0)-(AG.held.has('up')?1:0);if(dx||dy){Z.cam[0]+=dx*230*dt;Z.cam[1]+=dy*230*dt;Z.ptr=null}mmClamp(Z);
    if(Z.snap>0)Z.snap-=dt;if(Z.stat>0)Z.stat-=dt;const r=mmRet(Z);Z.hov=Z.stat>0?null:mmHit(Z,...mmScene(Z,r[0],r[1]))},
  draw(a,Z){const x=AG.cx;if(!x)return;x.fillStyle='#0B0910';x.fillRect(0,0,640,340);x.save();x.translate(320,170);x.scale(MMZ,MMZ);x.translate(-Z.cam[0],-Z.cam[1]);mmDraw(x,Z);
    const o=Z.hov&&MMO[Z.room].find(q=>q[0]===Z.hov);if(o&&o[2]!=='pip')mmFocusBox(x,o[3]-5,o[4]-5,o[5]+10,o[6]+10,'#FDE047');x.restore();mmViewfinder(x,Z)},
  key(k,down,Z){if(!down)return;if(k==='prev'||k==='next')return mmCamStep(Z,k==='next'?1:-1);if((k==='act'||k==='enter')&&Z.hov){Z.snap=.32;SND.play('click');mmLook(Z,Z.hov)}},
  tap(px,py,Z){if(py>130&&py<210&&(px<56||px>584))return mmCamStep(Z,px<56?-1:1);const id=mmHit(Z,...mmScene(Z,px,py));if(id){Z.snap=.32;SND.play('click');mmLook(Z,id)}},
  timeout:Z=>mmTrip(Z,'time')});
const mmHit=(Z,px,py)=>{const o=MMO[Z.room].find(q=>px>=q[3]&&px<=q[3]+q[5]&&py>=q[4]&&py<=q[4]+q[6]);return o?o[0]:null};
/* ---------- The rooms: cozy isometric interiors (two papered walls, a floor, shaded furniture) ---------- */
const MMB={},MI={T:[320,146],U:[212,106],V:[-212,106],H:136};
const mip=(u,v,h=0)=>[MI.T[0]+u*MI.U[0]+v*MI.V[0],MI.T[1]+u*MI.U[1]+v*MI.V[1]-h];
const MMPAL={hall:{wl:'#7B3F5E',wr:'#6C3552',pat:'#E9B949',trim:'#F2E6D0',fl:'marble',f1:'#EDE6DA',f2:'#4B3A52',wain:'#4A2338'},
  library:{wl:'#2F5D50',wr:'#284F44',pat:'#C9A15A',trim:'#E9D8B4',fl:'wood',f1:'#9A6438',f2:'#7E4F2A',wain:'#5A3420'},
  kitchen:{wl:'#E9DDC5',wr:'#DCCFB4',pat:'#B9A47E',trim:'#FFFFFF',fl:'tile',f1:'#F3E7D2',f2:'#B5452B',wain:'#6E8F6A',tiles:1},
  green:{wl:'#BFE6DA',wr:'#AFDACC',pat:'#FFFFFF',trim:'#FFFFFF',fl:'stone',f1:'#C9C2B6',f2:'#B2AA9C',wain:'#7A9A86',glass:1},
  attic:{wl:'#8A6646',wr:'#7A583B',pat:'#6B4A30',trim:'#5E4129',fl:'wood',f1:'#8C6542',f2:'#77532F',wain:'#5E4129',beams:1},
  tower:{wl:'#2E2848',wr:'#27223F',pat:'#C8961E',trim:'#C8961E',fl:'wood',f1:'#3B3150',f2:'#33294A',wain:'#1E1A30'}};
function mmBack(r){if(MMB[r])return MMB[r];const cv=document.createElement('canvas');cv.width=1280;cv.height=680;const x=cv.getContext('2d');x.scale(2,2);const P=MMPAL[r],R=krng(r.length*97);
  const poly=(pts,f)=>{x.fillStyle=f;x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))x.lineTo(p[0],p[1]);x.closePath();x.fill()};
  const lg=(x0,y0,x1,y1,st)=>{const g=x.createLinearGradient(x0,y0,x1,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g};
  const rg=(cx,cy,r0,r1,st)=>{const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g};
  /* draw in a flat space mapped onto a plane: the floor (u,v in 0..1), the left wall (v 0..1, height up) or the right wall (u 0..1, height up) */
  const plane=(which,fn)=>{x.save();if(which==='floor')x.transform(MI.U[0],MI.U[1],MI.V[0],MI.V[1],MI.T[0],MI.T[1]);else if(which==='L')x.transform(MI.V[0],MI.V[1],0,-1,MI.T[0],MI.T[1]);else x.transform(MI.U[0],MI.U[1],0,-1,MI.T[0],MI.T[1]);fn();x.restore()};
  const hot=(id,pts)=>{const o=MMO[r].find(q=>q[0]===id);if(!o)return;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys);o[3]=Math.round(x0);o[4]=Math.round(y0);o[5]=Math.round(Math.max(...xs)-x0);o[6]=Math.round(Math.max(...ys)-y0)};
  /* a box sitting on the floor: u,v corner, du,dv size, h height, z lift; returns its outline */
  const box=(u,v,du,dv,h,top,left,right,z=0)=>{const A=mip(u,v,z+h),B=mip(u+du,v,z+h),C=mip(u+du,v+dv,z+h),D=mip(u,v+dv,z+h),Bg=mip(u+du,v,z),Cg=mip(u+du,v+dv,z),Dg=mip(u,v+dv,z);
    poly([D,C,Cg,Dg],left);poly([B,C,Cg,Bg],right);poly([A,B,C,D],top);return[A,B,C,D,Bg,Cg,Dg]};
  /* draw on a box's front faces: 'L' faces you on the left (along u), 'R' on the right (along v); s 0..1 across, t up in pixels */
  const face=(side,u,v,du,dv,z,fn)=>{x.save();if(side==='L'){const o=mip(u,v+dv,z);x.transform(MI.U[0]*du,MI.U[1]*du,0,-1,o[0],o[1])}else{const o=mip(u+du,v,z);x.transform(MI.V[0]*dv,MI.V[1]*dv,0,-1,o[0],o[1])}fn();x.restore()};
  const shadow=(u,v,du,dv)=>plane('floor',()=>{x.fillStyle='rgba(30,15,20,.22)';x.beginPath();x.ellipse(u+du/2+.015,v+dv/2+.015,du*.62,dv*.62,0,0,7);x.fill()});
  const ell=(cx,cy,rx,ry,f)=>{x.fillStyle=f;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill()};
  /* ---- walls ---- */
  const WL=[mip(0,1),mip(0,0),mip(0,0,MI.H),mip(0,1,MI.H)],WR=[mip(0,0),mip(1,0),mip(1,0,MI.H),mip(0,0,MI.H)];
  x.fillStyle=lg(0,0,0,340,['#2A1E2E','#120C14']);x.fillRect(0,0,640,340);
  poly(WL,P.wl);poly(WR,P.wr);
  for(const w of ['L','R'])plane(w,()=>{const L=1;
    if(P.glass){x.fillStyle='rgba(255,255,255,.28)';for(let s=0;s<1;s+=.12){x.fillRect(s+.01,4,.04,MI.H-8)}x.fillStyle='#FFFFFF';for(let s=0;s<=1.001;s+=.12)x.fillRect(s,0,.012,MI.H);for(let t=0;t<=MI.H;t+=32)x.fillRect(0,t,1,1.6)}
    else if(P.tiles){x.fillStyle='rgba(0,0,0,.06)';for(let t=0;t<44;t+=8)for(let s=0;s<1;s+=.05)if(((t/8)+(s/.05|0))%2)x.fillRect(s,t,.05,8);x.fillStyle='rgba(160,140,110,.35)';for(let t=0;t<=44;t+=8)x.fillRect(0,t,1,.6)}
    else if(P.beams){x.fillStyle='rgba(0,0,0,.18)';for(let s=0;s<1;s+=.2)x.fillRect(s,0,.025,MI.H);x.fillStyle='rgba(255,220,170,.06)';for(let t=6;t<MI.H;t+=10)x.fillRect(0,t,1,1)}
    else{/* damask wallpaper */x.fillStyle=P.pat;x.globalAlpha=.22;for(let t=30;t<MI.H-6;t+=14)for(let s=((t/14)%2)*.03;s<1;s+=.06){x.beginPath();x.ellipse(s,t,.012,4,0,0,7);x.fill();x.fillRect(s-.002,t-6,.004,12)}x.globalAlpha=1;
      x.fillStyle=lg(0,0,0,30,[P.wain,shade(P.wain,.8)]);x.fillRect(0,0,1,30);x.fillStyle='rgba(255,255,255,.1)';for(let s=.03;s<1;s+=.09)x.fillRect(s,5,.06,1),x.fillRect(s,24,.06,1),x.fillRect(s,5,.004,20),x.fillRect(s+.056,5,.004,20);x.fillStyle=P.trim;x.fillRect(0,30,1,2.5)}
    x.fillStyle=P.trim;x.fillRect(0,MI.H-5,1,5);x.fillStyle=shade(P.trim,.8);x.fillRect(0,MI.H-6.5,1,1.5);x.fillStyle=shade(P.wain,.6);x.fillRect(0,0,1,4)});
  poly([mip(0,0),mip(0,0,MI.H),mip(0,0,MI.H).map((c,i)=>c+(i?0:3)),mip(0,0).map((c,i)=>c+(i?0:3))],'rgba(0,0,0,.18)');
  /* the box: wall tops with thickness, wall ends and a floor slab */
  {const t=.035;poly([mip(0,1,MI.H),mip(0,0,MI.H),mip(-t,-t,MI.H),mip(-t,1,MI.H)],shade(P.trim,.85));poly([mip(0,0,MI.H),mip(1,0,MI.H),mip(1,-t,MI.H),mip(-t,-t,MI.H)],P.trim);
    poly([mip(0,1,0),mip(0,1,MI.H),mip(-t,1,MI.H),mip(-t,1,-14)],shade(P.wl,.55));poly([mip(1,0,0),mip(1,0,MI.H),mip(1,-t,MI.H),mip(1,-t,-14)],shade(P.wr,.5))}
  /* ---- floor ---- */
  plane('floor',()=>{x.fillStyle=P.f1;x.fillRect(0,0,1,1);
    if(P.fl==='wood'){for(let i=0;i<14;i++){x.fillStyle=i%2?P.f1:P.f2;x.fillRect(i/14,0,1/14,1);x.fillStyle='rgba(0,0,0,.18)';x.fillRect(i/14,0,.002,1);for(let j=0;j<4;j++){const y0=((i*37+j*29)%100)/100;x.fillRect(i/14,y0,1/14,.003)}}}
    else if(P.fl==='marble'||P.fl==='tile'){const n=P.fl==='tile'?12:8;for(let i=0;i<n;i++)for(let j=0;j<n;j++){if((i+j)%2){x.fillStyle=P.f2;x.fillRect(i/n,j/n,1/n,1/n)}}x.fillStyle='rgba(255,255,255,.12)';for(let k=0;k<6;k++){x.fillRect(R(),R(),.12,.004)}}
    else{for(let i=0;i<8;i++)for(let j=0;j<8;j++){x.fillStyle=(i*5+j*3)%4?P.f1:P.f2;x.fillRect(i/8+.003,j/8+.003,1/8-.006,1/8-.006)}}
    x.fillStyle=lg(0,0,.25,0,['rgba(0,0,0,.25)','rgba(0,0,0,0)']);x.fillRect(0,0,.25,1);x.fillStyle=lg(0,0,0,.25,['rgba(0,0,0,.25)','rgba(0,0,0,0)']);x.fillRect(0,0,1,.25)});
  /* wall things: a window, frames, shelves (drawn on a wall plane: s along, t up) */
  const onWall=(w,fn)=>plane(w,fn);
  const windowOn=(w,s0,ws,t0,ht,sky)=>{onWall(w,()=>{x.fillStyle=P.trim;x.fillRect(s0-.012,t0-4,ws+.024,ht+8);x.fillStyle=lg(0,t0,0,t0+ht,sky||['#FDE9B8','#9ED8F5']);x.fillRect(s0,t0,ws,ht);x.fillStyle=P.trim;x.fillRect(s0+ws/2-.005,t0,.01,ht);x.fillRect(s0,t0+ht*.55,ws,2);
    x.fillStyle='rgba(255,255,255,.35)';x.fillRect(s0+.01,t0+ht*.6,ws*.18,ht*.35);x.fillStyle='#B91C1C';x.fillRect(s0-.03,t0-6,.032,ht+10);x.fillRect(s0+ws-.002,t0-6,.032,ht+10);x.fillStyle='#E8C46A';x.fillRect(s0-.04,t0+ht+3,ws+.08,2.5)})};
  const frameOn=(w,id,s0,ws,t0,ht,fn)=>{onWall(w,()=>{x.fillStyle=lg(0,t0,0,t0+ht,['#F2D27A','#A87420']);x.fillRect(s0-.012,t0-3,ws+.024,ht+6);x.fillStyle='#2A1A10';x.fillRect(s0,t0,ws,ht);fn&&fn(s0,ws,t0,ht)});

  const objs=MMO[r].filter(o=>o[2]!=='pip').map(o=>{const got=(o[2]==='clue1'||o[2]==='clue2')&&S.clues[r+':'+o[2]],lk=o[2]==='lock'&&S.gears[r];return `<button class="chip ${got||lk?'found':''}" onclick="AG.cur&&mmLook(AG.cur.st,'${o[0]}')">${o[2]==='lock'?(lk?'⚙️':'🔒'):got?'📜':'🔍'} ${esc(o[1])}</button>`}).join('');
  e.innerHTML=`<span class="who">${R.e} ${esc(R.n)}</span>${esc(Z.msg)}${pz}<div class="mmobj" role="group" aria-label="Things to look at">${objs}${r!=='tower'?`<button class="chip" onclick="AG.cur&&mmLook(AG.cur.st,'pip')" aria-label="Look in the corners">👀 Corners</button>`:''}</div>
  <div class="mmrooms" role="group" aria-label="Rooms"><span class="mmgears" aria-label="${MMR.slice(0,5).filter(q=>S.gears[q.id]).length} of 5 gears">${MMR.slice(0,5).map(q=>`<span class="${S.gears[q.id]?'':'no'}">⚙️</span>`).join('')}</span>${MMR.map((q,i)=>`<button class="chip ${q.id===r?'on':''}" ${mmOpen(i)?'':'disabled'} aria-pressed="${q.id===r}" onclick="AG.cur&&mmEnter(AG.cur.st,'${q.id}')">${mmOpen(i)?q.e:'🔒'} ${esc(q.n)}</button>`).join('')}
  <button class="chip" style="margin-left:auto" onclick="AG.cur&&AG.finish(mmTrip(AG.cur.st,'leave'))">🚪 Leave</button></div>`}
/* ---------- The menu ---------- */
GVIEW.mansion=function(){const C=AG.cur&&AG.cur.id==='mansion'?AG.cur:null;
  if(C&&['load','play','crash'].includes(C.phase))return AG.screen('mansion',{below:'<div class="mmbox" id="mmbox" aria-live="polite"></div>'+AG.pad([[{k:'left',l:'◀',a:'Turn left'},{k:'up',l:'▲',a:'Turn up'},{k:'down',l:'▼',a:'Turn down'},{k:'right',l:'▶',a:'Turn right'}],[{k:'prev',l:'⏮',a:'Previous camera'},{k:'act',l:'📷',a:'Snap a photo'},{k:'next',l:'⏭',a:'Next camera'}]])});
  const S=mmS(),r=C&&C.phase==='end'?C.res:null,n=MMR.slice(0,5).filter(q=>S.gears[q.id]).length,done=r&&r.why==='clock';
  const card=r?`<div class="gcard endcard" style="margin-bottom:16px"><div class="big" aria-hidden="true">${done?'🕰️':r.why==='time'?'🌙':'🚪'}</div><h3>${done?'The Great Clock is ticking again!':r.why==='time'?'Play time is over for today':'See you soon!'}</h3>
    <p>${done?`You solved the mansion${r.runs>1?` ${r.runs} times`:''}! 💎 +${r.runs===1?15:5}`:`This visit: ${r.gears} gear${r.gears===1?'':'s'}, ${r.pip} Pip sighting${r.pip===1?'':'s'}.`}</p></div>`:'';
  return `<div class="gworld">${clouds()}${gameHead('Mystery Mansion','Find the five golden gears and start the Great Clock.')}${outOfTime()?restCard():''}${card}${subjChips()}
  <div class="gcard"><div class="split"><h3>🏚️ The mansion</h3><span class="mmgears">${MMR.slice(0,5).map(q=>`<span class="${S.gears[q.id]?'':'no'}">⚙️</span>`).join('')}</span></div>
  <p class="sol" style="margin:4px 0 0">${n} of 5 gears found · Pip found in ${Object.keys(S.pip).length} of 5 rooms${S.runs?` · solved ${S.runs} time${S.runs>1?'s':''}`:''}</p>
  ${S.runs&&n===5||done?`<div class="row" style="margin-top:10px"><button class="abtn gold" ${outOfTime()?'disabled':''} onclick="mmNew()">🔀 Start a new mystery</button><span class="sol">New puzzles, and the gears hide again.</span></div>`:''}</div>
  <div style="margin-top:14px">${AG.intro('mansion','AG.play(\'mansion\')')}</div></div>`};
AQS.mmg={i:'⚙️',t:'Find a golden gear in Mystery Mansion',n:1,g:'mansion'};
GAMES.push({id:'mansion',n:'Mystery Mansion',p:'A friendly mystery: read clue notes with smart answers, solve logic locks and find the five golden gears.'});
