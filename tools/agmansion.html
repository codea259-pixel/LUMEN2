  else if(o[2]==='clue1'||o[2]==='clue2'){const ci=o[2]==='clue1'?0:1,key=r+':'+o[2];if(S.clues[key]){Z.msg=mmClue(r,ci,Z.P)}else{mmBox(Z);const ok=await AG.ask({title:o[1],intro:'Answer to read the clue!'});if(!AG.on('mansion')||AG.cur.st!==Z)return;
      if(ok){S.clues[key]=1;SYNC();Z.msg=`📜 ${mmClue(r,ci,Z.P)}`}else if(ok===false)Z.msg='The note is too smudged to read. Try again!';else Z.msg=''}}
  else if(o[2]==='lock'){if(r==='tower'){if(S.spun)Z.msg='The Great Clock is ticking happily. Start a new mystery from the mansion menu!';else if(MMR.slice(0,5).every(q=>S.gears[q.id])){S.spun=1;SYNC();Z.spin=.01;Z.msg='Click, click, click... the gears turn and the Great Clock starts ticking! 🎉';SND.play('win','ui')}else Z.msg='The clock needs all five golden gears.'}
    else if(S.gears[r])Z.msg='You already found this room\'s gear. ⚙️';
    else if(!S.clues[r+':clue1']||!S.clues[r+':clue2'])Z.msg='It\'s locked. Find both clue notes in this room first.';
    else{Z.pz=r;Z.msg='Solve the puzzle to open it!'}}
  mmBox(Z)}
function mmTry(Z,v){const S=mmS(),r=Z.pz,P=Z.P[r];if(!r)return;let ok;
  if(P.k==='sort'){Z.sort.push(v);const want=P.ans.slice(0,Z.sort.length);if(Z.sort.join()!==want.join()){Z.sort=[];S.tries[r]=(S.tries[r]||0)+1;Z.msg='Oops! Start again with the smallest number.';SND.play('no');return mmBox(Z)}
    if(Z.sort.length<4){SND.play('click');return mmBox(Z)}ok=true}else ok=v===P.ans;
  if(!ok){S.tries[r]=(S.tries[r]||0)+1;Z.msg='Not quite. Read the clue notes again and try once more.';SND.play('no');return mmBox(Z)}
  if(!S.tries[r])AG.ach('mansion','sharp');S.gears[r]=1;Z.trip.gears++;const first=!S.runs;addGems(first?3:1);SYNC();SND.play('unlock');AG.ach('mansion','gear');aqBump('mmg');Z.pz=null;
  const i=MMR.findIndex(q=>q.id===r);Z.msg=`Click! The lock opens and you find a golden gear! ⚙️ +${first?3:1} 💎 ${i<4?`The door to the ${MMR[i+1].n} is open now.`:'All five gears! Head up to the Clock Tower.'}`;mmBox(Z)}
function mmTrip(Z,why){const S=mmS();if(why==='clock'){S.runs=(S.runs||0)+1;addGems(S.runs===1?15:5);AG.ach('mansion','clock');if(S.runs>=2)AG.ach('mansion','again')}return{why,gears:Z.trip.gears,pip:Z.trip.pip,runs:S.runs||0}}
function mmNew(){const S=ARS('mansion');Object.assign(S,{seed:1+Math.floor(Math.random()*1e6),gears:{},clues:{},tries:{},room:'hall',spun:0});SYNC();AG.play('mansion',{room:'hall'})}
/* the text box, the things in the room, and the puzzles */
function mmBox(Z){const e=$('mmbox');if(!e)return;const S=mmS(),r=Z.room,R=MMR.find(q=>q.id===r),P=Z.P[Z.pz||r];let pz='';
  if(Z.pz){if(P.k==='seq')pz=`<b>The coat hooks are numbered. What number goes on the empty hook?</b><div class="seq">${P.seq.map((v,i)=>`<span class="${i===P.hole?'q':''}">${i===P.hole?'?':v}</span>`).join('')}</div><div class="opts">${P.opts.map(v=>`<button class="abtn sec" onclick="AG.cur&&mmTry(AG.cur.st,${v})">${v}</button>`).join('')}</div>`;
    else if(P.k==='sort')pz=`<b>Tap the books from the smallest number to the biggest.</b><div class="opts" style="margin-top:8px">${P.books.map(v=>`<button class="abtn ${Z.sort.includes(v)?'':'sec'}" ${Z.sort.includes(v)?'disabled':''} onclick="AG.cur&&mmTry(AG.cur.st,${v})">📕 ${v}</button>`).join('')}</div><p class="sol" style="margin:6px 0 0">In order so far: ${Z.sort.join(', ')||'none yet'}</p>`;
    else if(P.k==='trays')pz=`<b>${P.young?`There are ${P.kk} trays, and each tray holds ${P.M} cookies. How many cookies in all?`:`The recipe makes ${P.N} cookies, and each tray holds ${P.M}. How many trays do you need?`}</b><div class="opts" style="margin-top:8px">${P.opts.map(v=>`<button class="abtn sec" onclick="AG.cur&&mmTry(AG.cur.st,${v})">${v}</button>`).join('')}</div>`;
    else if(P.k==='pattern')pz=`<b>Which flower comes next in the pattern?</b><div class="seq">${P.row.map(v=>`<span>${v}</span>`).join('')}<span class="q">?</span></div><div class="opts">${P.opts.map(v=>`<button class="abtn sec" aria-label="${v}" onclick="AG.cur&&mmTry(AG.cur.st,'${v}')">${v}</button>`).join('')}</div>`;
    else if(P.k==='logic')pz=`<b>Which trunk holds the gear? Use both clue notes.</b><ul style="margin:6px 0">${[mmClue('attic',0,Z.P),mmClue('attic',1,Z.P)].map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="opts">${P.T.map(v=>`<button class="abtn sec" onclick="AG.cur&&mmTry(AG.cur.st,'${v}')">${v[0].toUpperCase()+v.slice(1)} trunk</button>`).join('')}</div>`;
    pz=`<div class="mmpz">${pz}</div>`}
  const objs=MMO[r].filter(o=>o[2]!=='pip').map(o=>{const got=(o[2]==='clue1'||o[2]==='clue2')&&S.clues[r+':'+o[2]],lk=o[2]==='lock'&&S.gears[r];return `<button class="chip ${got||lk?'found':''}" onclick="AG.cur&&mmLook(AG.cur.st,'${o[0]}')">${o[2]==='lock'?(lk?'⚙️':'🔒'):got?'📜':'🔍'} ${esc(o[1])}</button>`}).join('');
  e.innerHTML=`<span class="who">${R.e} ${esc(R.n)}</span>${esc(Z.msg)}${pz}<div class="mmobj" role="group" aria-label="Things to look at">${objs}${r!=='tower'?`<button class="chip" onclick="AG.cur&&mmLook(AG.cur.st,'pip')" aria-label="Look in the corners">👀 Corners</button>`:''}</div>
  <div class="mmrooms" role="group" aria-label="Rooms"><span class="mmgears" aria-label="${MMR.slice(0,5).filter(q=>S.gears[q.id]).length} of 5 gears">${MMR.slice(0,5).map(q=>`<span class="${S.gears[q.id]?'':'no'}">⚙️</span>`).join('')}</span>${MMR.map((q,i)=>`<button class="chip ${q.id===r?'on':''}" ${mmOpen(i)?'':'disabled'} aria-pressed="${q.id===r}" onclick="AG.cur&&mmEnter(AG.cur.st,'${q.id}')">${mmOpen(i)?q.e:'🔒'} ${esc(q.n)}</button>`).join('')}
  <button class="chip" style="margin-left:auto" onclick="AG.cur&&AG.finish(mmTrip(AG.cur.st,'leave'))">🚪 Leave</button></div>`}
/* ---------- The menu ---------- */
GVIEW.mansion=function(){const C=AG.cur&&AG.cur.id==='mansion'?AG.cur:null;
  if(C&&['load','play','crash'].includes(C.phase))return AG.screen('mansion',{below:'<div class="mmbox" id="mmbox" aria-live="polite"></div>'});
  const S=mmS(),r=C&&C.phase==='end'?C.res:null,n=MMR.slice(0,5).filter(q=>S.gears[q.id]).length,done=r&&r.why==='clock';
  const card=r?`<div class="gcard endcard" style="margin-bottom:16px"><div class="big" aria-hidden="true">${done?'🕰️':r.why==='time'?'🌙':'🚪'}</div><h3>${done?'The Great Clock is ticking again!':r.why==='time'?'Play time is over for today':'See you soon!'}</h3>
    <p>${done?`You solved the mansion${r.runs>1?` ${r.runs} times`:''}! 💎 +${r.runs===1?15:5}`:`This visit: ${r.gears} gear${r.gears===1?'':'s'}, ${r.pip} Pip sighting${r.pip===1?'':'s'}.`}</p></div>`:'';
  return `<div class="gworld">${clouds()}${gameHead('Mystery Mansion','Find the five golden gears and start the Great Clock.')}${outOfTime()?restCard():''}${card}${subjChips()}
  <div class="gcard"><div class="split"><h3>🏚️ The mansion</h3><span class="mmgears">${MMR.slice(0,5).map(q=>`<span class="${S.gears[q.id]?'':'no'}">⚙️</span>`).join('')}</span></div>
  <p class="sol" style="margin:4px 0 0">${n} of 5 gears found · Pip found in ${Object.keys(S.pip).length} of 5 rooms${S.runs?` · solved ${S.runs} time${S.runs>1?'s':''}`:''}</p>
  ${S.runs&&n===5||done?`<div class="row" style="margin-top:10px"><button class="abtn gold" ${outOfTime()?'disabled':''} onclick="mmNew()">🔀 Start a new mystery</button><span class="sol">New puzzles, and the gears hide again.</span></div>`:''}</div>
  <div style="margin-top:14px">${AG.intro('mansion','AG.play(\'mansion\')')}</div></div>`};
AQS.mmg={i:'⚙️',t:'Find a golden gear in Mystery Mansion',n:1,g:'mansion'};
GAMES.push({id:'mansion',n:'Mystery Mansion',p:'A friendly mystery: read clue notes with smart answers, solve logic locks and find the five golden gears.'});

</script>
