const SQNPC={meadow:{n:'Farmer Fen',h:'#5A3825',c:'#C0392B',say:['Hello, traveler! Creatures love to hide in the tall grass.','Walk through it, and one might hop out to meet you.','Answer well and they will want to be your friend!']},

  volcano:'Danger: lava. Stay on the path.',sky:'Cloud path: soft, bouncy and totally safe.',keep:'Only the brave and the curious may pass.'};

/* ---------- Pixel art: shapes are filled into a grid of color codes, then outlined ---------- */
const SQIMG={},SQC={};
function sqGrid(N,fill,pal){const g=new Uint8Array(N*N),set=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<N&&y<N)g[y*N+x]=c};fill(set,g,N);
  const cv=document.createElement('canvas');cv.width=cv.height=N;const x=cv.getContext('2d'),im=x.createImageData(N,N),d=im.data,rgb={};
  for(const k in pal){const h=pal[k];rgb[k]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  for(let y=0;y<N;y++)for(let i=0;i<N;i++){const v=g[y*N+i];let c=v?rgb[v]:null;
    if(!v){const n=(a,b)=>a>=0&&b>=0&&a<N&&b<N&&g[b*N+a];if(n(i-1,y)||n(i+1,y)||n(i,y-1)||n(i,y+1))c=rgb.o}
    if(c){const j=(y*N+i)*4;d[j]=c[0];d[j+1]=c[1];d[j+2]=c[2];d[j+3]=255}}
  x.putImageData(im,0,0);return cv}
/* A creature from its MONS entry [name, shape, color, accessories], N x N pixels */
function sqMon(m,N=32){const key=m[0]+N;if(SQC[key])return SQC[key];const [,shape,c,acc]=m,A=a=>acc.includes(a),s=N/32,
  ac=A('flame')?'#FF8A3D':A('crystals')?'#7FE3F0':A('cap')?'#E04E4E':A('leaf')?'#5FB548':A('cloud')?'#FFFFFF':'#FFE27A';
  const pal={o:'#1E1B2E',1:c,2:tint(c,.4),3:shade(c,.62),4:'#1B1B2F',5:'#FFFFFF',6:'#FFE27A',7:'#FF8FB1',8:ac,9:tint(c,.2),10:shade(c,.82)};
  const cv=sqGrid(N,(set,g)=>{const S=v=>v*s,P=(x,y,k)=>set(S(x),S(y),k),
    ell=(cx,cy,rx,ry,k)=>{for(let y=Math.floor(S(cy-ry));y<=Math.ceil(S(cy+ry));y++)for(let x=Math.floor(S(cx-rx));x<=Math.ceil(S(cx+rx));x++){const dx=(x+.5-S(cx))/S(rx),dy=(y+.5-S(cy))/S(ry);if(dx*dx+dy*dy<=1)set(x,y,k)}},
    rect=(x0,y0,x1,y1,k)=>{for(let y=Math.round(S(y0));y<=Math.round(S(y1));y++)for(let x=Math.round(S(x0));x<=Math.round(S(x1));x++)set(x,y,k)},
    tri=(ax,ay,bx,by,cx,cy,k)=>{[ax,ay,bx,by,cx,cy]=[ax,ay,bx,by,cx,cy].map(S);const D=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);if(!D)return;
      for(let y=Math.floor(Math.min(ay,by,cy));y<=Math.ceil(Math.max(ay,by,cy));y++)for(let x=Math.floor(Math.min(ax,bx,cx));x<=Math.ceil(Math.max(ax,bx,cx));x++){
        const X=x+.5,Y=y+.5,u=((bx-X)*(cy-Y)-(by-Y)*(cx-X))/D,v=((cx-X)*(ay-Y)-(cy-Y)*(ax-X))/D;if(u>=-.02&&v>=-.02&&1-u-v>=-.02)set(x,y,k)}};
    const top={blob:12,ball:6,bean:5,block:8,bird:9,stump:9}[shape],ey={blob:18,ball:14,bean:12,block:14,bird:15,stump:16}[shape],cx=16;
    /* behind the body */
    if(A('wings'))[[5,16],[27,16]].forEach(([x,y])=>ell(x,y,4.5,7,3));
    if(A('claws')){rect(2,17,6,21,3);rect(26,17,30,21,3)}
    if(A('crystals')){tri(4,24,9,14,12,24,8);tri(20,24,23,14,28,24,8)}
    /* the body */
    if(shape==='blob'){ell(16,21,12.5,9.5,1);rect(4,21,28,28,1);ell(16,24,7,3.5,2)}
    else if(shape==='ball'){ell(16,17,11.5,11.5,1);ell(16,21,6,5,2);rect(10,27,13,29,3);rect(19,27,22,29,3)}
    else if(shape==='bean'){ell(16,17,9.5,12.5,1);ell(16,21,5,6,2);rect(11,28,14,29,3);rect(18,28,21,29,3)}
    else if(shape==='block'){rect(7,8,25,28,1);P(7,8,0);P(25,8,0);P(7,28,0);P(25,28,0);rect(11,18,21,25,2)}
    else if(shape==='bird'){ell(16,18,9.5,9.5,1);ell(16,22,5,5,2);rect(11,27,13,29,6);rect(19,27,21,29,6)}
    else{rect(8,10,24,28,1);ell(16,10,8,3,2);rect(5,26,9,28,3);rect(23,26,27,28,3)}
    /* light from the top left: highlight and shade the body */
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y*N+x]===1){const d=(x-S(cx))+(y-S(18));if(d>S(9))g[y*N+x]=10;else if(d<-S(11))g[y*N+x]=9}
    /* stripes only recolor the body */
    if(A('stripes'))for(const y0 of [ey+4,ey+8])for(let y=Math.round(S(y0));y<=Math.round(S(y0+1));y++)for(let x=0;x<N;x++){const v=g[y*N+x];if(v===1||v===9||v===10||v===2)g[y*N+x]=3}
    /* on top */
    if(A('ears')){tri(cx-9,top+4,cx-3,top+1,cx-8,top-5,1);tri(cx+9,top+4,cx+3,top+1,cx+8,top-5,1);tri(cx-7,top+2,cx-5,top+1,cx-7,top-2,7);tri(cx+7,top+2,cx+5,top+1,cx+7,top-2,7)}
    if(A('horns')){tri(cx-7,top+2,cx-3,top+1,cx-7,top-6,6);tri(cx+7,top+2,cx+3,top+1,cx+7,top-6,6)}
    if(A('spikes'))for(let k=-2;k<=2;k++)tri(cx+k*4-2,top+3,cx+k*4+2,top+3,cx+k*4,top-3,3);
    if(A('leaf')){tri(cx,top+1,cx+7,top-5,cx+1,top-7,8);rect(cx,top-1,cx,top+1,3)}
    if(A('flower')){ell(cx-3,top-1,2.5,2.5,7);ell(cx+3,top-1,2.5,2.5,7);ell(cx,top-4,2.5,2.5,7);ell(cx,top+1,2,2,7);ell(cx,top-1,1.6,1.6,6)}
    /* a mushroom cap: the top half of a wide ellipse, with spots */
    if(A('cap')){for(let y=Math.floor(S(top-4));y<=Math.round(S(top+4));y++)for(let x=Math.floor(S(cx-13));x<=Math.ceil(S(cx+13));x++){const dx=(x+.5-S(cx))/S(13),dy=(y+.5-S(top+4))/S(8);if(dx*dx+dy*dy<=1)set(x,y,8)}
      ell(cx-6,top,2,1.6,5);ell(cx+5,top-1,2,1.6,5);ell(cx,top-3,1.6,1.4,5);rect(cx-12,top+4,cx+12,top+4,3)}
    if(A('antenna')){tri(cx-4,top+1,cx-3,top+1,cx-7,top-6,3);tri(cx+4,top+1,cx+3,top+1,cx+7,top-6,3);ell(cx-7,top-6,1.6,1.6,6);ell(cx+7,top-6,1.6,1.6,6)}
    if(A('flame')){tri(cx-5,top+2,cx+5,top+2,cx,top-9,8);tri(cx-2,top+2,cx+2,top+2,cx,top-4,6)}
    if(A('crystals'))tri(cx-2,top+1,cx+2,top+1,cx,top-6,8);
    if(A('cloud'))[[8,28],[16,29],[24,28]].forEach(([x,y])=>ell(x,y,5,3,5));
    /* the face */
    const ew=N>=24?2:1,eh=N>=24?3:2;
    for(const ex of [cx-5,cx+3]){for(let y=0;y<eh;y++)for(let x=0;x<ew;x++)set(Math.round(S(ex))+x,Math.round(S(ey))+y,4);if(N>=24)set(Math.round(S(ex)),Math.round(S(ey)),5)}
    if(N>=24){rect(cx-1,ey+5,cx+1,ey+5,4);rect(cx-8,ey+4,cx-7,ey+4,7);rect(cx+7,ey+4,cx+8,ey+4,7);if(shape==='bird')rect(cx-1,ey+3,cx+1,ey+4,6)}
  },pal);SQC[key]=cv;return cv}
/* The hero, or a person: dir up / down / left / right, frame 0 standing, 1 and 2 walking */
function sqPerson(dir,f,c){const key=`p${dir}${f}${c.s}${c.h}${c.c}`;if(SQC[key])return SQC[key];const L=dir==='left',d=L?'right':dir;
  const cv=sqGrid(16,(set0)=>{const set=(x,y,k)=>set0(L?15-x:x,y,k),rect=(x0,y0,x1,y1,k)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)set(x,y,k)};
    if(d==='down'){rect(4,1,11,3,3);rect(4,4,11,8,2);rect(4,4,4,6,3);rect(11,4,11,6,3);rect(5,4,10,4,3);set(6,6,4);set(9,6,4);set(7,8,7)}
    else if(d==='up'){rect(4,1,11,8,3);rect(5,8,10,8,2)}
    else{rect(5,1,10,3,3);rect(4,3,6,7,3);rect(7,4,10,8,2);rect(7,4,10,4,3);set(9,6,4)}
    rect(4,9,11,12,1);rect(4,12,11,12,6);
    if(d==='right'){const a=f===1?1:f===2?-1:0;rect(7+a,9,8+a,11,1);set(7+a,12,2)}else{rect(3,9,3,11,1);rect(12,9,12,11,1);set(3,12,2);set(12,12,2)}
    if(d==='right'){if(f){rect(5,13,6,14,5);rect(9,13,10,14,5);set(5,15,8);set(6,15,8);set(9,15,8);set(10,15,8)}else{rect(6,13,9,14,5);rect(6,15,7,15,8);rect(8,15,9,15,8)}}
    else{const a=f===1,b=f===2;rect(5,13,6,a?13:14,5);rect(9,13,10,b?13:14,5);rect(5,a?14:15,6,a?14:15,8);rect(9,b?14:15,10,b?14:15,8)}
  },{o:'#1E1B2E',1:c.c,2:c.s,3:c.h,4:'#1B1B2F',5:'#3B3B6B',6:shade(c.c,.6),7:'#C2410C',8:'#4A3020'});SQC[key]=cv;return cv}
const sqMe=()=>{const h=GM.hero||{};return{s:SKIN[h.skin??1],h:HAIRC[h.hc??1],c:'#2BA59B'}};
/* Map tiles, 16 x 16, per land; fr is the animation frame */
function sqTile(land,ch,fr){const k=land+ch+fr;if(SQC[k])return SQC[k];const cv=document.createElement('canvas');cv.width=cv.height=16;const x=cv.getContext('2d'),P=SQPAL[land],
  px=(X,Y,w,h,c)=>{x.fillStyle=c;x.fillRect(X,Y,w,h)},R=krng(ch.charCodeAt(0)*31+7),rows=(W,c,y0)=>W.forEach((w,i)=>{if(w)px(8-w/2,y0+i,w,1,c)});
  const ground=()=>{px(0,0,16,16,P.g);for(let i=0;i<7;i++)px(R()*16|0,R()*16|0,1,1,P.g2)};

  for(let ty=y0;ty<=y0+12&&ty<Z.m.length;ty++)for(let tx=x0;tx<=x0+20&&tx<Z.m[0].length;tx++){const ch=Z.m[ty][tx];
    if(ch==='N'){const p=SQNPC[Z.land];c.drawImage(sqPerson('down',0,{s:SKIN[1],h:p.h,c:p.c}),tx*16-cx,ty*16-cy-bob)}
    else if(ch==='B')c.drawImage(sqMon(MONS[Z.land][3],32),tx*16-cx-8,ty*16-cy-16-bob)}
  const bud=sqBud();if(bud&&(Z.bx!==Z.x||Z.by!==Z.y||Z.bx0!==Z.x)){const bx=Math.round((Z.bx0+(Z.bx-Z.bx0)*e)*16),by=Math.round((Z.by0+(Z.by-Z.by0)*e)*16);c.drawImage(sqMon(bud.m,16),bx-cx,by-cy-(e<1?(e*4|0)%2:0))}
  const f=e<1&&e>.15&&e<.85?1+(Z.steps&1):0;c.drawImage(sqPerson(Z.dir,f,Z.me),px-cx,py-cy-(f?1:0));
  if(Z.m[Z.y][Z.x]===','&&e>=1){const t=sqTile(Z.land,',',0);c.drawImage(t,0,10,16,6,px-cx,py-cy+10,16,6)}}
function sqDrawBattle(c,Z){const B=Z.B;c.drawImage(sqBack(Z.land),0,0);const t=Z.t,calm=calmOn();
  const big=B.boss?3:2,spr=sqMon(B.m,32),sz=32*big,fx0=B.boss?190:204,fy0=B.boss?4:36,lunge=B.atk>0?-Math.round(Math.sin((B.atk/.5)*Math.PI)*16):0,shake=B.fx>.4&&!calm?Math.round(Math.sin(t*70)*3):0;
  if(!(B.fx>.55&&((t*14|0)%2)))c.drawImage(spr,fx0+lunge+shake,fy0+(calm?0:Math.round(Math.sin(t*3)*2)),sz,sz);
  const me=sqPerson('up',0,Z.me),hit=B.atk>0&&B.atk<.3&&((t*16|0)%2);if(!hit)c.drawImage(me,58,116,48,48);
  const bud=sqBud();if(bud)c.drawImage(sqMon(bud.m,32),112,136+(calm?0:Math.round(Math.sin(t*4+1)*1)));
  if(B.cast>0){const k=1-B.cast/.45,col=magicOf(GM.rsub)[2]||'#FFD34D';c.fillStyle=col;for(let i=0;i<5;i++){const q=Math.max(0,Math.min(1,k-i*.06)),X=Math.round(96+(fx0+sz/2-96)*q),Y=Math.round(130+(fy0+sz/2-130)*q-Math.sin(q*Math.PI)*30);c.fillRect(X-2,Y-2,5,5);c.fillStyle='#FFFFFF'}}
  for(const d of B.dmg)if(d.t>0){sqNum(c,d.n,Math.round(d.x)+2,Math.round(d.y)+2,'#1E1B2E');sqNum(c,d.n,Math.round(d.x),Math.round(d.y),d.c)}}
/* Damage numbers in a tiny pixel font (3 x 5 digits, drawn at double size) */
const SQFONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111','-':'000000111000000'};
function sqNum(c,s,x,y,col){c.fillStyle=col;const w=s.length*8;let X=x-w/2;for(const ch of s){const f=SQFONT[ch];if(f)for(let i=0;i<15;i++)if(f[i]==='1')c.fillRect(X+(i%3)*2,y+((i/3)|0)*2,2,2);X+=8}}
/* The heads-up boxes over the canvas */
function sqHud(Z,force){const B=Z.mode==='battle'?Z.B:null,f=$('sqfoe'),m=$('sqme'),h=$('sqhudw');if(!h)return;
  h.style.display=B?'none':'';f.hidden=m.hidden=!B;const st=LS(Z.land);
  if(!B){if(force){$('sqland').textContent=`${Z.L.e} ${Z.L.n}`;$('sqhp').textContent=`❤️ ${Z.hp}/100`;$('sqfr').textContent=`🤝 ${st.won.filter(Boolean).length} of 3${st.boss?' · 👑':''}`}return}
  const bar=(el,v,max)=>{const p=Math.max(0,v/max);el.style.width=(p*100).toFixed(1)+'%';el.className=p<.25?'low':p<.5?'mid':''};
  $('sqfn').textContent=(B.boss?'👑 ':'')+B.nm+(sqHas(Z.land,B.i)?' ✓':'');bar($('sqfb'),B.hpS,B.max);bar($('sqmb'),Z.hpS,100);$('sqmh').textContent=`${Math.round(Z.hpS)}/100`;$('sqmn').textContent=ME.display||'You'}
/* The text box under the canvas */
function sqBox(Z){const el=$('sqbox');if(!el)return;const B=Z.B,nx=(t,js)=>`<div class="row"><button class="abtn sm" id="sqnext" onclick="${js}">${t}</button></div>`;let h='';
  if(Z.mode==='talk'){const T=Z.talk;h=`${T.who?`<span class="who">${esc(T.who)}</span>`:''}${esc(T.lines[T.i])}${nx(T.i<T.lines.length-1||T.then?'▼ Next':'OK','AG.cur&&sqNext(AG.cur.st)')}`}
  else if(Z.mode==='walk'){const st=LS(Z.land);h=`<span class="who">${esc(Z.L.n)}</span>${st.won.every(Boolean)?(st.boss?'You have befriended everyone here! Explore, or travel to another land.':'The gate is open. The boss waits beyond it!'):'Walk through the tall grass to meet creatures. Press Space next to people, signs and chests.'}
    <div class="row"><button class="abtn sec sm" onclick="AG.cur&&AG.finish(sqTrip(AG.cur.st,'map'))">🗺️ World map</button></div>`}
  else if(Z.mode==='trans')h=`<span class="who">Battle!</span>Something stirs...`;
  else if(B){const ok=B.ph==='menu';
    if(B.ph==='intro'||B.ph==='msg')h=`${esc(B.msg)}${nx('▼ Next','AG.cur&&sqBNext(AG.cur.st)')}`;
    else if(B.ph==='won'){const r=B.rw;h=`<span class="who">${r.how==='friend'?'New friend!':'Friends!'}</span>${r.how==='tired'?`${esc(B.nm)} is all tired out... and wants to be your friend!`:`${esc(B.nm)} wants to be your friend!`}
      <br>${r.first?`${esc(B.nm)} joined your Creature Journal!`:`${esc(B.nm)} is happy to see you again!`} +${r.g} 💎${r.drop?dropHtml(r.drop).replace('renderBattle()','sqBox(AG.cur.st)'):''}${nx('Continue ▶','AG.cur&&sqBNext(AG.cur.st)')}`}
    else{const fr=B.hp<=B.max*.4;h=`${ok?`What will you do?`:'Thinking...'}<div class="sqmenu" role="group" aria-label="Battle choices">
      <button class="abtn" ${ok?'':'disabled'} onclick="AG.cur&&sqCast(AG.cur.st)"><span class="key" aria-hidden="true">1</span>✨ Cast a spell</button>
      <button class="abtn gold" ${ok&&fr?'':'disabled'} onclick="AG.cur&&sqFriend(AG.cur.st)"><span class="key" aria-hidden="true">2</span>🤝 Make friends${fr?'':' (tire it out first)'}</button>
      ${B.boss?'':`<button class="abtn sec" ${ok?'':'disabled'} onclick="AG.cur&&sqRun(AG.cur.st)"><span class="key" aria-hidden="true">3</span>🏃 Run away</button>`}</div>`}}
  el.innerHTML=h;const n=$('sqnext');if(n&&!QM)n.focus({preventScroll:true})}

/* ---------- Screens ---------- */
GVIEW.sq=function(){const C=AG.cur&&AG.cur.id==='sq'?AG.cur:null;
  if(C&&['load','play','crash'].includes(C.phase))return AG.screen('sq',{over:`<div class="khud2" id="sqhudw"><span id="sqland"></span><span id="sqhp"></span><span id="sqfr"></span></div>
    <div class="sqfoe" id="sqfoe" hidden><b id="sqfn"></b><div class="sqbar"><i id="sqfb"></i></div></div><div class="sqme" id="sqme" hidden><b id="sqmn">You</b><div class="sqbar"><i id="sqmb"></i></div><small id="sqmh"></small></div>`,
    below:`<div class="sqbox" id="sqbox" aria-live="polite"></div>${AG.pad([[{k:'left',l:'◀',a:'Walk left'},{k:'up',l:'▲',a:'Walk up'},{k:'down',l:'▼',a:'Walk down'},{k:'right',l:'▶',a:'Walk right'}],[{k:'act',l:'A',a:'Talk or check'}]])}`});
  if(C&&C.phase==='end'){const r=C.res||{},L=LANDS.find(l=>l.id===r.land)||LANDS[0];return `<div class="gworld">${clouds()}${gameHead('Spell Quest',`${L.e} ${esc(L.n)}`)}<div class="gcard endcard"><div class="big" aria-hidden="true">${r.why==='time'?'🌙':'🗺️'}</div>
    <h3>${r.why==='time'?'Play time is over for today':'Adventure saved!'}</h3><p>This trip: ${r.b||0} battle${r.b===1?'':'s'} won, ${r.f||0} new friend${r.f===1?'':'s'}, ${r.g||0} 💎</p>${r.why==='time'?`<p class="sol">${esc(earnNote())}</p>`:''}
    <div class="row" style="justify-content:center">${r.why==='time'?'':`<button class="abtn" onclick="AG.play('sq',{land:'${L.id}'})">▶ Keep exploring</button>`}<button class="abtn sec" onclick="AG.cur=null;AR.mode='spell';rerealm()">🗺️ World map</button><button class="abtn sec" onclick="AG.cur=null;AR.mode='sqbook';rerealm()">📔 Creature Journal</button></div></div></div>`}
  AR.mode='spell';return mapView()};
/* The Creature Journal: everyone you have met, and your buddy */
GVIEW.sqbook=function(){const Q=SQ(),seen=Object.keys(Q.seen).length;
  return `<div class="gworld">${clouds()}${gameHead('📔 Creature Journal',`${sqFriends()} of 28 befriended · ${seen} met`)}
  ${LANDS.map(l=>`<div class="gcard" style="margin-top:14px"><h3>${l.e} ${esc(l.n)}${landOpen(l)?'':` <span class="sol">· opens at level ${l.lv}</span>`}</h3><div class="sqjr">${MONS[l.id].map((m,i)=>{const k=l.id+':'+i,f=sqHas(l.id,i),s=f||Q.seen[k],bud=Q.buddy===k;
    return `<div class="c ${s?'':'unk'} ${bud?'bud':''}"><img src="${sqImg(m,32)}" alt="${s?esc(sqName(m)):'Not met yet'}" width="72" height="72"><b>${s?esc(sqName(m)):'???'}</b><span class="sol">${f?(i===3?'👑 Boss friend':'✓ Friend'):s?'Met, not a friend yet':'Not met yet'}</span>
      ${f?`<button class="abtn sm ${bud?'gold':'sec'}" aria-pressed="${bud}" onclick="SQ().buddy=SQ().buddy==='${k}'?'':'${k}';SYNC();rerealm()">${bud?'⭐ Your buddy':'Make buddy'}</button>`:''}</div>`}).join('')}</div></div>`).join('')}
  <p class="gnote">Your buddy follows you on your adventure and helps your spells hit a little harder.</p><div class="row" style="margin-top:12px"><button class="abtn sec" onclick="AR.mode='spell';rerealm()">← World map</button></div></div>`};
/* The world map's land card: explore it */
const _lpSQ=landPanel;landPanel=function(){const l=LANDS.find(x=>x.id===curLand()),st=LS(l.id),out=outOfTime();
  return `<div class="gcard sqgo" style="margin-top:18px"><div class="pv">${MONS[l.id].map((m,i)=>`<img src="${sqImg(m,32)}" alt="" width="64" height="64" style="${sqHas(l.id,i)||SQ().seen[l.id+':'+i]?'':'filter:brightness(0) opacity(.3)'}">`).join('')}</div>
    <div><h3 style="margin:0 0 4px">🗺️ Explore ${l.e} ${esc(l.n)}</h3><p class="sol" style="margin:0 0 10px">Walk the land, meet creatures in the tall grass and befriend them with smart answers. Befriend all three to open the gate to ${esc(sqName(MONS[l.id][3]))}.</p>
    <div class="row"><button class="abtn big" ${out?'disabled':''} onclick="AG.play('sq',{land:'${l.id}'})">▶ Explore</button><button class="abtn sec" onclick="AR.mode='sqbook';rerealm()">📔 Creature Journal</button><button class="abtn sec sm" onclick="AR.mode='book';AG.book='sq';rerealm()">📖 Collection Book</button></div></div></div>
  ${_lpSQ().replace('<div class="gcard" id="landpanel" style="margin-top:18px">','<div class="gcard" id="landpanel" style="margin-top:14px"><p class="sol" style="margin:0 0 8px"><b>Quick battles:</b> skip the walk and battle a creature right away.</p>')}`};
</script>
