/* ---------- The upgrade dashboard: coins from runs buy lasting upgrades for each hero ---------- */

  Object.assign(L,{ok:D.ok,mis:D.mis,les:D.les,cw:D.cw});if(n>0){S.gold=(S.gold||0)+n;S.newc=(S.newc||0)+n}return n}

  S.gold-=c;dUpg(k)[id]=l+1;SYNC();rerealm();msg(`${DHEROES[k].short}: ${u.n} is now level ${l+1}!`);const d=$('dddash');if(d)d.scrollIntoView({block:'nearest'})}

  const stats=[['❤️ Hearts',h.hp+L('hp'),12],['⚔️ Damage per hit',+(h.atk.dmg*(1+.2*L('atk'))).toFixed(1),4],['⚡ Hits per second',+aps.toFixed(1),7],['✨ '+h.sp.n,`Level ${L('sp')}`,L('sp')/5*100,1],['👟 Running speed',Math.round(h.spd*(1+.06*L('move'))),330],['🔋 Charges per answer',20+2*L('bat'),30]];
  return `<div class="gcard dddash" id="dddash" style="margin-top:16px"><div class="split"><h3>⚒️ Upgrade dashboard: ${esc(h.short)}</h3><span class="ddgold" aria-label="${g} coins to spend">🪙 ${g} coins</span></div>
  ${nc?`<p class="ddnewc" role="status">🎉 Your studying earned <b>${nc} coin${nc>1?'s':''}</b> since your last visit!</p>`:''}
  <p class="sol" style="margin:0 0 12px">Upgrade coins come from studying on the Learn page. Spend them here on lasting upgrades for each hero.</p>
  <div class="ddsplit"><div class="ddstatbox" aria-label="${esc(h.short)}'s stats">${stats.map(([n,v,m,pct])=>`<div class="ddsrow"><span>${n}</span><b>${v}</b><span class="ddsbar" aria-hidden="true"><i style="width:${Math.min(100,pct?m:v/m*100).toFixed(0)}%"></i></span></div>`).join('')}</div>
  <div class="ddupgs">${DUPG.map(u=>{const l=L(u.id),max=u.max||5,c=DCOST[l],full=l>=max;return `<div class="ddup"><span class="ddupi" aria-hidden="true">${u.i}</span><div class="ddupt"><b>${u.n} <span class="pips" role="img" aria-label="Level ${l} of ${max}">${'■'.repeat(l)}<span class="off">${'■'.repeat(max-l)}</span></span></b><span class="sol">${u.d(l,h)}</span></div><button class="abtn sm ${!full&&g>=c?'gold':'sec'}" ${full||g<c?'disabled':''} data-up="${u.id}" aria-label="${full?`${u.n} is at the top level`:`Upgrade ${u.n} for ${c} coins`}" onclick="ddBuy('${k}','${u.id}')">${full?'Max':`🪙 ${c}`}</button></div>`}).join('')}</div></div>
  <div class="ddearn"><h3 style="margin:0 0 6px">📚 How to earn upgrade coins</h3><ul class="pearn"><li>Each right answer in practice: 🪙 ${DCOIN.ok}</li><li>Finishing a practice mission: 🪙 ${DCOIN.mis}</li><li>Opening a lesson: 🪙 ${DCOIN.les} (up to 3 a day)</li><li>Turning in classwork or a lesson quiz: 🪙 ${DCOIN.cw}</li><li>A skill reaching Proficient or Mastered: 🪙 ${DCOIN.pro}</li></ul><p class="sol" style="margin:8px 0 0">Coins in the dungeon add to your score. Upgrade coins are earned by learning!</p><button class="abtn sm" style="margin-top:10px" onclick="go('learn')">📖 Go learn</button></div>
  <h3 style="margin:18px 0 4px">🎒 Gear collection: ${DGEAR.filter(x=>(S.found||{})[x.id]).length} of ${DGEAR.length} found</h3><p class="sol" style="margin:0 0 10px">Every level-up in the dungeon rolls for gear. Answer the level-up question right on the first try for a luckier roll!</p>
  <div class="ddcoll">${[3,2,1,0].map(r=>DGEAR.filter(x=>x.r===r).map(x=>{const f=(S.found||{})[x.id];return `<div class="ddcg ${f?'':'no'}" style="--rc:${DRAR[r].c}" title="${f?esc(x.n+': '+x.d):'Not found yet'}"><span aria-hidden="true">${f?x.i:'?'}</span><b>${f?esc(x.n):DRAR[r].n}</b></div>`}).join('')).join('')}</div></div>`}

/* ---------- The Dungeon Dash screen: pick a hero, then play ---------- */
GVIEW.dash=function(){const Z=DD,S=ARS('dash'),head=`<div class="gworld">${clouds()}${gameHead('Dungeon Dash','Pick a hero, dodge the monsters, grab the jewels, and power your magic with right answers!')}`;
  if(!Z||!['run','pause'].includes(Z.ph)){const out=outOfTime(),sel=DSEL();let card='';
    if(Z&&Z.ph==='over')card=`<div class="gcard endcard" style="margin-bottom:16px"><div class="big" aria-hidden="true"><img src="${pxURL(Z.hero,3)}" alt="" style="height:84px;image-rendering:pixelated"></div><h3>Your hero needs a rest!</h3><p>${esc(DHEROES[Z.hero].short)} fought bravely, and every right answer powered the magic. Ready for another run?</p>
      <div class="ddstats"><div><b>${Z.wave}</b>wave${Z.pbw?' · best!':''}</div><div><b>${Z.floor+1}</b>floor</div><div><b>${Z.score}</b>points${Z.pbs?' · best!':''}</div><div><b>${Z.lvl}</b>hero level</div><div><b>${Z.kills}</b>monsters</div></div>${Z.gems?`<p>💎 +${Z.gems} gem${Z.gems>1?'s':''} for ${Z.cleared} wave${Z.cleared>1?'s':''} cleared</p>`:''}${Z.gear.length?`<p>🎒 Gear this run: ${Z.gear.map(id=>{const g=DGEAR.find(x=>x.id===id);return `<span class="ddgchip" style="--rc:${DRAR[g.r].c}">${g.i} ${esc(g.n)}</span>`}).join(' ')}</p>`:''}<p>🪙 Want stronger heroes? Upgrade coins come from studying. <a href="#dddash" onclick="event.preventDefault();$('dddash').scrollIntoView({behavior:calmOn()?'auto':'smooth'})">See how to earn them ↓</a></p></div>`;
    return head+`${out?restCard():''}${card}${subjChips()}<div class="gcard"><h3>🗡️ Choose your hero</h3><div class="ddheroes" role="group" aria-label="Choose your hero">${Object.entries(DHEROES).map(([k,h])=>`<button class="ddhero ${k===sel?'on':''}" data-hero="${k}" aria-pressed="${k===sel}" onclick="ARS('dash').hero='${k}';SYNC();rerealm()"><span class="ddport"><img src="${pxURL(k)}" alt=""></span><b>${esc(h.n)}</b><span class="ddrole">${esc(h.role)}</span><span class="ddstat">❤️ ${h.hp+dLv(k,'hp')} hearts · 👟 ${h.spd>=240?'Very quick':h.spd>=200?'Quick':h.spd>=170?'Steady':'Slow'}</span><span class="sol">${esc(h.d)}</span><span class="ddab"><b>Attack:</b> ${esc(h.a)}</span><span class="ddab"><b>${h.sp.icon} ${esc(h.sp.n)} (Space):</b> ${esc(h.s)}</span></button>`).join('')}</div>
      ${ddDashboard(sel)}
      <h3 style="margin-top:18px">How to play</h3><ul class="pearn"><li>Move with WASD or the arrow keys. On a touch screen, drag anywhere on the dungeon to steer.</li><li>Your hero attacks the nearest monster all by themselves. Each attack uses one ⚡ charge.</li><li>Out of charges? Answer a question to recharge. Right answers in a row give extra. Press E to recharge any time.</li><li>Dodge bouncing fireballs and homing missiles, and shoot the missiles down! Space uses your hero's special move for 5 charges.</li><li>Collect the jewels monsters drop to level up and roll for gear: Common, Rare, Mystic or Legendary! Gold coins add to your score. Every 5 waves a boss guards the stairs to a deeper floor.</li></ul>
      <div class="row" style="margin-top:14px;align-items:center"><button class="abtn big" ${out?'disabled':''} onclick="ddStart()">⚔️ Enter the dungeon as ${esc(DHEROES[sel].short)}</button>${S.wave?`<span class="sol">Best: wave <b>${S.wave}</b> · floor <b>${S.floor||1}</b> · <b>${S.score}</b> points</span>`:''}</div></div></div>`}
  const Sp=DHEROES[Z.hero].sp;
  return head+`<div class="ddhud" id="ddhud"></div><div class="ddwrap"><canvas class="ddcv" id="ddcv" style="aspect-ratio:${DW}/${DH}" role="img" aria-label="The dungeon. Move with the arrow keys or WASD; press E to recharge, Space for your special move, P to pause." onpointerdown="ddPointer(event,this)" onpointermove="ddPointer(event,this)" onpointerup="ddPointer(event,this)" onpointercancel="ddPointer(event,this)"></canvas>
    <div class="ddpause" id="ddpause" ${Z.ph==='pause'?'':'hidden'}><div class="gcard" style="text-align:center"><h3>Paused</h3><div class="row" style="justify-content:center"><button class="abtn" onclick="ddPause()">▶ Resume</button><button class="abtn sec" onclick="ddQuit()">End run</button></div></div></div></div>
    <p class="bsr" id="ddsay" aria-live="polite"></p><div class="ddctl"><button class="abtn sun" id="ddre" onclick="ddRecharge()">⚡ Recharge (E)</button><button class="abtn gold" id="ddbu" onclick="ddSpecial()">${Sp.icon} ${esc(Sp.n)} (Space)</button><button class="abtn sec" onclick="ddPause()">⏸ Pause (P)</button></div></div>`};

/* On the Arcade hub, right after Spell Quest, with a pixel-art tile */
GAMES.splice(1,0,{id:'dash',n:'Dungeon Dash',p:'Pick one of four heroes, dodge fireballs, grab jewels and power your magic with right answers. How deep can you go?'});
ART.dash=()=>{const k=DSEL(),url=ddCache('tile'+k,()=>{const c=pxRoom(200,130,0,[[40,22],[160,22]],[],36,2,6),x=c.getContext('2d');x.imageSmoothingEnabled=false;pxFlame(x,40,22,0,true);pxFlame(x,160,22,0,true);
    const h=pxHero(k,0),m=pxMon('slime',0),i=pxMon('imp',0),j=pxArt(...PXI.jewel);x.drawImage(h,62,46,h.width*2,h.height*2);x.drawImage(m,130,92,m.width*2,m.height*2);x.drawImage(i,150,52,i.width*2,i.height*2);x.drawImage(j,110,100,j.width*2,j.height*2);return c.toDataURL()});
  return `<svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" preserveAspectRatio="xMidYMid slice"><image href="${url}" width="200" height="130" style="image-rendering:pixelated"/></svg>`};
</script>
