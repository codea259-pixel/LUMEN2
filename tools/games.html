<style>
/* ===== Arcade games: Pet Pals, Turbo Trivia Kart, Goblin Gate, Block Builder ===== */
.qm-back{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(15,23,42,.55)}
.qm-card{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:14px!important}.qm-card .qpanel{border-radius:20px;border-top:0}
.qm-card h3{margin:0 0 6px}.tpick{display:grid;gap:10px}.tpick .abtn{justify-content:flex-start;text-align:left;width:100%}.tpick small{display:block;font:600 .8rem/1.3 "Atkinson Hyperlegible",sans-serif;opacity:.8;margin-left:4px}
.tpick .abtn svg{width:34px;height:34px;flex:none}
.pearn{margin:6px 0 0;padding-left:20px}.pearn li{margin:5px 0}
.ckline{display:flex;gap:8px;align-items:center;margin-top:10px;font-weight:700}
.bsr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Pet Pals */
.ppwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}.ppwrap>*{min-width:0}@media(max-width:820px){.ppwrap{grid-template-columns:1fr}}
.palstage{display:grid;place-items:center;background:radial-gradient(circle at 50% 75%,#FFF7E6,#FFE3C2 70%);border-radius:22px;min-height:230px}
.palbtn{border:0;background:none;padding:0;cursor:pointer;width:220px;max-width:72%}.palbtn svg{width:100%;height:auto;display:block}.palbtn:focus-visible{outline:3px solid var(--ga-glow);outline-offset:4px;border-radius:20px}
.pal .pm-munch{display:none}.pal.munch .pm-smile{display:none}.pal.munch .pm-munch{display:inline}
.pal.palidle{animation:palbreathe 3s ease-in-out infinite;transform-origin:50% 95%}.pal.egg{animation:palwobble 2.8s ease-in-out infinite;transform-origin:50% 92%}
.pal.happy{animation:palhop .6s ease}.pal.munch{animation:palmunch .3s ease 3;transform-origin:50% 95%}
@keyframes palbreathe{50%{transform:scaleY(1.03)}}@keyframes palhop{40%{transform:translateY(-16px)}}@keyframes palmunch{50%{transform:scale(1.05,.95)}}
@keyframes palwobble{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-5deg)}86%{transform:rotate(5deg)}94%{transform:rotate(-3deg)}}
.pstat{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pstat span{background:#FFF1D6;color:#3B2A12;border-radius:99px;padding:6px 12px;font-weight:800}
.eggs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:12px}.eggs .tart{height:150px;background:#FFF7E6}
.accs{display:flex;flex-wrap:wrap;gap:8px}.accs .chip{background:var(--bg);color:var(--ink);border-color:var(--line)}.accs .chip.on{background:var(--ga-gold);color:#1E1B4B;border-color:var(--ga-gold)}
.palmini{display:inline-flex;align-items:center;gap:8px;margin-top:10px;border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:3px 12px 3px 3px;cursor:pointer;font:700 .9rem inherit;color:var(--ink)}.palmini svg{width:44px;height:44px;display:block}
/* Turbo Trivia Kart */
.kq{margin-bottom:12px;min-height:76px}.kq .kqt{font:700 clamp(1.15rem,2.8vw,1.45rem)/1.3 "Atkinson Hyperlegible",sans-serif;margin-top:2px}
.khud,.ghud{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.khud span,.ghud span{background:rgba(30,27,75,.5);color:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:.9rem}
.ktrack{position:relative;height:clamp(280px,48vh,400px);border-radius:24px;overflow:hidden;border:3px solid rgba(255,255,255,.85);box-shadow:0 7px 0 var(--ga-lip);background:var(--grass,#6DBF62)}
.ktrack::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,var(--dot,#4E9E45) 7px,transparent 8px);background-size:46px 64px;animation:kscen .9s linear infinite}@keyframes kscen{to{background-position:0 64px}}
.ktracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.ktr{display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font:inherit}
.ktr.on{border:3px solid var(--ga-gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--ga-gold) 30%,transparent)}.ktr[disabled]{opacity:.6;cursor:not-allowed}.ktr b{font:800 1rem "Bricolage Grotesque",sans-serif}.ktr .sol{font-size:.82rem}
.ktrart{display:block;height:44px;border-radius:10px;background:linear-gradient(90deg,var(--grass) 0 16%,var(--edge) 16% 20%,var(--road) 20% 80%,var(--edge) 80% 84%,var(--grass) 84%)}
.kroad{position:absolute;top:0;bottom:0;left:6%;right:6%;background-color:var(--road,#5B6478);background-image:linear-gradient(#fff 50%,transparent 50%),linear-gradient(#fff 50%,transparent 50%);background-size:4px 44px,4px 44px;background-position:33.33% 0,66.66% 0;background-repeat:repeat-y;border-left:6px solid var(--edge,#F8FAFC);border-right:6px solid var(--edge,#F8FAFC);animation:kroad .5s linear infinite}
@keyframes kroad{to{background-position:33.33% 44px,66.66% 44px}}
.kgate{position:absolute;left:6%;right:6%;top:-12%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 8px}
.kgate span{display:grid;place-items:center;min-height:46px;padding:6px;border-radius:14px;background:#fff;color:#1E1B4B;border:3px solid #8B5CF6;box-shadow:0 4px 0 #5B21B6;font-weight:800;text-align:center;line-height:1.15;font-size:clamp(.78rem,2.2vw,1rem);overflow-wrap:anywhere}
.kgate.done span{opacity:.55}.kgate span.right{opacity:1;border-color:#22B35E;box-shadow:0 4px 0 #15803D;background:#E3F6EA}.kgate span.wrong{opacity:1;border-color:#E4572E;box-shadow:0 4px 0 #B83B1D;background:#FDECEC}
.kart{position:absolute;bottom:12px;width:min(17%,86px);left:calc(6% + 88% * (var(--lane) * 2 + 1) / 6);transform:translateX(-50%);transition:left .16s ease-out}.kart svg{width:100%;height:auto;display:block}
.kart.boost{animation:kboost .7s ease-out}.kart.bump{animation:kbump .6s ease}@keyframes kboost{30%{transform:translate(-50%,-26px) scale(1.08)}}@keyframes kbump{25%{transform:translateX(-50%) rotate(-14deg)}60%{transform:translateX(-50%) rotate(10deg)}}
.kfb{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);max-width:86%;text-align:center;font:800 clamp(1.1rem,3.4vw,1.6rem) "Bricolage Grotesque",sans-serif;color:#fff;text-shadow:0 2px 0 #1E1B4B,0 0 10px rgba(30,27,75,.8)}
.klanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.klanes .abtn{width:100%;min-height:60px;padding:0 10px;font-size:1rem}.klanes .abtn .kl{overflow-wrap:break-word;line-height:1.15;min-width:0}@media(max-width:480px){.klanes .abtn .key{display:none}.klanes .abtn{font-size:.92rem;padding:0 6px}}
.klanes .abtn.on{box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 var(--ga-gold),0 0 0 3px var(--ga-gold)}.klanes .key{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:8px;background:#EEF2FF;color:#4338CA;font-size:.85rem}
/* Goblin Gate */
.gfield{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;border:3px solid rgba(255,255,255,.85);box-shadow:0 7px 0 var(--ga-lip)}.gfield>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gpad{position:absolute;transform:translate(-50%,-50%);width:10%;min-width:40px;aspect-ratio:1;border-radius:50%;border:3px dashed rgba(255,255,255,.95);background:rgba(255,255,255,.28);display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;font:800 clamp(1rem,2.6vw,1.5rem)/1 "Bricolage Grotesque",sans-serif;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.gpad.built{border:3px solid #fff;background:#F8FAFC}.gpad svg{width:78%;height:78%;display:block}.gpad .pips{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#1E1B4B;color:#FDE047;border-radius:99px;padding:1px 6px;font-size:.62rem;letter-spacing:1px}
.gpad:focus-visible{outline:3px solid var(--ga-glow);outline-offset:3px}
/* Block Builder */
.bbwrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}.bbwrap>*{min-width:0}@media(max-width:720px){.bbwrap{grid-template-columns:1fr}}
.bboard{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));gap:4px;padding:8px;background:#1E1B4B;border-radius:20px;border:3px solid rgba(255,255,255,.85);box-shadow:0 7px 0 var(--ga-lip);aspect-ratio:6/9;width:100%;max-width:340px;margin:0 auto}
.bcell{border-radius:8px;background:rgba(255,255,255,.07);display:grid;place-items:center;font:800 clamp(.95rem,3.6vw,1.35rem)/1 "Bricolage Grotesque",sans-serif;color:#fff;cursor:pointer;user-select:none}
.bcell.v{background:var(--bc);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.3);text-shadow:0 1px 0 rgba(0,0,0,.3)}.bcell.cur{outline:3px solid #FDE047;outline-offset:-1px}
.bctl{display:flex;gap:10px;justify-content:center;margin-top:12px}.bbtop .bpill{margin-left:auto}.bbtop .bpill+.bpill{margin-left:0}
.bnrow{display:flex;align-items:center;gap:12px}.bnext{width:54px;height:54px;flex:none;font-size:1.5rem;cursor:default}.bctl .abtn{min-width:64px}
.bbtop{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:340px;margin:0 auto 10px}.btarget{font:800 1.6rem "Bricolage Grotesque",sans-serif;color:#fff;text-shadow:0 2px 0 #312E81,0 0 8px rgba(30,27,75,.6)}.bpill{background:rgba(30,27,75,.55);color:#fff;border-radius:99px;padding:5px 12px;font-weight:800}.bfeed{list-style:none;margin:0;padding:0}.bfeed li{padding:6px 10px;border-radius:10px;margin:4px 0;background:var(--bg);font-weight:700}.bfeed li.new{background:#E3F6EA;color:#1D5E3A}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .bfeed li.new{background:#1E3B2C;color:#B9F0CF}}:root[data-theme=dark] .bfeed li.new{background:#1E3B2C;color:#B9F0CF}
@media(prefers-reduced-motion:reduce){.pal,.kroad,.kart,.ktrack::before{animation:none!important}}
body[data-calm] .pal,body[data-calm] .kroad,body[data-calm] .kart,body[data-calm] .ktrack::before{animation:none!important}
</style>
<script type="text/x-lumen">
/* ===== Arcade games: Pet Pals, Turbo Trivia Kart, Goblin Gate and Block Builder. Each is a mode of the Play tab (AR.mode).
   Questions come from the learner's own skills (rquestion, as in Spell Quest). A running round sets AR.run, which uses
   play time; Pet Pals uses none. Saved stats live in GM.ar and the pet in GM.pet. ===== */
const GVIEW={};
const ARS=k=>{const A=GM.ar||(GM.ar={});return A[k]||(A[k]={})};
const outOfTime=()=>!noLimit()&&playLeft()<=0;
const canStart=()=>{if(!outOfTime())return true;msg('Play time is over for today. Learn to earn more!');return false};
const GSTOP=[];
function stopGames(){AR.run=false;AR.paused=false;cancelAnimationFrame(AR.raf);clearInterval(AR.iv);AR.raf=AR.iv=0;if(QM)qmClose(true);GSTOP.forEach(f=>f())}
const _thA=toHub;toHub=function(){if(AR.run&&!confirm('Leave this game? This round will end.'))return;stopGames();_thA()};
const _stA=showTab;showTab=function(t){stopGames();_stA(t)};
const gameHead=(t,s)=>`<div class="ghead"><div style="display:flex;gap:14px;align-items:center"><button class="abtn sec sm" onclick="toHub()">← Arcade</button><div><h2 class="gtitle">${t}</h2><p class="gsub">${s}</p></div></div>${ptimeHtml()}</div>`;
function subjChips(){const subs=Object.keys(SUBN).filter(s=>subSkills(s).some(k=>G[k]));if(!subs.includes(GM.rsub))GM.rsub=subs.includes(ST.subj)?ST.subj:subs[0]||'math';
  return `<div class="schools" role="group" aria-label="Questions from"><span class="sol"><b>Questions from:</b></span>${subs.map(x=>`<button class="chip ${GM.rsub===x?'on':''}" aria-pressed="${GM.rsub===x}" onclick="GM.rsub='${x}';SYNC();rerealm()">${esc(SUBN[x])}</button>`).join('')}</div>`}
const stars3=(n,lbl)=>`<span class="stars" role="img" aria-label="${lbl||n+' of 3 stars'}">${'★'.repeat(n)}<span class="off">${'★'.repeat(3-n)}</span></span>`;

/* ---------- The question modal, shared by the games (same answer rules as Spell Quest) ---------- */
let QM=null;
function judge(q,raw){if(q.choices)return{ok:+raw===q.a[0]};const u=parse(String(raw));if(!u)return{retry:'Type a whole number or a fraction like 3/4.'};const ok=eq(u,q.a);
  if(ok&&q.exact&&!(gcd(Math.abs(u[0]),u[1])==1&&u[0]==q.a[0]&&u[1]==q.a[1]))return{retry:'That is the right value, but it can still go lower. Simplify it and try again!'};return{ok}}
function qmEl(){let el=$('qmodal');if(!el){el=document.createElement('div');el.id='qmodal';document.body.appendChild(el)}return el}
/* Resolves true (right), false (wrong, after the learner reads the answer) or null (closed, or no questions) */
function qAsk(o={}){return new Promise(res=>{const x=rquestion();if(!x){msg('No questions here yet. Pick another subject, or choose your grade on the Learn page.');return res(null)}
  QM={o,k:x.k,q:x.q,res,phase:'ask',fb:''};qmRender()})}
function qmRender(focus=true){const el=qmEl(),q=QM.q,o=QM.o,dis=QM.phase!=='ask'?'disabled':'';
  el.innerHTML=`<div class="qm-back"><div class="gworld qm-card" role="dialog" aria-modal="true" aria-labelledby="qmt"><div class="qpanel">
  <p class="sol" id="qmt" style="margin:0 0 6px">${esc(o.title||'Question')}${SK[QM.k]?` · ${esc(SK[QM.k].n)}`:''}</p>${o.intro?`<p style="margin:0 0 8px"><b>${esc(o.intro)}</b></p>`:''}<div class="bq">${q.q}</div>
  ${q.choices?`<div class="bchoices" style="margin-top:12px">${q.choices.map((c,i)=>`<button ${dis} onclick="qmAns(${i})"><span class="key" aria-hidden="true">${'ABCD'[i]}</span> ${esc(c)}</button>`).join('')}</div>`
   :`<form class="bans" style="margin-top:12px" onsubmit="event.preventDefault();qmAns($('qmin').value)"><input id="qmin" autocomplete="off" aria-label="Your answer" placeholder="Type your answer" ${dis}><button class="abtn" ${dis}>Answer</button></form>`}
  <div id="qmfb">${QM.fb}</div>${o.cancel&&QM.phase==='ask'?`<div class="row" style="margin-top:12px"><button class="abtn sec sm" onclick="qmClose(false,null)">Not now</button></div>`:''}</div></div></div>`;
  if(focus){const f=QM.phase==='ask'?($('qmin')||el.querySelector('.bchoices button')):$('qmok');if(f)f.focus()}}
function qmAns(raw){if(!QM||QM.phase!=='ask')return;const r=judge(QM.q,raw);if(r.retry){$('qmfb').innerHTML=`<div class="bfb no" role="status">${esc(r.retry)}</div>`;return}
  QM.phase='fb';
  if(r.ok){QM.fb=`<div class="bfb ok" role="status">✨ ${pick(['Correct!','You got it!','Brilliant!','Nice work!'])}</div>`;qmRender(false);heroMood('beam',800);const m=QM;setTimeout(()=>{if(QM===m)qmClose(false,true)},750)}
  else{QM.fb=`<div class="bfb no" role="status">Not quite. The answer is <b>${esc(fmtA(QM.q))}</b>.${QM.q.s?`<p class="sol">${QM.q.s}</p>`:''}<div class="row" style="margin-top:10px"><button class="abtn sun sm" id="qmok" onclick="qmClose(false,false)">OK</button></div></div>`;qmRender()}}
function qmClose(silent,v){const m=QM;QM=null;const el=$('qmodal');if(el)el.remove();if(m)m.res(silent?null:v)}
/* A small menu in the same modal (Goblin Gate's tower picker) */
function qmMenu(html,onClose){QM={o:{cancel:true},phase:'menu',res:()=>onClose&&onClose()};const el=qmEl();
  el.innerHTML=`<div class="qm-back"><div class="gworld qm-card" role="dialog" aria-modal="true" aria-label="Choose"><div class="qpanel">${html}<div class="row" style="margin-top:12px"><button class="abtn sec sm" onclick="qmClose(false,null)">Not now</button></div></div></div></div>`;
  const f=el.querySelector('.qpanel button');if(f)f.focus()}

/* ---------- Pet Pals: learning earns food; feeding grows the pet. Visiting uses no play time. ---------- */
const PALS={dragon:{n:'Dragon',c:'#6CC66C',d:'#3E9E4B',b:'#E8F7C8',nm:'Sparky'},bunny:{n:'Bunny',c:'#F6E7F1',d:'#C98DB5',b:'#FFFFFF',nm:'Clover'},fox:{n:'Fox',c:'#F59E4B',d:'#C2622D',b:'#FFF1DF',nm:'Rusty'}};
const PSTAGE=[['Egg',0],['Baby',2],['Young',8],['Hero form',20]];
const PACC=[{id:'bow',n:'Bow',g:3},{id:'cap',n:'Party hat',g:6},{id:'scarf',n:'Scarf',g:12},{id:'crown',n:'Star crown',g:25}];
const PET=()=>GM.pet||(GM.pet={kind:'',name:'',g:0,food:0,treat:0,wear:'',last:{},ask:'',newf:0,newt:0});
const pstage=g=>PSTAGE.reduce((s,x,i)=>g>=x[1]?i:s,0);
/* Snacks: 1 per 10 right answers, 1 per finished practice mission, 1 per lesson opened (3 a day), 2 per classwork or lesson quiz turned in */
function petSync(){const P=PET(),D=DAY();if(P.last.d!==D.d)P.last={d:D.d,ok:0,mis:0,les:0,cw:0};const L=P.last;
  const n=Math.floor(D.ok/10)-Math.floor(L.ok/10)+(D.mis-L.mis)+Math.min(3,D.les)-Math.min(3,L.les)+2*(D.cw-L.cw);
  Object.assign(L,{ok:D.ok,mis:D.mis,les:D.les,cw:D.cw});if(n>0){P.food+=n;P.newf=(P.newf||0)+n}return n}
const _gcP=gameCheck;gameCheck=function(...a){petSync();return _gcP(...a)};
/* A treat each time a skill reaches Proficient or Mastered */
const _udP=update;update=function(k,ok,...a){const L0=level(k);_udP(k,ok,...a);if(level(k)>=3&&level(k)>L0){const P=PET();P.treat++;P.newt=(P.newt||0)+1}};
function palSvg(P,o={}){const k=PALS[P.kind]||PALS.dragon,st=o.stage??pstage(P.g),F=P.kind,lab=esc(o.label||k.n);
  if(!st)return `<svg class="pal egg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${lab}"><ellipse cx="80" cy="151" rx="38" ry="6" fill="rgba(0,0,0,.12)"/><path d="M80 24C113 24 128 78 128 104C128 133 107 150 80 150C53 150 32 133 32 104C32 78 47 24 80 24Z" fill="#FFF6E5" stroke="${k.d}" stroke-width="3"/><circle cx="61" cy="78" r="9" fill="${k.c}" stroke="${k.d}" stroke-width="1.5"/><circle cx="99" cy="100" r="12" fill="${k.c}" stroke="${k.d}" stroke-width="1.5"/><circle cx="72" cy="124" r="7" fill="${k.c}" stroke="${k.d}" stroke-width="1.5"/>${P.g>=1?`<path d="M48 94l10 8 8-10 10 10 8-8 10 8 10-8" fill="none" stroke="${k.d}" stroke-width="3" stroke-linejoin="round"/>`:''}</svg>`;
  const s=[0,.74,.88,1][st],w=P.wear;
  const back=`${st===3?`<path d="M54 98L38 150H122L106 98Z" fill="#8B5CF6"/><path d="M54 98L46 150H60Z" fill="#7C3AED"/>`:''}${F==='dragon'&&st>=2?`<path d="M52 106C28 88 22 68 30 58C38 74 48 82 60 94ZM108 106C132 88 138 68 130 58C122 74 112 82 100 94Z" fill="${k.d}"/>`:''}
    ${F==='fox'?`<path d="M104 134C134 136 148 110 141 92C132 108 120 114 104 120Z" fill="${k.c}" stroke="${k.d}" stroke-width="2"/><path d="M141 92C140 101 136 108 129 112C135 106 139 99 141 92Z" fill="#fff"/>`:F==='dragon'?`<path d="M104 138C126 140 140 130 145 114L133 120L135 107L120 126Z" fill="${k.c}" stroke="${k.d}" stroke-width="2"/>`:`<circle cx="111" cy="136" r="9" fill="#fff" stroke="${k.d}" stroke-width="1.5"/>`}`;
  const ears=F==='bunny'?`<ellipse cx="64" cy="${st>=2?30:36}" rx="10" ry="${st>=2?28:22}" fill="${k.c}" stroke="${k.d}" stroke-width="2"/><ellipse cx="64" cy="${st>=2?32:38}" rx="5" ry="${st>=2?17:13}" fill="#FFB6CF"/><ellipse cx="96" cy="${st>=2?30:36}" rx="10" ry="${st>=2?28:22}" fill="${k.c}" stroke="${k.d}" stroke-width="2"/><ellipse cx="96" cy="${st>=2?32:38}" rx="5" ry="${st>=2?17:13}" fill="#FFB6CF"/>`
    :F==='fox'?`<path d="M48 58L48 22L76 44Z" fill="${k.c}" stroke="${k.d}" stroke-width="2"/><path d="M53 49L53 32L66 42Z" fill="#3B2A12"/><path d="M112 58L112 22L84 44Z" fill="${k.c}" stroke="${k.d}" stroke-width="2"/><path d="M107 49L107 32L94 42Z" fill="#3B2A12"/>`:'';
  const horns=F==='dragon'?`<path d="M60 44L55 22L71 38ZM100 44L105 22L89 38Z" fill="#FFE27A" stroke="#E0B640" stroke-width="1.5"/>`:'';
  const snout=F==='fox'?`<ellipse cx="80" cy="86" rx="14" ry="10" fill="${k.b}"/><circle cx="80" cy="80" r="3.6" fill="#3B2A12"/>`:F==='bunny'?`<path d="M76 80H84L80 85Z" fill="#FF8FB1"/>`:`<circle cx="75" cy="82" r="1.8" fill="${k.d}"/><circle cx="85" cy="82" r="1.8" fill="${k.d}"/>`;

function gpos(d){const P=GT.m.path;for(let i=1;i<P.length;i++){const [x0,y0]=P[i-1],[x1,y1]=P[i],l=Math.hypot(x1-x0,y1-y0);if(d<=l)return[x0+(x1-x0)*d/l,y0+(y1-y0)*d/l];d-=l}return P[P.length-1]}
const towerIcon=(t,lv)=>`<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="11" y="17" width="18" height="20" rx="3" fill="#8C8FA3"/><path d="M11 17h18v-4h-4v3h-3v-3h-4v3h-3v-3h-4z" fill="#A3AFBD"/><circle cx="20" cy="${t==='bubble'?11:12}" r="${7+(lv||1)}" fill="${GTOW[t].c}" stroke="#fff" stroke-width="2"/></svg>`;
function gateStart(){if(!canStart())return;stopGames();GT={ph:'build',m:gmCur(),w:0,cookies:10,tw:Array(6).fill(null),gobs:[],shots:[],pops:[],sp:null,time:0,paused:false,id:0,last:0};AR.run=true;rerealm();gatePaint(true);AR.raf=requestAnimationFrame(gateFrame)}

function gateFrame(t){const Z=GT;if(!AR.run||!Z||AR.mode!=='gate')return;if(!$('gfield')){stopGames();return}if(outOfTime()){gateOver('time');return}
  const dt=Z.last?Math.min(.05,(t-Z.last)/1000):0;Z.last=t;if(!Z.paused&&Z.ph==='wave')gateStep(dt);if(GT===Z&&AR.run){gatePaint();AR.raf=requestAnimationFrame(gateFrame)}}
function gateStep(dt){const Z=GT,sp=Z.sp;Z.time+=dt;
  if(sp&&sp.left>0&&(sp.cd-=dt)<=0){sp.left--;sp.cd=sp.W.gap;const boss=sp.W.boss&&sp.left===0,hp=boss?sp.W.hp*6:sp.W.hp;Z.gobs.push({id:++Z.id,d:0,hp,max:hp,sp:boss?sp.W.sp*.7:sp.W.sp,boss,slow:0})}

  Z.tw.forEach((T,i)=>{if(!T||(T.cd-=dt)>0)return;const D=GTOW[T.t],[px,py]=Z.m.pads[i],r=D.r+12*(T.lv-1);let b=null;
    for(const g of Z.gobs){const [x,y]=gpos(g.d);if(Math.hypot(x-px,y-py)<=r&&(!b||g.d>b.d))b=g}if(!b)return;T.cd=D.rate;
    const dmg=D.d[T.lv-1],[bx,by]=gpos(b.d);Z.shots.push({x0:px,y0:py,x1:bx,y1:by,c:D.c,k:T.t,t:Z.time+.15});

function padTap(i){const Z=GT;if(!Z||!['build','wave'].includes(Z.ph)||QM)return;const T=Z.tw[i];if(T&&T.lv>=3)return msg('This tower is fully upgraded!');

/* ---------- Block Builder: falling number blocks; groups that add (or multiply) to the target clear.
   Every 5 clears is a new level: blocks fall faster and score more. ---------- */
let BB=null;const BW=6,BH=9;
GSTOP.push(()=>{if(BB&&BB.ph==='run')BB=null});
const BPZ=[{id:'s10',op:'+',t:10,n:'Make 10'},{id:'s20',op:'+',t:20,n:'Make 20'},{id:'m24',op:'×',t:24,n:'Make 24'},{id:'m36',op:'×',t:36,n:'Make 36'}];
const BCOL=['#E4572E','#F97316','#D97706','#16A34A','#0D9488','#2563EB','#4F46E5','#7C3AED','#DB2777'];
const bpz=()=>BPZ.find(p=>p.id===ARS('blocks').pz)||BPZ[myGrade()<=2?0:myGrade()<=3?1:2];
const bvals=p=>p.op==='+'?Array.from({length:p.t-1},(_,i)=>i+1):Array.from({length:p.t},(_,i)=>i+1).filter(x=>p.t%x===0&&x>1&&x<p.t);
/* Most new blocks complete a block already showing at the top of a column, so a clear is always in reach */
function bdeal(){const Z=BB,p=Z.p,V=bvals(p),tops=[];for(let c=0;c<BW;c++)for(let r=0;r<BH;r++)if(Z.g[r][c]){tops.push(Z.g[r][c]);break}
  if(tops.length&&Math.random()<.65){const v=pick(tops),w=p.op==='+'?p.t-v:p.t/v;if(V.includes(w))return w}return pick(V)}
const bbMs=()=>Math.max(300,(myGrade()<=2?1000:800)*Math.pow(.86,BB.lv-1));
function bbStart(){if(!canStart())return;stopGames();BB={p:bpz(),g:Array.from({length:BH},()=>Array(BW).fill(0)),ph:'run',score:0,clears:0,lv:1,feed:[],cur:null,nx:0};AR.run=true;rerealm();BB.nx=bdeal();bbSpawn();AR.iv=setInterval(bbTick,bbMs())}
function bbSpawn(){const Z=BB;if(Z.g[0][2]){bbEnd('done');return}Z.cur={v:Z.nx||bdeal(),c:2,r:0};Z.nx=bdeal();bbPaint()}
function bbTick(){if(!AR.run||!BB||AR.mode!=='blocks'||document.hidden||QM)return;if(!$('bboard')){stopGames();return}if(outOfTime()){bbEnd('time');return}bbFall()}
function bbFall(){const Z=BB,c=Z&&Z.cur;if(!c||Z.ph!=='run')return;if(c.r+1<BH&&!Z.g[c.r+1][c.c]){c.r++;bbPaint()}else bbLand()}
function bbMove(d){const Z=BB,c=Z&&Z.cur;if(!c||Z.ph!=='run')return;const n=c.c+d;if(n<0||n>=BW||Z.g[c.r][n])return;c.c=n;bbPaint()}
function bbDrop(){const Z=BB,c=Z&&Z.cur;if(!c||Z.ph!=='run')return;while(c.r+1<BH&&!Z.g[c.r+1][c.c])c.r++;bbLand()}
/* Tap a column to slide the block there; tap its own column to drop it */
function bbCol(q){const Z=BB,c=Z&&Z.cur;if(!c||Z.ph!=='run')return;if(q===c.c)return bbDrop();while(c.c!==q){const d=q>c.c?1:-1;if(Z.g[c.r][c.c+d])break;c.c+=d}bbPaint()}
function bbGroup(r,c){const Z=BB,p=Z.p,v=(r,c)=>r>=0&&r<BH&&c>=0&&c<BW?Z.g[r][c]:0,L=[];
  for(const n of p.op==='+'?[3,2]:[2]){for(let s=c-n+1;s<=c;s++)L.push(Array.from({length:n},(_,i)=>[r,s+i]));for(let s=r-n+1;s<=r;s++)L.push(Array.from({length:n},(_,i)=>[s+i,c]))}
  return L.find(a=>a.every(([r,c])=>v(r,c))&&(p.op==='+'?a.reduce((s,[r,c])=>s+v(r,c),0)===p.t:v(...a[0])*v(...a[1])===p.t))||null}
function bbScan(){for(let r=BH-1;r>=0;r--)for(let c=0;c<BW;c++)if(BB.g[r][c]){const x=bbGroup(r,c);if(x)return x}return null}

  while(cells){chain++;const vals=cells.map(([r,q])=>Z.g[r][q]);cells.forEach(([r,q])=>Z.g[r][q]=0);
    for(let q=0;q<BW;q++){const col=[];for(let r=BH-1;r>=0;r--)if(Z.g[r][q])col.push(Z.g[r][q]);for(let r=BH-1,i=0;r>=0;r--,i++)Z.g[r][q]=col[i]||0}
    Z.clears++;Z.score+=10*cells.length*chain*Z.lv;Z.feed.unshift(`${vals.join(Z.p.op==='+'?' + ':' × ')} = ${Z.p.t}${chain>1?` · combo ×${chain}!`:''}`);Z.feed=Z.feed.slice(0,5);cells=bbScan()}
  if(chain){heroMood('beam',700);const b=$('bboard');if(b&&!calmOn())b.animate([{filter:'brightness(1.6)'},{filter:'none'}],{duration:350});
    if(Z.clears>=Z.lv*5){Z.lv++;Z.score+=25*Z.lv;Z.feed.unshift(`⭐ Level ${Z.lv}! Faster blocks, bigger points`);Z.feed=Z.feed.slice(0,5);clearInterval(AR.iv);AR.iv=setInterval(bbTick,bbMs())}}
  if(Z.ph==='run')bbSpawn()}
function bbEnd(why){const Z=BB;if(!Z)return;AR.run=false;clearInterval(AR.iv);AR.iv=0;Z.ph=why;Z.cur=null;
  if(why!=='none'){const S=ARS('blocks');Z.gems=Math.min(8,Math.floor(Z.clears/4));Z.pb=Z.score>(S.best||0);if(Z.pb)S.best=Z.score;S.lv=Math.max(S.lv||0,Z.lv);S.rounds=(S.rounds||0)+1;if(Z.gems)addGems(Z.gems);SYNC();gameCheck()}

function bbPaint(){const Z=BB,b=$('bboard');if(!Z||!b)return;const c=Z.cur;let h='';
  for(let r=0;r<BH;r++)for(let q=0;q<BW;q++){const cur=c&&c.r===r&&c.c===q,v=cur?c.v:Z.g[r][q];h+=`<div class="bcell${v?' v':''}${cur?' cur':''}"${v?` style="--bc:${BCOL[v%BCOL.length]}"`:''} onclick="bbCol(${q})">${v||''}</div>`}
  b.innerHTML=h;$('bscore').textContent=Z.score;$('blv').textContent=Z.lv;$('bnow').textContent=c?`Falling block ${c.v}, column ${c.c+1}. Next block ${Z.nx}`:'';
  const n=$('bnext');if(n){n.textContent=Z.nx||'';n.style.setProperty('--bc',BCOL[(Z.nx||0)%BCOL.length])}
  const f=$('bfeed');if(f&&f.dataset.n!=Z.clears+':'+Z.lv){f.dataset.n=Z.clears+':'+Z.lv;f.innerHTML=Z.feed.map((x,i)=>`<li${i?'':' class="new"'}>${esc(x)}${x.startsWith('⭐')?'':' ✓'}</li>`).join('')||'<li class="sol">Clear a group to see it here.</li>'}}
GVIEW.blocks=function(){const Z=BB,S=ARS('blocks'),p=Z&&Z.ph==='run'?Z.p:bpz(),head=`<div class="gworld">${clouds()}${gameHead('Block Builder',`Stack number blocks that ${p.op==='+'?'add up':'multiply'} to the target to clear them.`)}`;

    if(Z&&['done','time'].includes(Z.ph))card=`<div class="gcard endcard" style="margin-bottom:16px"><div class="big" aria-hidden="true">🧱</div><h3>${Z.ph==='time'?'Time to rest!':'Tower full!'}</h3><p>Level ${Z.lv} · ${Z.score} points · ${Z.clears} clear${Z.clears===1?'':'s'}${Z.pb?' · ⭐ New best!':''}${Z.gems?` · 💎 +${Z.gems} gems`:''}</p></div>`;
    return head+`${out?restCard():''}${card}<div class="gcard"><h3>🧱 Pick a puzzle</h3><div class="accs" role="group" aria-label="Puzzle" style="margin:0 0 12px">${BPZ.map(x=>`<button class="chip ${p.id===x.id?'on':''}" aria-pressed="${p.id===x.id}" onclick="ARS('blocks').pz='${x.id}';SYNC();rerealm()">${x.op==='+'?'➕':'✖️'} ${x.n}</button>`).join('')}</div>
      <ul class="pearn"><li>Number blocks fall one at a time. Move them with ← → or tap a column. ↓ falls faster; Space (or tapping the block's own column) drops it.</li><li>${p.op==='+'?`Line up 2 or 3 blocks side by side, or stack them, so they add up to <b>${p.t}</b>.`:`Put 2 blocks side by side, or stack them, so they multiply to <b>${p.t}</b>.`} They clear with a sparkle!</li><li>Every 5 clears is a new level: blocks fall faster and score more. A clear that sets off another clear scores a combo. The round ends when the tower reaches the top.</li></ul>
      <div class="row" style="margin-top:14px;align-items:center"><button class="abtn big" ${out?'disabled':''} onclick="bbStart()">▶ Start building</button>${S.best?`<span class="sol">Best score: <b>${S.best}</b>${S.lv?` · best level <b>${S.lv}</b>`:''}</span>`:''}</div></div></div>`}
  return head+`<div class="bbwrap"><div><div class="bbtop"><span class="btarget">${p.op==='+'?'➕':'✖️'} Make ${p.t}</span><span class="bpill">Lv <b id="blv">1</b></span><span class="bpill">Score: <b id="bscore">0</b></span></div><div class="bboard" id="bboard" role="application" aria-label="Block board. Arrow keys move the falling block, Space drops it." aria-describedby="bnow"></div><p class="bsr" id="bnow" aria-live="polite"></p>
    <div class="bctl"><button class="abtn sec" onclick="bbMove(-1)" aria-label="Move left">◀</button><button class="abtn sec" onclick="bbDrop()" aria-label="Drop">⬇</button><button class="abtn sec" onclick="bbMove(1)" aria-label="Move right">▶</button></div></div>
    <div class="gcard"><div class="bnrow"><span class="bcell v bnext" id="bnext" aria-hidden="true"></span><b>Next block</b></div><h3 style="margin:14px 0 6px">Clears</h3><ul class="bfeed" id="bfeed"></ul><button class="abtn sec sm" style="margin-top:12px" onclick="bbEnd('done')">Finish round</button></div></div></div>`};

/* ---------- Keys for the games and the question modal ---------- */
addEventListener('keydown',e=>{if(typeof tab==='undefined'||tab!=='play')return;const tg=e.target,typing=tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName);
  if(QM){if(QM.phase==='ask'&&QM.q&&QM.q.choices&&!typing&&/^[1-4]$/.test(e.key)&&+e.key<=QM.q.choices.length){e.preventDefault();qmAns(+e.key-1)}else if(e.key==='Escape'&&QM.o.cancel&&QM.phase!=='fb')qmClose(false,null);return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(AR.mode==='kart'&&KT&&KT.ph==='go'){if(k==='ArrowLeft'||k==='a'){e.preventDefault();kartLane(KT.lane-1)}else if(k==='ArrowRight'||k==='d'){e.preventDefault();kartLane(KT.lane+1)}else if(/^[123]$/.test(k)){e.preventDefault();kartLane(+k-1)}}
  else if(AR.mode==='blocks'&&BB&&BB.ph==='run'){if(k==='ArrowLeft'||k==='a'){e.preventDefault();bbMove(-1)}else if(k==='ArrowRight'||k==='d'){e.preventDefault();bbMove(1)}else if(k==='ArrowDown'||k==='s'){e.preventDefault();bbFall()}else if(k===' '||k==='Enter'){e.preventDefault();bbDrop()}}});
/* A hidden tab pauses the kart's gate clock */
document.addEventListener('visibilitychange',()=>{if(!KT||KT.ph!=='go')return;if(document.hidden)KT.hid=performance.now();else if(KT.hid){KT.gs+=performance.now()-KT.hid;KT.hid=0}});
</script>
