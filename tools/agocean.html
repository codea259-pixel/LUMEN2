<style>
/* ===== Ocean Explorer ===== */
.ocbox{margin-top:10px;min-height:70px;padding:12px 16px;border-radius:16px;background:#E0F2FE;color:#0C4A6E;border:3px solid #0EA5E9;font:700 1rem/1.45 "Atkinson Hyperlegible",sans-serif}

.oclog .c img{width:96px;height:56px}.oclog .c.unk img{filter:brightness(0) opacity(.45)}.oclog .c b{font:800 .95rem "Bricolage Grotesque",sans-serif}.oclog .c p{margin:0;font-size:.8rem;line-height:1.35;color:#BAE6FD}
.oczones{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}.oczones span{padding:6px 12px;border-radius:99px;font-weight:700;font-size:.9rem}
</style>
<script type="text/x-lumen">
/* ===== Ocean Explorer =====
   Pilot a little submarine down through the four ocean zones. Scan real sea animals to fill the Sea Log (every fact is true),
   collect pearls, and keep an eye on your air: bubble vents top it up and air stations refill it for a right answer.
   A pressure gate between zones opens with a right answer. Saved in ARS('ocean'). ===== */
const OCW=1600,OCZH=420,OCV=[640,360];
const OCZ=[{n:'Sunlight zone',m:[0,200],c:'#38BDF8',dark:0,fact:'The sunlight zone goes from the surface down to 200 meters. There is enough light here for plants and algae to grow.'},
  {n:'Twilight zone',m:[200,1000],c:'#1D4ED8',dark:.45,fact:'The twilight zone goes from 200 to 1,000 meters. Only a little sunlight reaches it, so it is too dark for plants.'},
  {n:'Midnight zone',m:[1000,4000],c:'#172554',dark:.78,fact:'The midnight zone goes from 1,000 to 4,000 meters. No sunlight reaches it, and many animals here make their own light.'},
  {n:'Abyss',m:[4000,6000],c:'#0B1026',dark:.88,fact:'The abyss goes from 4,000 to 6,000 meters. The water is cold, about 2 to 4 °C (36 to 39 °F), and the pressure is huge.'}];
/* the animals: zone, name, how to draw it, and one true fact */
const OCA=[
  {id:'clown',z:0,n:'Clownfish',k:'fish',c:'#FF7A1A',s:22,st:3,f:'Clownfish live among sea anemones. A layer of slime on their skin protects them from the anemone\'s stings.'},
  {id:'turtle',z:0,n:'Green sea turtle',k:'turtle',c:'#3E8E5A',s:46,f:'Green sea turtles get their name from the greenish color of their body fat, which comes from the seagrass and algae they eat.'},
  {id:'dolphin',z:0,n:'Bottlenose dolphin',k:'mammal',c:'#7C8DA6',s:70,f:'Dolphins are mammals: they breathe air through a blowhole on the top of their head.'},
  {id:'tang',z:0,n:'Blue tang',k:'fish',c:'#2563EB',c2:'#FACC15',s:26,f:'Blue tangs are surgeonfish. They have a sharp spine near the tail that they can raise to protect themselves.'},
  {id:'jelly',z:0,n:'Moon jellyfish',k:'jelly',c:'#C7D2FE',s:26,f:'Moon jellyfish have no brain, no heart and no bones. They drift with the currents.'},
  {id:'manta',z:0,n:'Giant manta ray',k:'ray',c:'#334155',s:90,f:'Giant manta rays can be about 7 meters (23 feet) across, yet they eat tiny plankton.'},
  {id:'sword',z:1,n:'Swordfish',k:'fish',c:'#64748B',s:60,sw:1,f:'Swordfish can warm their eyes and brain, which helps them see better in cold, dark water.'},
  {id:'lantern',z:1,n:'Lanternfish',k:'fish',c:'#334155',s:18,glow:'#7DD3FC',f:'Lanternfish make their own light with glowing spots called photophores. There are huge numbers of them in the ocean.'},
  {id:'gsquid',z:1,n:'Giant squid',k:'squid',c:'#B91C1C',s:90,f:'Giant squid have eyes about as big as dinner plates, some of the largest eyes of any animal.'},
  {id:'hatchet',z:1,n:'Hatchetfish',k:'fish',c:'#CBD5E1',s:18,deep:1,glow:'#93C5FD',f:'Hatchetfish glow on their bellies to match the faint light from above, so hunters below can\'t see their shadow.'},
  {id:'barrel',z:1,n:'Barreleye fish',k:'fish',c:'#475569',s:28,dome:1,f:'The barreleye fish has a see-through head. Its tube-shaped eyes can look up through it.'},
  {id:'angler',z:2,n:'Anglerfish',k:'fish',c:'#3F3F46',s:30,lure:1,glow:'#FDE68A',f:'A female deep-sea anglerfish has a glowing lure on her head that attracts prey in the dark.'},
  {id:'vamp',z:2,n:'Vampire squid',k:'squid',c:'#7F1D1D',s:42,f:'Despite its name, the vampire squid doesn\'t drink blood. It eats "marine snow": tiny bits of food drifting down.'},
  {id:'gulper',z:2,n:'Gulper eel',k:'eel',c:'#1F2937',s:72,f:'The gulper eel has a huge mouth that opens like a pelican\'s pouch to scoop up food.'},
  {id:'sperm',z:2,n:'Sperm whale',k:'mammal',c:'#4B5563',s:140,box:1,f:'Sperm whales dive more than 1,000 meters deep to hunt squid, and can hold their breath for over an hour.'},
  {id:'dragon',z:2,n:'Dragonfish',k:'fish',c:'#111827',s:34,glow:'#EF4444',f:'Some dragonfish make red light. Most deep-sea animals can\'t see red, so the dragonfish can spot prey without being seen.'},
  {id:'dumbo',z:3,n:'Dumbo octopus',k:'octo',c:'#F9A8D4',s:28,f:'Dumbo octopuses flap ear-like fins to swim. Some live almost 7,000 meters deep, deeper than any other known octopus.'},
  {id:'cuke',z:3,n:'Sea cucumber',k:'cuke',c:'#F472B6',s:32,floor:1,f:'Many deep-sea sea cucumbers eat seafloor mud for the tiny bits of food in it, and some can even swim.'},
  {id:'tripod',z:3,n:'Tripod fish',k:'fish',c:'#94A3B8',s:30,legs:1,floor:1,f:'The tripod fish stands on the seafloor on three long fins and faces into the current to catch food drifting by.'},
  {id:'gren',z:3,n:'Grenadier',k:'fish',c:'#9CA3AF',s:40,tail:1,f:'Grenadiers, also called rattails, have long, thin tails. They are some of the most common fish in the deep sea.'}];
const ocS=()=>{const S=ARS('ocean');S.log=S.log||{};S.zones=S.zones||1;return S};
const ocDepth=y=>{const i=Math.max(0,Math.min(3,Math.floor(y/OCZH))),Z=OCZ[i],f=Math.max(0,Math.min(1,(y-i*OCZH)/OCZH));return Math.round(Z.m[0]+f*(Z.m[1]-Z.m[0]))};
const ocZone=y=>Math.max(0,Math.min(3,Math.floor(Math.max(0,y)/OCZH)));
/* ---------- Drawing the animals (facing right; d=-1 flips) ---------- */
function ocDraw(x,a,X,Y,d,t){const s=a.s,c=a.c;x.save();x.translate(X,Y);x.scale(d,1);const ell=(cx,cy,rx,ry,f)=>{x.fillStyle=f;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill()},
  tri=(p,f)=>{x.fillStyle=f;x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.fill()},eye=(ex,ey,r)=>{ell(ex,ey,r,r,'#fff');ell(ex+r*.25,ey,r*.55,r*.55,'#111')},w=Math.sin(t*6)*s*.06;
  if(a.k==='fish'){const L=s,H=a.deep?s*.55:s*.32;
    tri([-L*.45,0,-L*.85,-H*.7+w,-L*.85,H*.7+w],a.c2||shade(c,.8));if(a.tail)tri([-L*.4,-H*.3,-L*1.5,w,-L*.4,H*.3],shade(c,.8));
    ell(0,0,L*.55,H,c);if(a.st)for(let i=-1;i<=1;i++){x.fillStyle='#fff';x.fillRect(i*L*.28-2,-H*.85,4,H*1.7)}
    tri([-L*.1,-H*.9,L*.15,-H*1.3,L*.25,-H*.8],shade(c,.75));if(a.sw)tri([L*.5,-2,L*1.2,0,L*.5,2],shade(c,.6));
    if(a.dome){x.fillStyle='rgba(186,230,253,.45)';x.beginPath();x.ellipse(L*.25,-H*.6,L*.25,H*.6,0,0,7);x.fill();ell(L*.25,-H*.5,2.5,4,'#22C55E')}else eye(L*.3,-H*.2,Math.max(2,s*.07));
    if(a.lure){x.strokeStyle=shade(c,.8);x.lineWidth=2;x.beginPath();x.moveTo(L*.2,-H*.9);x.quadraticCurveTo(L*.6,-H*2,L*.75,-H*1.3);x.stroke();ell(L*.75,-H*1.3,4,4,'#FDE68A');x.fillStyle='#fff';for(let i=0;i<4;i++)tri([L*.42+i*3,H*.1,L*.45+i*3,H*.45,L*.48+i*3,H*.1],'#fff')}
    if(a.legs){x.strokeStyle=shade(c,.7);x.lineWidth=2;x.beginPath();x.moveTo(-L*.2,H*.6);x.lineTo(-L*.3,H*2.6);x.moveTo(L*.1,H*.6);x.lineTo(L*.1,H*2.6);x.moveTo(-L*.6,0);x.lineTo(-L*.75,H*2.6);x.stroke()}
    if(a.glow==='#7DD3FC'){for(let i=0;i<4;i++)ell(-L*.3+i*L*.18,H*.5,1.6,1.6,'#7DD3FC')}if(a.glow==='#93C5FD')ell(0,H*.8,L*.4,2,'#93C5FD');if(a.glow==='#EF4444')ell(L*.32,H*.15,3,2,'#EF4444')}
  else if(a.k==='mammal'){const L=s,H=a.box?s*.2:s*.17;tri([-L*.45,0,-L*.7,-H*1.1,-L*.7,H*1.1],shade(c,.85));
    if(a.box){x.fillStyle=c;x.beginPath();x.roundRect(-L*.5,-H,L,H*2,H*.8);x.fill()}else{ell(0,0,L*.5,H,c);tri([L*.45,-H*.2,L*.68,H*.15,L*.45,H*.5],c)}
    ell(0,H*.45,L*.35,H*.4,tint(c,.35));tri([-L*.05,-H*.9,L*.08,-H*1.7,L*.15,-H*.9],shade(c,.8));eye(L*.3,-H*.15,2.5)}
  else if(a.k==='turtle'){ell(-s*.25,s*.25,s*.12,s*.08,c);ell(s*.25,s*.25,s*.12,s*.08,c);ell(-s*.3,-s*.2,s*.18,s*.08,c);ell(s*.2,-s*.25,s*.2,s*.08,c);ell(s*.48,0,s*.14,s*.11,c);ell(0,0,s*.4,s*.28,'#7A5634');ell(0,0,s*.3,s*.2,'#9A7350');eye(s*.53,-s*.03,2)}
  else if(a.k==='ray'){tri([0,-s*.1,-s*.35,0,0,s*.25,s*.35,0],c);tri([-s*.5,-s*.05+w,0,-s*.18,0,s*.15],c);tri([s*.5,-s*.05-w,0,-s*.18,0,s*.15],c);x.strokeStyle=c;x.lineWidth=2;x.beginPath();x.moveTo(0,s*.2);x.lineTo(0,s*.55);x.stroke();ell(0,s*.05,s*.12,s*.06,tint(c,.4))}
  else if(a.k==='jelly'){x.globalAlpha=.85;x.fillStyle=c;x.beginPath();x.arc(0,0,s*.5,Math.PI,0);x.fill();x.strokeStyle=c;x.lineWidth=1.5;for(let i=0;i<5;i++){x.beginPath();x.moveTo(-s*.4+i*s*.2,0);x.quadraticCurveTo(-s*.4+i*s*.2+Math.sin(t*3+i)*5,s*.5,-s*.4+i*s*.2,s);x.stroke()}ell(0,-s*.15,s*.18,s*.1,'#F0ABFC');x.globalAlpha=1}
  else if(a.k==='squid'){ell(-s*.15,0,s*.38,s*.13,c);tri([-s*.5,0,-s*.7,-s*.22,-s*.7,s*.22],shade(c,.85));x.strokeStyle=c;x.lineWidth=3;for(let i=-2;i<=2;i++){x.beginPath();x.moveTo(s*.2,i*2);x.quadraticCurveTo(s*.45,i*5+Math.sin(t*4+i)*4,s*.6,i*7);x.stroke()}eye(s*.12,-s*.03,Math.max(3,s*.06))}
  else if(a.k==='eel'){x.strokeStyle=c;x.lineWidth=5;x.beginPath();x.moveTo(-s*.6,0);for(let i=0;i<=8;i++)x.lineTo(-s*.6+i*s*.09,Math.sin(t*4+i)*5);x.stroke();tri([s*.1,0,s*.55,-s*.25,s*.55,s*.25],c);tri([s*.2,0,s*.52,-s*.17,s*.52,s*.17],'#0B0F19');eye(s*.15,-5,2)}
  else if(a.k==='octo'){ell(0,0,s*.38,s*.32,c);ell(-s*.38,-s*.12,s*.14,s*.08+Math.sin(t*5)*2,shade(c,.85));ell(s*.38,-s*.12,s*.14,s*.08+Math.sin(t*5)*2,shade(c,.85));x.strokeStyle=c;x.lineWidth=4;for(let i=-2;i<=2;i++){x.beginPath();x.moveTo(i*s*.12,s*.25);x.lineTo(i*s*.16,s*.55);x.stroke()}eye(-s*.1,-s*.03,3);eye(s*.12,-s*.03,3)}
  else if(a.k==='cuke'){x.globalAlpha=.9;ell(0,0,s*.55,s*.2,c);for(let i=-2;i<=2;i++)ell(i*s*.2,-s*.18,3,4,tint(c,.3));x.globalAlpha=1}
  x.restore()}
/* ---------- The painterly look: shaded animal sprites, reef walls, kelp, sunlight ripples ---------- */
/* each animal is painted once per direction and swim frame, then lit from above: light on top, shadow underneath */
function ocSprite(a,d,f){const k=a.id+d+f;if(OCC[k])return OCC[k];const W=Math.ceil(a.s*2.6+30),H=Math.ceil(Math.max(a.s*1.9,56)),cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;const x=cv.getContext('2d');x.scale(2,2);
  ocDraw(x,a,W/2,H/2,d,f*(Math.PI/3)/4+.01);x.globalCompositeOperation='source-atop';const g=x.createLinearGradient(0,H/2-a.s*.45,0,H/2+a.s*.45);g.addColorStop(0,'rgba(255,255,255,.38)');g.addColorStop(.42,'rgba(255,255,255,0)');g.addColorStop(.6,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,10,40,.45)');
  x.fillStyle=g;x.fillRect(0,0,W,H);x.globalCompositeOperation='source-over';cv.w=W;cv.h=H;return OCC[k]=cv}
/* the reef walls down each side, painted once for the whole depth */
function ocWall(side){const k='wall'+side;if(OCC[k])return OCC[k];const H=OCZH*4+40,cv=document.createElement('canvas');cv.width=180;cv.height=H*2;const x=cv.getContext('2d');x.scale(2,2);const R=krng(side?21:12);
  const rock=['#C9A27A','#5B6B8C','#2A3352','#151A2E'],coral=[['#FF7A9A','#FF9F45','#B57BFF','#FFD166'],['#7FA6C9','#9AB5D6','#E8C08A'],['#22D3EE','#A78BFA','#F472B6'],['#334155','#475569']];
  for(let z=0;z<4;z++){const y0=z*OCZH,g=x.createLinearGradient(0,y0,0,y0+OCZH);g.addColorStop(0,tint(rock[z],.12));g.addColorStop(1,shade(rock[z],.8));x.fillStyle=g;x.beginPath();x.moveTo(side?90:0,y0);
    for(let y=y0;y<=y0+OCZH+2;y+=18)x.lineTo(side?90-(28+R()*34):28+R()*34,y);x.lineTo(side?90:0,y0+OCZH+2);x.closePath();x.fill();
    for(let i=0;i<14;i++){const y=y0+R()*OCZH,xx=side?90-(20+R()*30):20+R()*30,c=coral[z][Math.floor(R()*coral[z].length)];
      if(z===0&&i%3===0){x.strokeStyle=c;x.lineWidth=2.5;x.lineCap='round';const br=(X,Y,a,l,n)=>{if(n<=0)return;const X2=X+Math.cos(a)*l,Y2=Y+Math.sin(a)*l;x.beginPath();x.moveTo(X,Y);x.lineTo(X2,Y2);x.stroke();br(X2,Y2,a-.5,l*.72,n-1);br(X2,Y2,a+.45,l*.72,n-1)};br(xx,y,side?Math.PI+.4:-.4,12,4)}
      else if(z===2){x.fillStyle=c;x.globalAlpha=.85;x.beginPath();x.arc(xx,y,2.5,0,7);x.fill();x.globalAlpha=.25;x.beginPath();x.arc(xx,y,7,0,7);x.fill();x.globalAlpha=1}
      else{x.fillStyle=c;x.beginPath();x.ellipse(xx,y,5+R()*5,3+R()*3,R()*3,0,7);x.fill();x.fillStyle='rgba(255,255,255,.25)';x.beginPath();x.arc(xx-1,y-1,1.5,0,7);x.fill()}}}
  return OCC[k]=cv}
/* a tile of rippling sunlight, drawn once */
function ocCaustic(){if(OCC.caus)return OCC.caus;const cv=document.createElement('canvas');cv.width=cv.height=220;const x=cv.getContext('2d'),R=krng(5);x.filter='blur(2px)';x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=3;x.lineJoin='round';
  for(let i=0;i<18;i++){const cx=R()*220,cy=R()*220,r=18+R()*22;x.beginPath();for(let a=0;a<=6.3;a+=.5){const rr=r*(.75+R()*.5);x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.stroke()}return OCC.caus=cv}
/* swaying kelp on the shelves of the sunlit zone */
function ocKelp(x,t,cx,cy){for(const [kx,h,ph] of OCKELP){if(kx<cx-40||kx>cx+680)continue;const base=OCZH-6;if(base<cy||base-h>cy+380)continue;x.strokeStyle='#2F7D32';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(kx,base);
    for(let i=1;i<=6;i++){const yy=base-h*i/6;x.lineTo(kx+Math.sin(t*1.3+ph+i*.6)*8*i/6,yy)}x.stroke();x.fillStyle='#43A047';for(let i=1;i<6;i++){const yy=base-h*i/6,xx=kx+Math.sin(t*1.3+ph+i*.6)*8*i/6;x.beginPath();x.ellipse(xx+(i%2?7:-7),yy,8,3,i%2?.5:-.5,0,7);x.fill()}}x.lineCap='butt'}
const OCKELP=(()=>{const R=krng(31),L=[];for(let i=0;i<22;i++){const left=i<11,kx=left?70+R()*250:OCW-320+R()*250;L.push([kx,90+R()*150,R()*6])}return L})();
/* the sandy shelves the kelp grows on, at the bottom of the sunlit zone (the middle stays open) */
function ocShelf(x){const y=OCZH-8;x.fillStyle='#D9C08A';for(const [a,b] of [[0,340],[OCW-340,OCW]]){x.beginPath();x.moveTo(a,y+16);x.quadraticCurveTo((a+b)/2,y-18,b,y+16);x.lineTo(b,y+22);x.lineTo(a,y+22);x.fill()}}
const ocIcon=a=>{const k='oc'+a.id;if(SQIMG[k])return SQIMG[k];const cv=document.createElement('canvas');cv.width=192;cv.height=112;const x=cv.getContext('2d'),sp=ocSprite(a,1,0),sc=Math.min(170/sp.w,100/sp.h,2.2);x.drawImage(sp,96-sp.w*sc/2,56-sp.h*sc/2,sp.w*sc,sp.h*sc);return SQIMG[k]=cv.toDataURL()};

/* ---------- The game ---------- */
AG.def({id:'ocean',name:'Ocean Explorer',w:640,h:360,maxW:1280,vh:300,snd:'pets',music:'pets',go:'Dive!',sub:'Explore the ocean zones',
  help:['Steer your submarine with the arrow keys or WASD, or tap where you want to go.','Swim close to an animal and press Space to scan it. Every scan adds a true fact to your Sea Log.','Watch your air! Swim through bubbles to top it up, or answer a question at an air station (🫧) to fill it. Run out, and the sub floats back to the surface.','A pressure gate blocks each deeper zone. Answer a question to open it for good.'],
  keys:[['← → ↑ ↓','steer'],['Space','scan or use'],['P','pause']],
  ach:{scan:{i:'🔍',n:'Marine biologist',d:'Scan your first sea animal',gems:1},z2:{i:'🌆',n:'Into the twilight',d:'Open the gate to the twilight zone',gems:1},z3:{i:'🌑',n:'Midnight diver',d:'Open the gate to the midnight zone',gems:2},
    z4:{i:'🕳️',n:'Abyss explorer',d:'Open the gate to the abyss',gems:2},log10:{i:'📒',n:'Field notes',d:'Scan 10 different animals',gems:2},logall:{i:'🐋',n:'Ocean expert',d:'Scan all 20 animals',gems:5},
    pearls:{i:'⚪',n:'Pearl diver',d:'Collect 50 pearls in all',gems:2},floor:{i:'🪨',n:'Touch the bottom',d:'Reach the seafloor, 6,000 meters down',gems:2}},
  places:()=>OCZ.map((z,i)=>({on:i<ocS().zones,i:['☀️','🌆','🌑','🕳️'][i],n:z.n,s:`${z.m[0].toLocaleString()} to ${z.m[1].toLocaleString()} m`,how:'Open its pressure gate'})),
  start(){const S=ocS(),R=krng(42),t=AD.tier('ocean'),an=[],pe=[],ve=[],st=[];
    for(const a of OCA){const y0=a.z*OCZH,y=a.floor?OCZH*4-26:y0+70+R()*(OCZH-140),x=120+R()*(OCW-240);an.push({a,x,y,x0:x,y0:y,d:R()<.5?1:-1,r:a.floor?0:60+R()*160,ph:R()*6,sc:0})}
    for(let i=0;i<36;i++)pe.push({x:60+R()*(OCW-120),y:40+R()*(OCZH*4-90),on:1});
    for(let z=0;z<4;z++){for(let i=0;i<2;i++)ve.push({x:200+R()*(OCW-400),y:z*OCZH+OCZH-30,cd:0});if(z)st.push({x:300+R()*(OCW-600),y:z*OCZH+70})}
    const snow=Array.from({length:60},()=>({x:R()*640,y:R()*360,v:6+R()*10}));
    return{x:160,y:20,vx:0,vy:0,d:1,air:100,an,pe,ve,st,snow,t:0,tier:t,tx:null,ty:null,scan:null,scanT:0,cd:0,trip:{scan:0,pearls:0,deep:0},hudT:0,gateAsk:0,msgT:0,cam:[0,0],bub:Array.from({length:24},()=>({l:0,x:0,y:0,r:2})),bubT:0}},
  ready(Z){ocMsg(Z,'Captain\'s log',`Dive in! You are in the ${OCZ[0].n}. Swim close to animals and press Space to scan them.`)},
  step(dt,Z){const S=ocS();Z.t+=dt;if(Z.cd>0)Z.cd-=dt;

const ocMask=()=>{if(!OCC.mask){OCC.mask=document.createElement('canvas');OCC.mask.width=640;OCC.mask.height=360}return OCC.mask};
function ocLight(){if(OCC.light)return OCC.light;const c=document.createElement('canvas');c.width=c.height=360;const x=c.getContext('2d'),g=x.createRadialGradient(180,180,10,180,180,180);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.5,'rgba(0,0,0,.9)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,360,360);return OCC.light=c}
const ocDark=y=>{const i=ocZone(y),f=(Math.max(0,y)-i*OCZH)/OCZH,a=OCZ[i].dark,b=OCZ[Math.min(3,i+1)].dark;return a+(b-a)*Math.max(0,f-.6)/.4*(i<3?1:0)};
