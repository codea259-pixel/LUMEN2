<script type="text/x-lumen">
/* ===== Goblin Gate: a tower defense =====
   Goblins walk the road to the castle; every one that gets through eats a cookie (10 to start). Gold from stopped
   goblins builds towers on the stone pads: Ice (slows), Fire (burns), Lightning (strikes) and Catapult (smashes groups).
   18 towers in four rarities (from chests bought with Gate coins); each grows from level 1 to 7, and every upgrade needs a
   right answer. Take up to 5 towers into a stage. Seven stages; each ends with a boss, and stage 7 with the Goblin King:
   right answers charge the castle cannon. Between waves a bonus question pays gold; with 3 cookies left a rescue
   question freezes every goblin. Stars: winning, keeping 8 cookies, and the map's own goal. Difficulty (AD) sets
   goblin health and speed, starting gold and the question level. Saved in GM.ar.gate. ===== */
const GGW=640,GGH=360;
const GGMAPS=[
  {id:'valley',n:'Goblin Valley',waves:5,hp:1,bg:['#7CCB6B','#6DBF62'],road:['#B8935C','#D9B98A'],deco:'tree',goal:['variety','Build 5 different towers'],path:[[-30,80],[140,80],[140,270],[320,270],[320,100],[480,100],[480,230],[592,230]]},
  {id:'frozen',n:'Frozen Kingdom',waves:6,hp:1.35,bg:['#E6F1FA','#D3E3F0'],road:['#9AAAB9','#BDCAD6'],deco:'pine',snow:1,goal:['perfect','Lose no cookies'],path:[[-30,290],[110,290],[110,70],[290,70],[290,280],[470,280],[470,80],[592,80]]},
  {id:'crystal',n:'Crystal Forest',waves:7,hp:1.7,bg:['#3F7F6A','#356F5C'],road:['#7B6A9A','#9A88BC'],deco:'crystal',goal:['few','Win with 5 towers or fewer'],path:[[-30,180],[100,180],[100,60],[250,60],[250,300],[400,300],[400,60],[520,60],[520,240],[592,240]]},
  {id:'swamp',n:'Murky Swamp',waves:7,hp:2,bg:['#4B5D2E','#58703A'],road:['#6B5A3A','#85704A'],deco:'reed',goal:['lvl5','Get a tower to level 5'],path:[[-30,200],[120,200],[120,60],[260,60],[260,300],[420,300],[420,140],[560,140],[560,250],[592,250]]},
  {id:'lava',n:'Lava Mountains',waves:8,hp:2.35,bg:['#5A3A30','#4E322A'],road:['#3A2A26','#5A4038'],deco:'rock',ember:1,goal:['upg','Upgrade towers 6 times'],path:[[-30,60],[210,60],[210,190],[80,190],[80,310],[390,310],[390,170],[530,170],[530,80],[592,80]]},
  {id:'sky',n:'Sky Castle',waves:8,hp:2.75,bg:['#BFE3FF','#A8D4F7'],road:['#F2E3B5','#FFF4CF'],deco:'cloud',goal:['cannon','Fire the castle cannon 3 times'],path:[[-30,300],[150,300],[150,120],[300,120],[300,250],[450,250],[450,90],[592,90]]},
  {id:'fortress',n:'Goblin Stronghold',waves:10,hp:3.2,bg:['#3A3A44','#45454F'],road:['#57534E','#6B6560'],deco:'spike',ember:1,king:1,goal:['few7','Lose 3 cookies or fewer'],path:[[-30,60],[100,60],[100,300],[220,300],[220,120],[360,120],[360,300],[480,300],[480,180],[592,180]]}];
/* 18 towers in four rarities. Stats are for level 1; each level makes them stronger (ggStat). shot: how it attacks */
const GRAR=[['Common','#94A3B8'],['Rare','#3B82F6'],['Epic','#A855F7'],['Legendary','#F59E0B']];
const GGT={
  archer:{n:'Archer Post',i:'🏹',c:'#C08A3E',rar:0,role:'Fast arrows at one goblin',cost:40,r:100,rate:.55,dmg:5,shot:'arrow'},
  ice:{n:'Frost Spire',i:'❄️',c:'#7FD3FF',rar:0,role:'Slows goblins; freezes them from level 4',cost:50,r:95,rate:.9,dmg:4,slow:.5,slowT:1.6,shot:'ice'},
  fire:{n:'Fire Brazier',i:'🔥',c:'#FF7A3D',rar:0,role:'Sets goblins on fire',cost:60,r:100,rate:.8,dmg:6,burn:3,shot:'fire'},
  cat:{n:'Stone Thrower',i:'🪨',c:'#C8A46A',rar:0,role:'Throws rocks that smash groups',cost:80,r:140,rate:1.6,dmg:16,splash:34,shot:'rock'},
  mine:{n:'Gold Mine',i:'⛏️',c:'#F2C14E',rar:0,role:'Makes gold after every wave',cost:70,r:0,rate:0,dmg:0,gold:15,shot:'none'},
  bolt:{n:'Storm Coil',i:'⚡',c:'#FFE14D',rar:1,role:'Lightning that jumps between goblins',cost:70,r:110,rate:1.1,dmg:12,chain:1,pierce:1,shot:'bolt'},
  xbow:{n:'Crossbow Nest',i:'🎯',c:'#8B5A2B',rar:1,role:'Very fast bolts that pierce armor',cost:90,r:120,rate:.32,dmg:6,pierce:1,shot:'arrow'},
  drum:{n:'War Drum',i:'🥁',c:'#DC2626',rar:1,role:'Towers nearby attack faster',cost:80,r:90,rate:0,dmg:0,buff:.12,sup:'rate',shot:'none'},
  bog:{n:'Bog Cauldron',i:'🧪',c:'#65A30D',rar:1,role:'A poison cloud hurts every goblin nearby',cost:90,r:80,rate:1,dmg:6,aura:1,shot:'aura',fx:'#84CC16'},
  gale:{n:'Gale Mill',i:'🌬️',c:'#A5F3FC',rar:1,role:'Blows goblins back down the road',cost:85,r:90,rate:2.2,dmg:3,aura:1,knock:24,shot:'aura',fx:'#E0F2FE'},
  cannon:{n:'Iron Cannon',i:'💣',c:'#57534E',rar:2,role:'Huge blasts on groups',cost:140,r:150,rate:2.2,dmg:45,splash:46,shot:'shell'},
  arcane:{n:'Arcane Tower',i:'🔮',c:'#A855F7',rar:2,role:'Magic that ignores armor and jumps',cost:130,r:125,rate:.9,dmg:16,pierce:1,chain:1,shot:'magic'},
  dragon:{n:'Dragon Roost',i:'🐉',c:'#16A34A',rar:2,role:'Breathes fire on whole groups',cost:160,r:115,rate:1.2,dmg:14,splash:40,burn:6,shot:'fire'},
  banner:{n:'Royal Banner',i:'🚩',c:'#2563EB',rar:2,role:'Towers nearby hit harder',cost:120,r:95,rate:0,dmg:0,buff:.18,sup:'dmg',shot:'none'},
  phoenix:{n:'Phoenix Perch',i:'🪶',c:'#F97316',rar:3,role:'A firestorm burns everything around it',cost:220,r:110,rate:1.4,dmg:30,aura:1,burn:14,shot:'aura',fx:'#FB923C'},
  titan:{n:'Thunder Titan',i:'🌩️',c:'#FACC15',rar:3,role:'Giant lightning that stuns',cost:240,r:140,rate:1.5,dmg:60,chain:3,stun:.5,pierce:1,shot:'bolt'},
  star:{n:'Star Mage',i:'✨',c:'#F0ABFC',rar:3,role:'A star beam at the strongest goblin',cost:230,r:160,rate:1.1,dmg:90,pierce:1,strong:1,shot:'beam'},
  golem:{n:'Clockwork Golem',i:'⚙️',c:'#B45309',rar:3,role:'Stomps and stuns every goblin nearby',cost:210,r:85,rate:1.8,dmg:40,aura:1,stun:.8,shot:'aura',fx:'#D6A35C'}};
const GGOB={grunt:{hp:30,sp:42,gold:5,c:'#7ED957',r:11},runner:{hp:18,sp:72,gold:5,c:'#C8E86A',r:9},brute:{hp:95,sp:30,gold:12,c:'#5AA04A',r:15,armor:.3},boss:{hp:780,sp:23,gold:60,c:'#4E7E2A',r:24,armor:.25},
  king:{hp:5200,sp:15,gold:200,c:'#3F6212',r:30,armor:.4}};
const GFLAG={red:'#E4572E',blue:'#2D7FF9',gold:'#E5B53A',green:'#22B35E',purple:'#8B5CF6',rainbow:'rainbow'};
if(!AGKEY['5'])AGKEY['5']='5';
const ggS=()=>{const S=ARS('gate');
  /* older saves used other map names: carry the stars across */
  if(!S.v2){const M={meadow:'valley',forest:'frozen',snow:'crystal'};if(S.st){const o={};for(const [k,v] of Object.entries(S.st))o[M[k]||k]=v;S.st=o}if(M[S.map])S.map=M[S.map];S.v2=1}
  S.st=S.st||{};if(!S.own){S.own=['archer','ice','fire','cat','bolt'];S.load=S.own.slice();S.coins=20;S.cp={};S.pity=0}S.cp=S.cp||{};S.load=(S.load||[]).filter(k=>S.own.includes(k)).slice(0,5);if(!S.load.length)S.load=S.own.slice(0,5);return S};
const ggOpen=i=>!i||(ggS().st[GGMAPS[i-1].id]||0)>0||(ggS().st[GGMAPS[i].id]||0)>0;
const ggCur=()=>{let i=GGMAPS.findIndex(m=>m.id===ggS().map);if(i<0||!ggOpen(i))i=0;return GGMAPS[i]};
const ggFlag=()=>{const f=ggS().flag;return GFLAG[f]&&AG.has('gate.flag.'+f)?f:'red'};

/* ---------- The road and the stone pads ---------- */
GGMAPS.forEach(m=>{const P=m.path;m.seg=[];m.len=0;for(let i=1;i<P.length;i++){const l=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);m.seg.push([P[i-1],P[i],l,m.len]);m.len+=l}
  /* pads: spots near the road that see the most of it, spread apart */
  const near=(x,y)=>{let best=1e9;for(const [a,b] of m.seg){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy)));best=Math.min(best,Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy))}return best};
  const C=[];for(let y=34;y<=330;y+=10)for(let x=40;x<=570;x+=10){const d=near(x,y);if(d<38||d>66)continue;let cov=0;for(let s=0;s<m.len;s+=20){const [px,py]=ggPosOf(m,s);if(Math.hypot(px-x,py-y)<110)cov++}C.push([x,y,cov])}
  C.sort((a,b)=>b[2]-a[2]);m.pads=[];for(const [x,y] of C){if(m.pads.length>=8)break;if(m.pads.every(([a,b])=>Math.hypot(a-x,b-y)>=74))m.pads.push([x,y])}});
function ggPosOf(m,d){for(const [a,b,l,s0] of m.seg||[])if(d<=s0+l){const f=(d-s0)/l;return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}const e=m.path[m.path.length-1];return[e[0],e[1]]}

/* ---------- The game ---------- */
const GGTIER=[{hp:.8,sp:.88,gold:160},{hp:1,sp:1,gold:130},{hp:1.2,sp:1.08,gold:115},{hp:1.42,sp:1.15,gold:100}];
/* a tower's numbers at its level, with copies (+5% each) and support towers nearby */
const ggStat=(T,Z,i)=>{const D=GGT[T.t],L=T.lvl||1,cp=1+.05*Math.min(5,(ggS().cp||{})[T.t]||0);
  const s={r:D.r?D.r+5*(L-1):0,rate:D.rate?D.rate*Math.pow(.93,L-1):0,dmg:D.dmg*(1+.42*(L-1))*cp,slow:D.slow?Math.max(.18,D.slow-.045*(L-1)):0,slowT:D.slowT?D.slowT+.15*(L-1):0,burn:D.burn?D.burn*(1+.38*(L-1))*cp:0,
    splash:D.splash?D.splash+3*(L-1):0,chain:D.chain?D.chain+Math.floor((L-1)/2):0,stun:D.stun?D.stun+.06*(L-1):0,freeze:T.t==='ice'&&L>=4?.05*(L-3):0,knock:D.knock?D.knock+4*(L-1):0,gold:D.gold?D.gold+9*(L-1):0,buff:D.buff?D.buff+.035*(L-1):0,pierce:!!D.pierce};
  if(Z&&i>=0)Z.tw.forEach((o,j)=>{if(!o||j===i)return;const E=GGT[o.t];if(!E.sup)return;const Lo=o.lvl||1,[ax,ay]=Z.m.pads[j],[bx,by]=Z.m.pads[i];if(Math.hypot(ax-bx,ay-by)>E.r+5*(Lo-1))return;const b=E.buff+.035*(Lo-1);if(E.sup==='rate')s.rate*=1-b;else{s.dmg*=1+b;s.burn*=1+b}});
  return s};
AG.def({id:'gate',name:'Goblin Gate',w:GGW,h:GGH,maxW:1280,vh:200,pixel:true,snd:'gate',go:'Start defending',
  sub:'Build towers, answer to upgrade, save the cookies!',
  help:['Goblins walk the road to your castle. Each one that gets in eats a cookie.','Tap a stone pad, then build one of your 5 towers. Stopped goblins give gold.','Tap a tower to level it up, all the way to level 7. Every upgrade needs a right answer.','Each stage ends with a boss (answer to fire the castle cannon). Stage 7 brings the Goblin King!','Win Gate coins to open chests for new towers.'],
  keys:[['← →','pick a pad'],['1 2 3 4 5','build'],['Space','start the wave'],['P','pause']],
  ach:{win:{i:'🏰',n:'Castle keeper',d:'Win a stage',gems:1,give:'gate.flag.blue'},boss:{i:'👑',n:'Boss buster',d:'Defeat a boss',gems:1,give:'gate.flag.gold'},
    variety:{i:'🎨',n:'Master builder',d:'Build 5 different towers in one game',gems:1,give:'gate.flag.green'},max:{i:'⬆️',n:'Level 7',d:'Upgrade a tower to level 7',gems:2},
    perfect:{i:'💯',n:'Not one cookie',d:'Win a stage without losing a cookie',gems:2,give:'gate.flag.purple'},cannon:{i:'💥',n:'Cannon captain',d:'Fire the castle cannon 5 times',gems:1},
    freeze:{i:'🧊',n:'Deep freeze',d:'Freeze 30 goblins solid',gems:1},chain:{i:'🌩️',n:'Chain reaction',d:'Hit 4 goblins with one lightning strike',gems:1},
    tour:{i:'🗺️',n:'Kingdom guard',d:'Unlock every stage',gems:2},stars:{i:'⭐',n:'Star defender',d:'3 stars on every stage',gems:3,give:'gate.flag.rainbow'},
    king:{i:'🤴',n:'King toppler',d:'Defeat the Goblin King on stage 7',gems:5},collect:{i:'🗃️',n:'Tower collector',d:'Own 10 different towers',gems:2},legend:{i:'🌟',n:'Legendary!',d:'Get a Legendary tower',gems:2}},
  items:{'gate.flag.red':{n:'Red banner',c:GFLAG.red,free:1,k:'Castle banner'},'gate.flag.blue':{n:'Blue banner',c:GFLAG.blue,k:'Castle banner',how:'Win a stage'},'gate.flag.gold':{n:'Gold banner',c:GFLAG.gold,k:'Castle banner',how:'Defeat a boss'},
    'gate.flag.green':{n:'Green banner',c:GFLAG.green,k:'Castle banner',how:'Build 5 different towers'},'gate.flag.purple':{n:'Royal banner',c:GFLAG.purple,k:'Castle banner',how:'Win without losing a cookie'},'gate.flag.rainbow':{n:'Rainbow banner',i:'🌈',k:'Castle banner',how:'3 stars on every stage'}},
  places:()=>GGMAPS.map((m,i)=>({on:ggOpen(i),i:'🏰',n:`Stage ${i+1}: ${m.n}`,s:'★'.repeat(ggS().st[m.id]||0)||'Not won yet',how:i?`Win stage ${i}`:''})),
  start(o){const m=ggCur(),t=AD.tier('gate'),tier=GGTIER[t];
    return{m,mi:GGMAPS.indexOf(m),t,tier,w:0,ph:'build',cookies:10,gold:tier.gold,tw:m.pads.map(()=>null),gobs:[],proj:[],fx:[],texts:[],sel:-1,speed:1,q:[],qcd:0,load:ggS().load.slice(),
      boss:null,cannonCd:0,bonus:0,rescue:0,time:0,lostWave:0,stats:{perfect:0,built:{},upg:0,cannon:0,freeze:0,coins:0,maxL:1},hudT:0,id:0}},
  step(dt,Z){if(Z.ph==='end')return;dt*=Z.speed;Z.time+=dt;
    if(Z.cannonCd>0)Z.cannonCd-=dt;
    for(const f of Z.fx)if(f.l>0)f.l-=dt;for(const t of Z.texts)if(t.l>0){t.l-=dt;t.y-=24*dt}
    if(Z.ph==='wave'){
      if(Z.q.length&&(Z.qcd-=dt)<=0){const [k,gap]=Z.q.shift();Z.qcd=gap;ggSpawn(Z,k)}
      for(const g of Z.gobs){if(g.dead)continue;const now=Z.time;let sp=g.sp;if(g.frz>now||g.stun>now)sp=0;else if(g.slowU>now)sp*=g.slowF;
        if(g.burnU>now){g.hp-=g.burn*dt;if(g.hp<=0)ggKill(Z,g)}g.d+=sp*dt;g.walk+=sp*dt*.08;
        if(g.k==='king')ggKingAct(Z,g,dt);
        if(g.d>=Z.m.len&&!g.dead){g.dead=1;g.out=1;Z.cookies=Math.max(0,Z.cookies-(g.k==='king'?10:g.k==='boss'?3:1));Z.lostWave=1;SND.play('hurt');ggtext(Z,600,Z.m.path[Z.m.path.length-1][1]-20,'-🍪','#ff6b6b')}}
      Z.gobs=Z.gobs.filter(g=>!g.dead);
      if(Z.cookies<=0)return ggOver(Z);
      if(Z.cookies<=3&&!Z.rescue)ggRescue(Z);
      /* towers: aim at the goblin closest to the castle (the Star Mage aims at the strongest); auras hit everyone in range */
      Z.tw.forEach((T,i)=>{if(!T)return;const D=GGT[T.t];if(!D.rate)return;T.cd-=dt;if(T.cd>0)return;const s=ggStat(T,Z,i),[px,py]=Z.m.pads[i];let best=null;
        for(const g of Z.gobs){const [x,y]=ggPosOf(Z.m,g.d);if(Math.hypot(x-px,y-py)<=s.r&&(!best||(D.strong?g.hp>best.hp:g.d>best.d)))best=g}
        if(!best)return;T.cd=s.rate;ggFire(Z,T,i,s,best)});
      for(const p of Z.proj)if(p.l>0){p.t+=dt;if(p.t>=p.dur){p.l=0;ggHit(Z,p)}}
      if(!Z.q.length&&!Z.gobs.length)ggWaveDone(Z)}
    if((Z.hudT+=dt)>.2){Z.hudT=0;gghud(Z)}},
  draw(a,Z){ggdraw(Z)},
  key(k,down,Z){if(!down)return;const n=Z.tw.length;if(k==='right'||k==='down'){Z.sel=(Z.sel+1+n)%n;ggpanel(Z)}else if(k==='left'||k==='up'){Z.sel=(Z.sel-1+n)%n;ggpanel(Z)}
    else if(/^[1-5]$/.test(k)&&Z.sel>=0&&!Z.tw[Z.sel]&&Z.load[+k-1])ggBuild(Z,Z.load[+k-1]);else if(k==='act'||k==='enter'){if(Z.ph==='build')ggWave(Z)}},

  /* stone pads */m.pads.forEach(([px,py],i)=>{if(Z.tw[i])return;const a=Math.round(px/2),b=Math.round(py/2),s=ggPx('pad'+(i===Z.sel?1:0),20,12,q=>{q.fillStyle='rgba(0,0,0,.3)';q.beginPath();q.ellipse(10,7,9,4.5,0,0,7);q.fill();q.fillStyle=i===Z.sel?'#F8E7A8':'#B9BDCB';q.beginPath();q.ellipse(10,5.5,8.5,4,0,0,7);q.fill();q.fillStyle='#8C90A0';q.fillRect(5,5,10,.8);q.fillRect(9.5,3,.8,5)});c.drawImage(s,a-10,b-6)});
  /* towers and goblins, back to front */const items=[];Z.tw.forEach((T,i)=>{if(T)items.push([m.pads[i][1],0,T,i])});for(const g of Z.gobs)items.push([ggPosOf(m,g.d)[1],1,g]);items.sort((a,b)=>a[0]-b[0]);
  for(const it of items){if(!it[1]){const T=it[2],[px,py]=m.pads[it[3]],s=ggTowerPx(T),a=Math.round(px/2),b=Math.round(py/2);c.drawImage(s,a-12,b-50);const L=T.lvl||1,top=b-34+38-(12+L*1.6);
      if((T.t==='fire'||T.t==='phoenix')&&!calm){const f=(t*12|0)%3,y0=T.t==='fire'?top-8:b-22;c.fillStyle='#FF7A3D';c.fillRect(a-3,y0+f%2,6,4);c.fillStyle='#FDE047';c.fillRect(a-1,y0-2+f,2,4)}
      if(T.t==='gale'){const q=t*(calm?0:4),cy=top-4;for(let k=0;k<4;k++){const an=q+k*Math.PI/2,ca=Math.cos(an),sa=Math.sin(an);for(let r=1;r<10;r++){c.fillStyle='#5B3413';c.fillRect(Math.round(a+ca*r),Math.round(cy+sa*r),1,1);if(r>3){c.fillStyle='#F5F5F4';c.fillRect(Math.round(a+ca*r-sa*1.6),Math.round(cy+sa*r+ca*1.6),1,1);c.fillRect(Math.round(a+ca*r-sa*2.6),Math.round(cy+sa*r+ca*2.6),1,1)}}}c.fillStyle='#3F2410';c.fillRect(a-1,cy-1,2,2)}
      if((T.t==='arcane'||T.t==='star')&&!calm&&(t*4|0)%3===0){c.fillStyle='#FFFFFF';c.fillRect(a+3,top-9,1,1);c.fillRect(a-4,top-4,1,1)}
      if((T.t==='bolt'||T.t==='titan')&&((t*8|0)%4===0)&&!calm){c.fillStyle='#FFF7AE';c.fillRect(a-1,top-15-L,3,3)}
      if(it[3]===Z.sel){const r=ggStat(T,Z,it[3]).r/2;c.fillStyle='rgba(255,255,255,.75)';for(let k=0;k<48;k++){const q=k/48*Math.PI*2;c.fillRect(Math.round(a+Math.cos(q)*r),Math.round(b+Math.sin(q)*r),1,1)}}}
    else{const g=it[2],[gx,gy]=ggPosOf(m,g.d),fr=calm?0:(Math.floor(g.walk*6)%2),v=g.hit>t?'hit':g.frz>t?'frz':'',s=ggGobPx(g.k,fr,v),a=Math.round(gx/2),b=Math.round(gy/2);c.fillStyle='rgba(0,0,0,.25)';c.fillRect(a-Math.round(s.width*.3),b+Math.round(s.height*.35),Math.round(s.width*.6),2);
      c.drawImage(s,a-(s.width>>1),b-Math.round(s.height*.6));if(g.shieldU>t){c.fillStyle='rgba(159,227,255,.35)';c.beginPath();c.arc(a,b-Math.round(s.height*.2),Math.round(s.width*.62),0,7);c.fill();c.fillStyle='#9FE3FF';for(let q=0;q<36;q++){const an=q/36*Math.PI*2;c.fillRect(Math.round(a+Math.cos(an)*s.width*.62),Math.round(b-s.height*.2+Math.sin(an)*s.width*.62),1,1)}}if(g.burnU>t&&!calm){c.fillStyle=(t*10|0)%2?'#FF7A3D':'#FDE047';c.fillRect(a-1,b-Math.round(s.height*.6)-3,2,3)}
      if(g.hp<g.max){const w=Math.max(8,Math.round(s.width*.8)),y0=b-Math.round(s.height*.6)-5;c.fillStyle='#1B1B1B';c.fillRect(a-(w>>1)-1,y0-1,w+2,3);c.fillStyle=g.k==='boss'?'#FF5A7A':'#5FF3A0';c.fillRect(a-(w>>1),y0,Math.round(w*Math.max(0,g.hp/g.max)),1)}}}
  if(Z.sel>=0&&!Z.tw[Z.sel]){const [px,py]=m.pads[Z.sel],a=Math.round(px/2),b=Math.round(py/2);c.fillStyle='#FFD34D';for(let k=0;k<32;k++){const q=k/32*Math.PI*2;c.fillRect(Math.round(a+Math.cos(q)*12),Math.round(b+Math.sin(q)*6.5),1,1)}}
  /* shots and effects */
  for(const p of Z.proj){if(p.l<=0)continue;const f=p.t/p.dur,px=(p.x0+(p.x1-p.x0)*f)/2,py=(p.y0+(p.y1-p.y0)*f-(p.k==='rock'||p.k==='shell'?Math.sin(f*Math.PI)*50:0))/2;c.fillStyle=p.k==='ice'?'#BFF0FF':p.k==='fire'?'#FF9A3C':p.k==='magic'?'#E879F9':p.k==='arrow'?'#F5E6C8':p.k==='shell'?'#1F2937':'#8A6A4A';const s=p.k==='rock'||p.k==='shell'?3:p.k==='arrow'?1:2;c.fillRect(Math.round(px-s/2),Math.round(py-s/2),s,s);if(p.k==='fire'){c.fillStyle='#FFE27A';c.fillRect(Math.round(px),Math.round(py),1,1)}}
  for(const f of Z.fx){if(f.l<=0)continue;const a=f.l/f.d;c.globalAlpha=Math.min(1,a*1.5);
    if(f.k==='bolt'||f.k==='cannon'||f.k==='beam'){c.fillStyle=f.c||(f.k==='bolt'?'#FFF27A':f.k==='beam'?'#F5D0FE':'#FFB347');const n=f.k==='bolt'?6:f.k==='beam'?16:12;let lx=f.x/2,ly=f.y/2;for(let k=1;k<=n;k++){const tt=k/n,nx=(f.x+(f.a-f.x)*tt)/2+(k<n&&f.k==='bolt'?(Math.random()-.5)*6:0),ny=(f.y+(f.b-f.y)*tt)/2+(k<n&&f.k==='bolt'?(Math.random()-.5)*6:0),st=Math.max(Math.abs(nx-lx),Math.abs(ny-ly));for(let q=0;q<=st;q++){const w=f.k==='beam'?3:f.k==='cannon'?2:1;c.fillRect(Math.round(lx+(nx-lx)*q/Math.max(1,st)),Math.round(ly+(ny-ly)*q/Math.max(1,st)),w,w)}lx=nx;ly=ny}}
    else if(f.k==='nova'||f.k==='ring'){const r=f.a*(1-a*.6)/2;c.fillStyle=f.c||'#BFF0FF';for(let k=0;k<40;k++){const q=k/40*Math.PI*2;c.fillRect(Math.round(f.x/2+Math.cos(q)*r),Math.round(f.y/2+Math.sin(q)*r),1,1)}}
    else{const r=Math.max(1,f.a*(1.2-a*.6)/2);c.fillStyle=f.k==='crash'?'#A07A52':f.k==='boom'?'#FF7A3D':f.k==='spark'?'#FFFFFF':'#E8F6FF';for(let k=0;k<10;k++){const q=k/10*Math.PI*2+f.x;c.fillRect(Math.round(f.x/2+Math.cos(q)*r),Math.round(f.y/2+Math.sin(q)*r),2,2)}}c.globalAlpha=1}
  if(m.snow&&!AG.low()&&!calm){c.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<40;i++)c.fillRect(Math.round(((i*73+t*20)%GGW)/2),Math.round(((i*41+t*(30+i%5*6))%GGH)/2),1,1)}
  if(m.ember&&!AG.low()&&!calm){c.fillStyle='rgba(255,140,60,.9)';for(let i=0;i<24;i++)c.fillRect(Math.round(((i*97)%GGW)/2),Math.round((GGH-((i*53+t*(26+i%4*8))%GGH))/2),1,1)}
  x.imageSmoothingEnabled=false;x.drawImage(L,0,0,GGW,GGH);
  /* words stay sharp: drawn after the pixels */
  x.textAlign='center';x.textBaseline='middle';x.font='800 13px "Bricolage Grotesque",sans-serif';x.fillStyle='rgba(0,0,0,.5)';x.fillText('🍪 '+Z.cookies,e[0]-1,e[1]-112);x.fillStyle='#fff';x.fillText('🍪 '+Z.cookies,e[0]-2,e[1]-113);
  if(Z.boss&&!Z.boss.dead){const B=Z.boss,w=300,fr=Math.max(0,B.hp/B.max);x.fillStyle='rgba(15,10,25,.7)';x.fillRect(170,8,w,20);x.fillStyle=B.k==='king'?'#DC2626':'#F97316';x.fillRect(172,10,(w-4)*fr,16);if(B.shieldU>Z.time){x.fillStyle='rgba(159,227,255,.55)';x.fillRect(172,10,w-4,16)}x.font='800 11px "Bricolage Grotesque",sans-serif';x.fillStyle='#fff';x.fillText(`${B.k==='king'?'🤴 THE GOBLIN KING':'👑 BOSS'}  ${Math.ceil(B.hp)} / ${B.max}`,320,18.5)}
  x.font='800 14px "Bricolage Grotesque",sans-serif';for(const tx of Z.texts)if(tx.l>0){x.globalAlpha=Math.min(1,tx.l*1.5);x.fillStyle='rgba(0,0,0,.5)';x.fillText(tx.s,tx.x+1,tx.y+1);x.fillStyle=tx.c;x.fillText(tx.s,tx.x,tx.y)}x.globalAlpha=1}
const ggfx=(Z,k,x0,y0,a,b,d)=>{let f=Z.fx.find(q=>q.l<=0);if(!f){if(Z.fx.length>70)return null;f={};Z.fx.push(f)}Object.assign(f,{k,x:x0,y:y0,a,b,l:d,d,c:null});return f};
const ggtext=(Z,x0,y0,s,c)=>{let t=Z.texts.find(q=>q.l<=0);if(!t){if(Z.texts.length>14)return;t={};Z.texts.push(t)}Object.assign(t,{x:Math.max(60,Math.min(GGW-60,x0)),y:Math.max(Z.boss?46:16,y0),s,c,l:1.4})};

/* ---------- The side panel: status, the wave button, building and upgrading ---------- */
function gghud(Z){const h=$('gghud');if(!h)return;const s=`<span>🍪 ${Z.cookies}</span><span>💰 ${Z.gold}</span><span>🌊 ${Math.min(Z.w+1,Z.m.waves)}/${Z.m.waves}</span>`;if(h.innerHTML!==s)h.innerHTML=s;
  const cb=$('ggcannon');if(cb){const on=Z.boss&&Z.cannonCd<=0;cb.disabled=!on;cb.querySelector('small').textContent=Z.boss?(on?'Answer right to blast the boss':'Reloading…'):'Ready for the boss'}
  document.querySelectorAll('.ggbuild').forEach(b=>b.disabled=Z.gold<+b.dataset.cost);document.querySelectorAll('.ggup').forEach(b=>b.disabled=Z.gold<+b.dataset.cost)}
function ggpanel(Z){const el=$('ggpanel');if(!el)return;const i=Z.sel,T=i>=0?Z.tw[i]:null;let h='';
  if(Z.ph==='build')h+=`<div class="ggbtns"><button class="abtn" style="justify-content:center" onclick="AG.cur&&ggWave(AG.cur.st)">⚔️ Start wave ${Z.w+1}</button>${Z.bonusOn?`<button onclick="AG.cur&&ggBonus(AG.cur.st)"><span class="ic" style="background:#FEF3C7">❓</span><span>Bonus question<small>Answer right for 20 gold</small></span></button>`:''}</div>`;
  else h+=`<p class="sol" style="margin:0">Goblins incoming! Keep building and upgrading.</p>`;
  if(Z.boss||Z.m.waves-1===Z.w)h+=`<div class="ggbtns"><button id="ggcannon" ${Z.boss&&Z.cannonCd<=0?'':'disabled'} onclick="AG.cur&&ggCannon(AG.cur.st)"><span class="ic" style="background:#FFE4D6">💥</span><span>Castle cannon<small>Ready for the boss</small></span></button></div>`;
  if(i<0)h+=`<p class="sol" style="margin:10px 0 0">Tap a stone pad on the map to build a tower.</p>`;
  else if(!T)h+=`<h4 style="margin-top:12px">Build here</h4><div class="ggbtns">${Z.load.map((k,j)=>{const D=GGT[k];return `<button class="ggbuild" data-cost="${D.cost}" ${Z.gold<D.cost?'disabled':''} onclick="AG.cur&&ggBuild(AG.cur.st,'${k}')"><span class="ic" style="background:${D.c}55">${D.i}</span><span>${D.n} · 💰 ${D.cost}<small>${j+1} · ${esc(D.role)}</small></span></button>`}).join('')}</div>`;
  else{const D=GGT[T.t],cost=ggUpCost(T),st=ggStat(T,Z,i),nx=T.lvl<7?ggStat({t:T.t,lvl:T.lvl+1},Z,i):null;h+=`<h4 style="margin-top:12px">${D.i} ${D.n} · Level ${T.lvl}</h4><p class="sol" style="margin:0">${esc(D.role)}</p>
      <p class="sol" style="margin:4px 0 0">${D.rate?`⚔️ ${Math.round(st.dmg)} damage · 📏 ${st.r} range · ⏱ ${(1/st.rate).toFixed(1)}/s`:D.gold?`💰 +${st.gold} gold after each wave`:`✨ +${Math.round(st.buff*100)}% ${D.sup==='rate'?'speed':'damage'} for towers within ${GGT[T.t].r+5*(T.lvl-1)}`}</p>`;
    if(T.lvl<7)h+=`<div class="ggbtns"><button class="ggup" data-cost="${cost}" ${Z.gold<cost?'disabled':''} onclick="AG.cur&&ggUpgrade(AG.cur.st)"><span class="ic" style="background:#DBF4FF">⬆️</span><span>Level ${T.lvl+1} · 💰 ${cost}<small>${D.rate?`${Math.round(nx.dmg)} damage, ${nx.r} range.`:D.gold?`+${nx.gold} gold a wave.`:`+${Math.round(nx.buff*100)}% for nearby towers.`} Needs a right answer.</small></span></button></div>`;
    else h+=`<p class="sol" style="margin:6px 0 0">🌟 Level 7: fully upgraded!</p>`;
    h+=`<div class="ggbtns"><button onclick="AG.cur&&ggSell(AG.cur.st)"><span class="ic" style="background:#F1F5F9">💰</span><span>Sell<small>Get some gold back</small></span></button></div>`}
  el.innerHTML=h;gghud(Z)}

/* ---------- The menu ---------- */
const ggThumb=m=>kimg('ggth'+m.id,320,180,(x)=>{x.imageSmoothingEnabled=false;x.drawImage(ggBg(m),0,0,320,180)});
const ggIcon=t=>{const k='ic'+t;if(GGC[k])return GGC[k];const sp=ggTowerPx({t,lvl:3}),c=document.createElement('canvas');c.width=48;c.height=112;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(sp,0,0,48,112);return GGC[k]=c.toDataURL()};
GVIEW.gate=function(){const C=AG.cur&&AG.cur.id==='gate'?AG.cur:null;
  if(C&&['load','play','crash'].includes(C.phase)){setTimeout(()=>{if(AG.cur&&AG.cur.st&&AG.cur.id==='gate')ggpanel(AG.cur.st)},0);
    return AG.screen('gate',{side:`<div class="ggs"><div class="gghud" id="gghud" aria-live="polite"></div><div style="margin-top:8px;display:flex;gap:8px;align-items:center"><span class="sol">Speed</span><button class="chip" onclick="if(AG.cur){const Z=AG.cur.st;Z.speed=Z.speed===1?2:1;this.textContent=Z.speed+'×';this.setAttribute('aria-pressed',Z.speed===2)}" aria-pressed="false">1×</button></div></div><div class="ggs" id="ggpanel"></div>`})}
  const S=ggS(),m=ggCur(),mi=GGMAPS.indexOf(m),r=C&&C.phase==='end'?C.res:null,flag=ggFlag();let card='';
  if(r&&r.why==='won')card=`<div class="gcard endcard" style="margin-bottom:16px"><div class="big" aria-hidden="true">${r.king?'🤴':'🏰'}</div><h3>${r.king?'You defeated the Goblin King!':`Stage ${r.stage} cleared! The castle is safe!`}</h3><p>${stars3(r.stars)}<br>${r.cookies} of 10 cookies saved · ${r.goal?'🎯 Stage goal done':'Stage goal: '+esc(GGMAPS.find(x=>x.id===r.map).goal[1])} · 💎 +${r.gems} gem${r.gems>1?'s':''} · 🪙 +${r.coins} Gate coins</p>
    <p class="sol">Strategy bonus: ${r.bonus.perfect} perfect wave${r.bonus.perfect===1?'':'s'} · ${r.bonus.variety} kinds of tower · ${r.bonus.gold} gold left</p>${r.unlock?`<p><b>🔓 Stage ${r.unlockN} unlocked: ${esc(r.unlock)}!</b></p>`:''}</div>`;
  else if(r&&r.why==='lost')card=`<div class="gcard endcard" style="margin-bottom:16px"><div class="big" aria-hidden="true">🍪</div><h3>The goblins got the cookies!</h3><p>You held out for ${r.waves} wave${r.waves===1?'':'s'} (🪙 +${r.coins}). Level up your towers with right answers, and try new towers from a chest.</p></div>`;
  else if(r&&r.why==='time')card=`<div class="gcard" style="margin-bottom:16px"><h3>🌙 Play time is over for today</h3><p>${esc(earnNote())}</p></div>`;
  const L=GGLAST,rv=L?`<div class="ggreveal" style="--rc:${GRAR[L.rar][1]}"><img src="${ggIcon(L.t)}" alt=""><div><span class="sol" style="font-weight:800;color:${GRAR[L.rar][1]}">${L.lucky?'🍀 LUCKY ROLL · ':''}${GRAR[L.rar][0].toUpperCase()}</span><h3 style="margin:2px 0">${GGT[L.t].i} ${esc(GGT[L.t].n)}</h3><p style="margin:0">${esc(GGT[L.t].role)}</p>
    <p style="margin:6px 0 0"><b>${L.note==='new'?'✨ New tower!'+(S.load.includes(L.t)?' Added to your loadout.':''):L.note==='copy'?`Another copy: +5% power (★${S.cp[L.t]})`:'Already maxed: half your coins back'}</b></p></div><button class="abtn sec sm" style="margin-left:auto" onclick="GGLAST=null;rerealm()">OK</button></div>`:'';
  const own=new Set(S.own),pityLeft=Math.max(1,10-(S.pity||0));
  return `<div class="gworld">${clouds()}${gameHead('Goblin Gate',`Stage ${mi+1}: ${m.n}`)}${outOfTime()?restCard():''}${card}${rv}${subjChips()}
  <div class="gcard"><h3>🗺️ Stages</h3><div class="ggmaps">${GGMAPS.map((g,i)=>{const o=ggOpen(i),st=S.st[g.id]||0;return `<button class="ggmap ${g.id===m.id?'on':''}" ${o?'':'disabled'} aria-pressed="${g.id===m.id}" onclick="ARS('gate').map='${g.id}';SYNC();rerealm()"><span class="ggstage" aria-hidden="true">${i+1}</span><img src="${ggThumb(g).toDataURL()}" alt=""><b>${o?'':'🔒 '}Stage ${i+1}: ${esc(g.n)}</b><span class="sol">${g.waves} waves${g.king?' · 🤴 Final boss':''} · ${o?stars3(st):'Win stage '+i}</span><span class="sol">🎯 ${esc(g.goal[1])}</span></button>`}).join('')}</div></div>
  <div class="gcard" style="margin-top:14px"><div class="split"><h3>🛡️ Your towers (${S.own.length} of ${Object.keys(GGT).length})</h3><span class="sol">Loadout: ${S.load.length} of 5 · pick the towers you take into a stage</span></div>
    <div class="ggtw">${Object.entries(GGT).map(([k,D])=>{const o=own.has(k),inL=S.load.includes(k);return `<div class="c ${o?'':'lock'} ${inL?'in':''}" style="--rc:${GRAR[D.rar][1]}"><span class="rar">${GRAR[D.rar][0]}</span><img src="${ggIcon(k)}" alt=""><b>${o?esc(D.n):'???'}</b><small>${o?esc(D.role):'Find it in a chest'}</small><small>💰 ${D.cost}${o&&S.cp[k]?` · ${'★'.repeat(S.cp[k])}`:''}</small>${o?`<button class="chip ${inL?'on':''}" aria-pressed="${inL}" onclick="ggLoad('${k}')">${inL?'✓ In loadout':'Add to loadout'}</button>`:''}</div>`}).join('')}</div></div>
  <div class="gcard" style="margin-top:14px"><div class="split"><h3>🎁 Tower chests</h3><span style="font:800 1.1rem 'Bricolage Grotesque',sans-serif">🪙 ${S.coins||0} Gate coins</span></div>
    <div class="ggshop"><button ${(S.coins||0)<10?'disabled':''} onclick="ggRoll(false);rerealm()"><b>📦 Normal chest · 🪙 10</b><span class="sol">Common ${GGODDS.normal[0]}% · Rare ${GGODDS.normal[1]}% · Epic ${GGODDS.normal[2]}% · Legendary ${GGODDS.normal[3]}%</span><span class="sol">Epic or better guaranteed within ${pityLeft} chest${pityLeft===1?'':'s'}</span></button>
      <button class="lucky" ${(S.coins||0)<50?'disabled':''} onclick="ggRoll(true);rerealm()"><b>🍀 Lucky roll · 🪙 50</b><span class="sol">Extra luck! No Commons: Rare ${GGODDS.lucky[1]}% · Epic ${GGODDS.lucky[2]}% · Legendary ${GGODDS.lucky[3]}%</span></button></div>
    <p class="sol" style="margin:8px 0 0">Earn Gate coins by clearing waves (2 for a perfect wave), winning stages, beating the Goblin King, and with right answers in Goblin Gate (up to 20 a day). Coins can't be bought. A copy of a tower you have makes it 5% stronger (up to 5 copies).</p></div>
  <div class="gcard" style="margin-top:14px"><h3>🚩 Castle banner</h3><div class="ggflags">${Object.keys(GFLAG).map(f=>{const h=AG.has('gate.flag.'+f),it=AG.item('gate.flag.'+f);return `<button ${h?'':'disabled'} class="${f===flag?'on':''}" style="${GFLAG[f]==='rainbow'?'background:linear-gradient(135deg,#ff6b8a,#ffd34d,#5ff3a0,#5fb8ff)':'background:'+GFLAG[f]}" aria-pressed="${f===flag}" aria-label="${esc(it.n)}${h?'':': '+esc(it.how)}" title="${esc(it.n)}${h?'':': '+esc(it.how)}" onclick="ARS('gate').flag='${f}';SYNC();rerealm()"></button>`}).join('')}</div></div>
  <div style="margin-top:14px">${AG.intro('gate','AG.play(\'gate\')')}</div></div>`};
</script>
