    <p class="sol">Strategy bonus: ${r.bonus.perfect} perfect wave${r.bonus.perfect===1?'':'s'} · ${r.bonus.variety} kinds of tower · ${r.bonus.gold} gold left</p>${r.unlock?`<p><b>🔓 Stage ${r.unlockN} unlocked: ${esc(r.unlock)}!</b></p>`:''}</div>`;
  else if(r&&r.why==='lost')card=`<div class="gcard endcard" style="margin-bottom:16px"><div class="big" aria-hidden="true">🍪</div><h3>The goblins got the cookies!</h3><p>You held out for ${r.waves} wave${r.waves===1?'':'s'} (🪙 +${r.coins}). Level up your towers with right answers, and try new towers from a chest.</p></div>`;
  else if(r&&r.why==='time')card=`<div class="gcard" style="margin-bottom:16px"><h3>🌙 Play time is over for today</h3><p>${esc(earnNote())}</p></div>`;
  const rv=ggRevealCard(S);
  const cust=m.custom?`<div class="gcard" style="margin-bottom:14px;border:3px solid #22C55E"><div class="split"><h3 style="margin:0">🛠️ Ready to play: ${esc(m.n)}${m.cls?` <span class="sol">by ${esc(m.cls.by)}</span>`:''}</h3><button class="abtn sec sm" onclick="GGPLAY=null;rerealm()">← Back to the stages</button></div><p class="sol" style="margin:4px 0 0">${GGTHI[m.th]} ${esc(GGTHN[m.th])} · ${m.waves} waves · ${GGDIFF[m.d][0]} · ${m.king?'🤴 Goblin King':'👑 Goblin boss'} at the end. Press Start defending below.</p></div>`:'';
  return `<div class="gworld">${clouds()}${gameHead('Goblin Gate',m.custom?`Made map: ${esc(m.n)}`:`Stage ${mi+1}: ${m.n}`)}${outOfTime()?restCard():''}${card}${rv}${cust}${subjChips()}
  <div class="gcard"><h3>🗺️ Stages</h3><div class="ggmaps">${GGMAPS.map((g,i)=>{const o=ggOpen(i),st=S.st[g.id]||0;return `<button class="ggmap ${g.id===m.id&&!m.custom?'on':''}" ${o?'':'disabled'} aria-pressed="${g.id===m.id}" onclick="GGPLAY=null;ARS('gate').map='${g.id}';SYNC();rerealm()"><span class="ggstage" aria-hidden="true">${i+1}</span><img src="${ggThumb(g).toDataURL()}" alt=""><b>${o?'':'🔒 '}Stage ${i+1}: ${esc(g.n)}</b><span class="sol">${g.waves} waves${g.king?' · 🤴 Final boss':''} · ${o?stars3(st):'Win stage '+i}</span><span class="sol">🎯 ${esc(g.goal[1])}</span></button>`}).join('')}</div></div>
  ${ggMakerCard()}${ggClassCard()}
  ${ggTowersCard(S)}${ggChestCard(S)}
  <div class="gcard" style="margin-top:14px"><h3>🚩 Castle banner</h3><div class="ggflags">${Object.keys(GFLAG).map(f=>{const h=AG.has('gate.flag.'+f),it=AG.item('gate.flag.'+f);return `<button ${h?'':'disabled'} class="${f===flag?'on':''}" style="${GFLAG[f]==='rainbow'?'background:linear-gradient(135deg,#ff6b8a,#ffd34d,#5ff3a0,#5fb8ff)':'background:'+GFLAG[f]}" aria-pressed="${f===flag}" aria-label="${esc(it.n)}${h?'':': '+esc(it.how)}" title="${esc(it.n)}${h?'':': '+esc(it.how)}" onclick="ARS('gate').flag='${f}';SYNC();rerealm()"></button>`}).join('')}</div></div>
  <div style="margin-top:14px">${AG.intro('gate','AG.play(\'gate\')')}</div></div>`};
</script>
