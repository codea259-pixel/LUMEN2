<style>
/* ===== Bose Academy design layer: calm base, subject colors used sparingly ===== */
:root{--bg:#F6F8FB;--panel:#fff;--ink:#16243A;--mute:#5A6A80;--line:#E2E8F0;--node:#E3E8EF;--lamp:#F2A900;--lamp-soft:#FDF3D1;--teal:#0F8B8D;--coral:#C8414F;

--shadow:0 1px 2px rgba(22,36,58,.06),0 4px 16px rgba(22,36,58,.06);--shadow-up:0 2px 4px rgba(22,36,58,.08),0 10px 28px rgba(22,36,58,.10);--r:18px;--fs:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1726;--panel:#18233A;--ink:#EAF0F8;--mute:#A0B1CA;--line:#2B3A57;--node:#2E3D5A;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-up:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0F1726;--panel:#18233A;--ink:#EAF0F8;--mute:#A0B1CA;--line:#2B3A57;--node:#2E3D5A}
[data-subj=math]{--sc:#F2A900;--sc-on:#16243A;--sc-text:#8A6100}
[data-subj=ela]{--sc:#2563EB;--sc-on:#fff;--sc-text:#1D4ED8}
[data-subj=sci]{--sc:#059669;--sc-on:#fff;--sc-text:#047857}
[data-subj=soc]{--sc:#7C3AED;--sc-on:#fff;--sc-text:#6D28D9}
[data-subj=cs]{--sc:#C2410C;--sc-on:#fff;--sc-text:#C2410C}
[data-subj=fin]{--sc:#0F766E;--sc-on:#fff;--sc-text:#0F766E}
[data-subj=es]{--sc:#C93545;--sc-on:#fff;--sc-text:#BE123C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-subj],:root:not([data-theme="light"])[data-subj]{--sc-text:color-mix(in srgb,var(--sc) 55%,#fff)}}
html{font-size:calc(100% * var(--fs))}
body{background:var(--bg);font-size:1.0625rem}
[data-font=easy] body,[data-font=easy] h1,[data-font=easy] h2,[data-font=easy] h3,[data-font=easy] h4,[data-font=easy] .q,[data-font=easy] button,[data-font=easy] input,[data-font=easy] select{font-family:"Lexend","Atkinson Hyperlegible",system-ui,sans-serif!important;letter-spacing:.01em;word-spacing:.06em}
[data-contrast=high]{--bg:#fff;--panel:#fff;--ink:#000;--mute:#1F2937;--line:#111827;--node:#D1D5DB}
[data-contrast=high] .card,[data-contrast=high] .mission,[data-contrast=high] .stat{border:2px solid #000!important;box-shadow:none!important}
[data-motion=reduce] *{transition:none!important;animation:none!important}

/* Top bar */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0}

.menu button:hover,.menu button:focus-visible{background:var(--bg)}

.brand{white-space:nowrap}

/* Cards, buttons, micro-interactions */
.card{border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);transition:box-shadow .2s,transform .2s}

.bar i{background:var(--sc)}
.bar{background:color-mix(in srgb,var(--line) 80%,transparent)}
.pill{background:var(--sc-soft);color:var(--sc-text)}

.rise{animation:rise .35s ease both}

/* Welcome and stats */
#dash{max-width:1180px;margin:0 auto;padding:20px 24px 0}

svg.orb{display:inline-block;vertical-align:middle;flex:none}

.hello p{margin:2px 0 0;color:var(--mute)}
.stats3{display:flex;gap:10px;flex-wrap:wrap}

.stat b{display:block;font:800 1.25rem "Bricolage Grotesque",sans-serif}.stat span{font-size:.8rem;color:var(--mute)}

/* Today's mission */
.mission{position:relative;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:linear-gradient(135deg,var(--sc-soft),var(--panel) 70%);border:1px solid color-mix(in srgb,var(--sc) 35%,var(--line));border-radius:24px;padding:26px 28px;box-shadow:var(--shadow);overflow:hidden}
.mission .lbl{font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sc-text)}
.mission h2{font-size:clamp(1.6rem,3.6vw,2.3rem);margin:6px 0 4px;letter-spacing:-.02em}
.mission p.d{margin:0 0 14px;color:var(--mute);max-width:56ch}
.mission .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--mute);margin:6px 0 16px}

.filters select{font-weight:700;padding:8px 12px;border-radius:12px;background:var(--panel)}
.filters details{font-size:.92rem}.filters summary{cursor:pointer;color:var(--mute);padding:8px 4px}

.filters .gb{padding-top:6px}
.app{padding-top:12px}
.app .card h2{display:flex;align-items:center;gap:8px}

.legend span:before{display:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:18px;height:18px}

/* Skill info panel */
.lv5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0 4px}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:.875rem;padding:6px 10px;border-radius:99px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin-top:12px}.kv span{color:var(--mute)}
.info h3{font-size:1rem;margin-top:16px}

/* Practice */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qhead .qn{font-weight:800;color:var(--sc-text)}
.tutor{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sc);border-radius:14px;display:flex;gap:12px;align-items:flex-start}
.tutor .tx{flex:1}.tutor .tx b{display:inline}.tutor .tx>b:first-child{display:block;font-size:.85rem}.tutor svg.orb{flex:none;width:34px;height:34px}
.tutor.good{border-left-color:var(--teal)}.tutor.warn{border-left-color:var(--coral)}
.xp{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:99px;background:var(--lamp-soft);color:#7A5600;font-weight:800;font-size:.85rem;animation:rise .3s ease both}
.helpbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.helpbar button{font-size:.92rem;padding:9px 14px}
.chat{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.chat .m{margin:6px 0;padding:8px 12px;border-radius:12px;max-width:90%;font-size:.95rem}
.chat .m.you{background:var(--panel);margin-left:auto;border:1px solid var(--line)}
.chat .m.lumen{background:var(--sc-soft)}
.chat form{display:flex;gap:8px;margin-top:8px}.chat input{flex:1;font-size:1rem!important;width:auto!important}
.mic[aria-pressed=true]{background:var(--coral);color:#fff}

/* Celebration */
.celebrate{position:relative;text-align:center;padding:10px 0 4px;overflow:hidden}
.celebrate h2{font-size:1.8rem;margin:6px 0}
.spark{position:absolute;width:8px;height:8px;border-radius:2px;top:40%;left:50%;opacity:0;animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(200deg)}}
@media(prefers-reduced-motion:reduce){.spark{display:none}}
.views{padding-top:20px}
.set{display:grid;gap:14px;max-width:640px}
.set label.sw{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.set label.sw span small{display:block;color:var(--mute);font-size:.85rem}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--teal)}
</style>
<script type="text/x-lumen">

/* ---------- Points, streak, mastery ---------- */
const XP=()=>BOOT.state.xp||0;
function addXP(n,why){BOOT.state.xp=XP()+n;if(cur)cur.xp=(cur.xp||0)+n;renderMe();SYNC();return `<span class="xp" aria-label="${n} points${why?' for '+why:''}">+${n} XP</span>`}

  <label class="sw"><span>Easier-reading font<small>Wider letters and spacing (Lexend), which many readers with dyslexia find easier.</small></span><input type="checkbox" ${a.font?'checked':''} onchange="setA('font',this.checked)"></label>
  <label class="sw"><span>High contrast<small>Stronger borders and black text.</small></span><input type="checkbox" ${a.contrast?'checked':''} onchange="setA('contrast',this.checked)"></label>
  <label class="sw"><span>Reduce motion<small>Turn off animations and particles.</small></span><input type="checkbox" ${a.motion?'checked':''} onchange="setA('motion',this.checked)"></label>
  <label class="sw"><span>Lite mode<small>For slow connections: no web fonts, glow or animation.</small></span><input type="checkbox" ${ST.lite?'checked':''} onchange="setLite(this.checked)"></label>

applyA11y();nav();gradeBar();go(tab);
