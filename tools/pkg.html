<style>
/* ===== The implementation package: Streak Lamp, mastery stars, Build-a-Bridge view, Lumi Challenge hint token, standards tags ===== */
.lampbox{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:inherit;flex:none}

<script type="text/x-lumen">
/* ===== The implementation package (Part 2 and Week 2/4 items) =====
   Streak Lamp: one problem done in a day lights the lamp a step brighter; a missed day dims it one step, and it never goes fully
   out once you have history. Mastery stars: 1 to 3 stars on each map skill (Familiar, Proficient, Mastered). Build-a-Bridge: a view
   of the knowledge map where skills are islands and a finished building block builds the bridge. Lumi Challenge: one free hint
   token and a Thinking Score. California standards tags on the math skills. ===== */
const CASTD={kadd:'K.OA.A.2',ksub:'K.OA.A.2',kbond:'K.OA.A.4',kcount:'K.CC.A.2',
  g1add:'1.OA.C.6',g1sub:'1.OA.C.6',g1tens:'1.NBT.B.2',g1skip:'2.NBT.A.2',g2add:'2.NBT.B.5',g2sub:'2.NBT.B.5',g2coins:'2.MD.C.8',g2place:'2.NBT.A.1',
  mult:'3.OA.C.7',g3div:'3.OA.C.7',g3x10:'3.NBT.A.3',g3round:'3.NBT.A.1',g3area:'3.MD.C.7.b',g3perim:'3.MD.D.8',
  equiv:'4.NF.A.1',simplify:'4.NF.A.1',addlike:'4.NF.B.3.a',g4add:'4.NBT.B.4',g4mult:'4.NBT.B.5',g4div:'4.NBT.B.6',g4comp:'4.MD.C.7',factors:'6.NS.B.4',g4lcm:'6.NS.B.4',
  adduni:'5.NF.A.1',multfrac:'5.NF.B.4',g5fdiv:'5.NF.B.7.b',g5decadd:'5.NBT.B.7',g5decmul:'5.NBT.B.7',g5pow10:'5.NBT.A.2',g5ooo:'5.OA.A.1',g5vol:'5.MD.C.5.b',
  g6ratio1:'6.RP.A.1',g6ratio2:'6.RP.A.3.a',g6ratio3:'6.RP.A.3.a',g6rate1:'6.RP.A.3.b',g6rate2:'6.RP.A.3.b',g6pctdec:'6.RP.A.3.c',g6pctfrac:'6.RP.A.3.c',g6pctwhole:'6.RP.A.3.c',percent:'6.RP.A.3.c',
  g6fdiv:'6.NS.A.1',g6fwhole:'6.NS.A.1',g6decdiv:'6.NS.B.3',g6decsub:'6.NS.B.3',g6abs:'6.NS.C.7.c',g6dist:'6.NS.C.8',g6exp:'6.EE.A.1',g6eval:'6.EE.A.2.c',g6ooo:'6.EE.A.2.c',g6like:'6.EE.A.3',
  g6ineq:'6.EE.B.5',onestepadd:'6.EE.B.7',onestepmul:'6.EE.B.7',g6tri:'6.G.A.1',g6para:'6.G.A.1',g6trap:'6.G.A.1',g6box:'6.G.A.4',g6cube:'6.G.A.4',g6mean:'6.SP.B.5.c',g6median:'6.SP.B.5.c',g6mode:'6.SP.B.5.c',g6range:'6.SP.B.5.c',
  g6negadd:'7.NS.A.1',g7negmul:'7.NS.A.2',g7prop:'7.RP.A.2.b',g7pctchg:'7.RP.A.3',g7tip:'7.RP.A.3',g7dist:'7.EE.A.1',twostep:'7.EE.B.4.a',g7circ:'7.G.B.4',g7circa:'7.G.B.4',g7supp:'7.G.B.5',g7prob:'7.SP.C.7.a',
  g7tri:'8.G.A.5',g8exp:'8.EE.A.1',g8sqrt:'8.EE.A.2',g8cbrt:'8.EE.A.2',g8sci:'8.EE.A.3',g8sys:'8.EE.C.8.b',g8lin:'8.F.A.1',slope:'8.F.B.4',g8pyth:'8.G.B.7',g8cyl:'8.G.C.9',g10dist:'8.G.B.8',
  lineq:'HSA-REI.B.3',g9ineq:'HSA-REI.B.3',g9disc:'HSA-REI.B.4.b',g9foil:'HSA-APR.A.1',g9arith:'HSF-BF.A.2',g9geom:'HSF-BF.A.2',g9exp:'HSF-LE.A.2',quadeval:'HSF-IF.A.2',
  g10mid:'HSG-GPE.B.6',g10sim:'HSG-SRT.B.5',g10sin:'HSG-SRT.C.6',g10arc:'HSG-C.B.5',g10sph:'HSG-GMD.A.3',
  logs:'HSF-LE.A.4',g11expeq:'HSF-LE.A.4',g11logp:'HSF-BF.B.5',g11geoser:'HSA-SSE.B.4',g11rem:'HSA-APR.B.2',g11rad:'HSF-TF.A.1',g11comb:'HSS-CP.B.9',g11perm:'HSS-CP.B.9',
  g12vert:'HSF-IF.C.8.a',g13ci:'HSA-SSE.B.3.c',g13ev:'HSS-MD.A.2'};
const LAMPMAX=7;
function lampLevel(){const days=[...new Set(ST.days||[])].sort();if(!days.length)return 0;const on=new Set(days),t=today();let lv=0;
  for(let d=new Date(days[0]+'T12:00:00');;d.setDate(d.getDate()+1)){const k=d.toISOString().slice(0,10);if(k>t)break;
    if(on.has(k))lv=Math.min(LAMPMAX,lv+1);else if(k<t)lv=Math.max(1,lv-1)}return lv}
function lampSvg(lv){const f=lv/LAMPMAX,glow=.15+.85*f,lit=lv>0;
  return `<svg viewBox="0 0 58 70" role="img" aria-label="Streak Lamp, brightness ${lv} of ${LAMPMAX}"><defs><radialGradient id="lampg" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#FFF6C8" stop-opacity="${glow}"/><stop offset="1" stop-color="#FFD34D" stop-opacity="0"/></radialGradient></defs>
    ${lit?`<circle cx="29" cy="30" r="${16+12*f}" fill="url(#lampg)"/>`:''}<path d="M22 12h14l-2-6h-10z" fill="#B07B00"/><path d="M19 14h20l4 26h-28z" fill="${lit?`rgba(255,${200+Math.round(40*f)},${80+Math.round(60*f)},${.35+.6*f})`:'rgba(200,200,215,.35)'}" stroke="#B07B00" stroke-width="2"/>
    ${lit?`<path d="M29 22c4 5 4 9 0 12c-4-3-4-7 0-12z" fill="#FF9F1C" opacity="${.5+.5*f}"/><path d="M29 26c2 3 2 5 0 7c-2-2-2-4 0-7z" fill="#FFF3B0"/>`:''}
    <rect x="15" y="40" width="28" height="5" rx="2" fill="#B07B00"/><path d="M20 45h18l3 14h-24z" fill="#8A5A00"/><rect x="14" y="59" width="30" height="5" rx="2" fill="#6B4500"/></svg>`}
function lampBox(){const lv=lampLevel(),s=streak(),did=(ST.days||[]).includes(today());
  const msg=!lv?'Answer one problem today to light your lamp.':did?(lv>=LAMPMAX?'Shining as bright as it gets!':'Lit for today. Come back tomorrow to make it brighter.'):'Answer one problem today, or it dims a step.';
  return `<div class="lampbox" title="Streak Lamp: each day you answer a problem it glows brighter; a missed day dims it one step."><span>${lampSvg(lv)}</span><div><b>Streak Lamp · ${s} day${s===1?'':'s'}</b><small>${msg}</small></div></div>`}
const _rPk=render;render=function(){_rPk();const h=document.querySelector('#dash .hello');if(h&&!h.querySelector('.lampbox'))h.insertAdjacentHTML('beforeend',lampBox());
  const lg=$('legend');if(lg&&!lg.querySelector('.bridgebtn')&&document.querySelector('#map')){lg.insertAdjacentHTML('beforeend',`<button class="chip bridgebtn ${ST.bridge?'on':''}" aria-pressed="${!!ST.bridge}" onclick="ST.bridge=!ST.bridge;sv();render()">🌉 Bridge view</button>`)}};

/* mastery stars on each skill of the map */
const starsOf=k=>{const lv=level(k);return lv>=4?3:lv>=3?2:lv>=2?1:0};
const _nsPk=nodeSvg;nodeSvg=function(k,x,y,rec){let s=_nsPk(k,x,y,rec);const n=starsOf(k);
  if(n){const i=s.lastIndexOf('</g>');s=s.slice(0,i)+`<g class="stars" aria-hidden="true"><text x="${x}" y="${y-28}" text-anchor="middle">${'★'.repeat(n)}${'☆'.repeat(3-n)}</text></g>`+s.slice(i)}
  return s.replace(/aria-label="([^"]*)"/,(m,a)=>`aria-label="${a}, ${n} of 3 stars${CASTD[k]?', California standard '+CASTD[k]:''}"`)};

/* Build-a-Bridge: islands and bridges over the same map */
const _dmPk=drawMap;drawMap=function(){_dmPk();const el=$('map');if(!el)return;const wrap=el.closest('.card')||el.parentNode;
  document.body.classList.toggle('bridgeview',!!ST.bridge);if(!ST.bridge)return;const NS='http://www.w3.org/2000/svg';
  el.querySelectorAll('.edge.on').forEach(p=>{const r=p.cloneNode();r.setAttribute('class','edge rail');p.parentNode.insertBefore(r,p)});
  el.querySelectorAll('.node').forEach(g=>{const c=g.querySelector('circle.n');if(!c)return;const x=c.getAttribute('cx'),y=c.getAttribute('cy'),is=document.createElementNS(NS,'g');
    is.innerHTML=`<ellipse cx="${x}" cy="${+y+6}" rx="40" ry="30" fill="#E9D59A"/><ellipse cx="${x}" cy="${+y+3}" rx="33" ry="24" fill="#7CCB6B"/>`;g.insertBefore(is,g.firstChild)});
  if(!$('bridgenote'))wrap.insertAdjacentHTML('beforeend','<p class="sol" id="bridgenote">🌉 Each skill is an island. Finish a building block and its bridge gets built.</p>')};

/* Lumi Challenge: one free hint token, and a Thinking Score (a right answer with the hint counts half) */
function useToken(){const Z=QZ;if(!Z||Z.kind!=='challenge'||Z.token||Z.done)return;Z.token=1;Z.tokenAt=Z.n;render()}
const _qhPk=quizHtml;quizHtml=function(){const Z=QZ;let h=_qhPk();if(!Z||Z.kind!=='challenge'||Z.finished)return h;
  const hintNow=Z.token&&Z.tokenAt===Z.n&&!Z.done&&Z.q&&Z.q.h,btn=!Z.token&&!Z.done?`<button class="alt tokenbtn" onclick="useToken()">🪙 Use your free hint token</button>`:'';
  const tip=hintNow?tutor(Z.q.h[0],'',"🪙 Lumi's hint token"):'';const k='<div class="row">';const i=h.lastIndexOf(k);return i<0?h+tip+btn:h.slice(0,i)+tip+(btn?`<div>${btn}</div>`:'')+h.slice(i)};
const _acPk=answerChallenge;answerChallenge=function(ok){const Z=QZ,n=Z.n;_acPk(ok);const r=Z.log[Z.log.length-1];if(r)r.h=Z.token&&Z.tokenAt===n}
const thinkScore=Z=>Math.round(100*Z.log.reduce((a,r)=>a+(r.ok?(r.h?.5:1):0),0)/Math.max(1,Z.total));
const _cdPk=challengeDone;challengeDone=function(){const Z=QZ,t=thinkScore(Z),h=_cdPk();
  return h.replace('</div>',`</div><div class="tutor good">${orb(34,'wow')}<div class="tx"><b>Thinking Score: ${t} / 100</b>It counts how well you thought, not how fast: each right answer counts fully, and one helped by the hint token counts half.${Z.token?'':' You solved it all without your hint token!'}</div></div>`)};

/* California standards (Common Core State Standards for Mathematics, adopted by California) on the math skills */

const stdTag=k=>CASTD[k]?`<span class="stdtag" title="California Common Core State Standards for Mathematics">CA CCSS ${CASTD[k]}</span>`:'';
const _rStd=render;render=function(){_rStd();if(view!=='lesson'||!sel||!CASTD[sel])return;const P=$('panel');if(!P||P.querySelector('.stdtag'))return;const h=P.querySelector('h2,h3');if(h)h.insertAdjacentHTML('afterend',`<div>${stdTag(sel)}</div>`)};

/* Basic analytics: skills mastered this week (each skill remembers the day it was mastered) */
const masteredWeek=()=>{const w=new Date();w.setDate(w.getDate()-6);const from=w.toISOString().slice(0,10);return ORDER.filter(k=>S[k].mastered&&S[k].mAt&&S[k].mAt>=from).length};
const _rMw=render;render=function(){let ch=0;ORDER.forEach(k=>{if(S[k]&&S[k].mastered&&!S[k].mAt){S[k].mAt=today();ch=1}});if(ch)sv();_rMw();
  const st=document.querySelector('#dash .stats3');if(st&&!st.querySelector('.mweek'))st.insertAdjacentHTML('beforeend',`<div class="stat mweek"><b>🏅 ${masteredWeek()}</b><span>mastered this week</span></div>`)};

/* Owner: daily Lumi AI tutor use (operations: daily usage monitoring) */
let OUSE=null;
const _ofPk=O.flags;O.flags=function(){if(OUSE===null){OUSE=[];if(!BOOT.fb&&!BOOT.local)api('GET','/api/owner/usage').then(r=>{OUSE=r.days||[];r2()}).catch(()=>{})}
  const tot=OUSE.slice(0,7).reduce((a,d)=>a+d.n,0);
  return _ofPk()+`<h3 style="margin-top:18px">Lumi AI tutor use</h3><p class="sol">Each learner can send Lumi up to 30 messages a day. ${BOOT.fb?'On this site Lumi uses its built-in guiding questions, so no AI messages are sent.':OUSE.length?`Last 7 days: <b>${tot}</b> messages.`:'No AI messages yet.'}</p>
  ${OUSE.length?`<div class="tbl"><table class="vs"><tr><th>Day</th><th>Messages</th></tr>${OUSE.map(d=>`<tr><td>${esc(d.day)}</td><td>${d.n}</td></tr>`).join('')}</table></div>`:''}`};

/* Co-op Class Quest: learners see their class's shared goal, never a ranking */
const questCard=c=>{const q=c.quest;if(!q)return '';const u=q.kind==='stars'?'mastery stars':'gems',pc=Math.min(100,q.have/q.goal*100);
  return `<div class="card" style="margin-top:14px"><div class="split"><h3>🤝 ${esc(c.name)}: Class Quest</h3><span class="sol">Together</span></div><p style="margin:4px 0 8px">Collect <b>${q.goal} ${u}</b> as a class. Reward: <b>${esc(q.reward)}</b></p>
    <div class="bar"><i style="width:${pc}%"></i></div><p class="sol">${q.have} of ${q.goal} ${u}${q.have>=q.goal?' · Quest complete! 🎉':''}. ${q.kind==='stars'?'Every skill you move up a level adds stars for the whole class.':''}</p></div>`};
const _vcQ=VIEWS.classes;VIEWS.classes=function(){const h=_vcQ(),b=(ST.joined||[]).map(questCard).join('');if(!b)return h;const k='Your teacher gives you the code.</p></div>';return h.includes(k)?h.replace(k,k+b):h+b};

/* Story Mode: "A storm scrambled the Knowledge Map. Every skill you master repairs it." Each grade is a region of the map */
const STORYB=['A storm swept over the Knowledge Map and scrambled every region. Lumi needs your help to repair it, one skill at a time.','The first sunlight breaks through! Every skill you bring to Proficient clears the clouds above it.','Whole regions are shining again. The building blocks you mastered hold the bridges together.','The map is almost whole. A few stubborn clouds remain at the edges.','The storm has passed. The Knowledge Map shines brighter than ever, thanks to you.'];
function storyCard(){const ks=ORDER.filter(k=>SK[k].sub===ST.subj&&(ST.grades.includes('all')||inBand(k)));if(!ks.length)return '';
  const ok=k=>level(k)>=3,f=ks.filter(ok).length/ks.length,gs=[...new Set(ks.map(k=>ST.gr[k]))].sort((a,b)=>a-b);
  const beat=STORYB[f>=1?4:f>=.75?3:f>=.4?2:f>0?1:0];
  return `<div class="storycard" id="storycard"><h3>⛈️ Restore the Knowledge Map · ${Math.round(f*100)}% repaired</h3><p>${beat}</p><div class="regs">${gs.map(g=>{const r=ks.filter(k=>ST.gr[k]==g),d=r.filter(ok).length;return `<span class="${d===r.length?'ok':''}">${GLAB(g)} region ${d}/${r.length}</span>`}).join('')}</div></div>`}
const _dmSt=drawMap;drawMap=function(){_dmSt();const el=$('map');if(!el)return;document.body.classList.toggle('storyview',!!ST.story);const old=$('storycard');if(old)old.remove();if(!ST.story)return;
  el.querySelectorAll('.node').forEach(g=>{const l=g.getAttribute('aria-label')||'';if(!/Proficient|Mastered/i.test(l))g.classList.add('stormy')});
  const w=el.closest('.mapwrap')||el;w.insertAdjacentHTML('beforebegin',storyCard())};
const _rSt=render;render=function(){_rSt();const lg=$('legend');if(lg&&!lg.querySelector('.storybtn')&&$('map'))lg.insertAdjacentHTML('beforeend',`<button class="chip storybtn ${ST.story?'on':''}" aria-pressed="${!!ST.story}" onclick="ST.story=!ST.story;sv();render()">⛈️ Story mode</button>`)};

/* Owner console → Backup: one click saves the whole database to a file on this computer */
function ownerBackup(){busy(async()=>{const r=await api('GET','/api/owner/backup'),txt=JSON.stringify(r,null,1),d=new Date().toISOString().slice(0,10);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=`bose-academy-backup-${d}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  const n=r.data?Object.values(r.data).reduce((t,v)=>t+(Array.isArray(v)?v.length:v?1:0),0):0;ST.lastBackup=d;sv();msg(`Backup saved: ${n} records (${Math.round(txt.length/1024)} KB). Keep it somewhere safe.`);r2()})}
O.backup=function(){const L=ST.lastBackup,days=L?Math.floor((Date.now()-new Date(L+'T12:00:00'))/864e5):null;
  return `<div class="card"><h3>💾 Download a backup</h3><p class="sol">Saves everything in the database (accounts, progress, classes, assignments, tests, posts, certificates and settings) as one file on this computer. Sign-in passwords aren't included: they're kept separately by the sign-in system.</p>
    <p><b>${L?`Last backup: ${esc(L)}${days>7?` · ${days} days ago, time for a new one`:days===0?' · today':` · ${days} day${days===1?'':'s'} ago`}`:'No backup downloaded from this account yet.'}</b></p>
    <div class="row"><button class="lamp" onclick="ownerBackup()">💾 Download a backup</button></div>
    <p class="sol" style="margin-top:12px">Do this once a week. Keep at least the last four files, in a private folder or a password-protected drive, because they contain students' information. Delete old files you no longer need.</p></div>`};
const _ovB=VIEWS.owner;VIEWS.owner=function(){const h=_ovB(),k='</div><div style="margin-top:16px">';return h.replace(k,`<button class="chip ${ST.ot==='backup'?'on':''}" onclick="ST.ot='backup';r2()">💾 Backup</button>`+k)};

/* Students who aren't in a class yet see a "join your class" box on the Learn page */
let JOINLOAD=0;
const _lcJ=LOAD.classes;LOAD.classes=async(...a)=>{const r=await _lcJ(...a);if(ME.role==='student'&&view==='home'&&!$('djoin'))setTimeout(()=>{if(view==='home')render()},0);return r};
function joinFromDash(){const v=($('djc')||{}).value||'';if(!v.trim())return msg('Type the class code from your teacher.');busy(async()=>{const r=await api('POST','/api/classes/join',{code:v.trim()});msg('You joined '+r.name+'!');try{await LOAD.classes()}catch(e){}render()})}
const _rJn=render;render=function(){_rJn();if(BOOT.local||ME.role!=='student')return;
  if(ST.joined===undefined){if(!JOINLOAD&&LOAD.classes){JOINLOAD=1;LOAD.classes().then(()=>render()).catch(()=>{JOINLOAD=0})}return}
  if(view!=='home')return;const d=$('dash');if(!d||d.hidden||$('djoin'))return;
  if(ST.joined.length)return;const h=d.querySelector('.hello');if(!h)return;
  h.insertAdjacentHTML('afterend',`<div class="card rise" id="djoin" style="margin:0 0 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px"><h3 style="margin:0 0 4px">🏫 Join your class</h3><p class="sol" style="margin:0">Enter the class code your teacher gave you to see your assignments and your class.</p></div><div class="row" style="margin:0"><input id="djc" placeholder="Class code" aria-label="Class code" maxlength="8" style="text-transform:uppercase;width:150px" onkeydown="if(event.key==='Enter')joinFromDash()"><button class="lamp" onclick="joinFromDash()">Join</button></div></div>`)};
</script>
