<style>

.nl{--acc:#22D3EE;--bg2:#0B1020;--card:#121A2E;--card2:#18223A;--ln:rgba(148,163,184,.2);--tx:#E2E8F0;--mt:#94A3B8;--good:#22C55E;--bad:#F43F5E;

  background-color:#0B1020;border:1px solid var(--ln)}
.nl::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(180deg,#000,transparent 70%)}

.nlhb{display:flex;gap:14px;align-items:center}@media(max-width:560px){.nlhb{flex-direction:column;align-items:flex-start;gap:10px}}

.nltile .nlb{display:block;padding:12px 14px 14px}.nltile .nlname{font:800 1.15rem "Bricolage Grotesque",sans-serif;display:block;color:var(--tx);margin:2px 0}.nltile .tag{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}

.nlprof .ban.bn-aurora{background:linear-gradient(120deg,#22D3EE,#A78BFA 50%,#F472B6)}
.nlprof .ban.bn-circuit{background:#0F172A repeating-linear-gradient(90deg,transparent 0 22px,color-mix(in srgb,var(--acc) 55%,transparent) 22px 24px),repeating-linear-gradient(0deg,transparent 0 22px,color-mix(in srgb,var(--acc) 35%,transparent) 22px 24px)}
.nlprof .ban.bn-nebula{background:radial-gradient(circle at 20% 40%,#F472B6 0,transparent 40%),radial-gradient(circle at 75% 60%,#60A5FA 0,transparent 45%),#1E1B4B}

.nlprof .av.fr-neon{box-shadow:0 0 0 3px #0B1020,0 0 16px 4px var(--acc)}
.nlprof .av.fr-prism{border-image:linear-gradient(45deg,#22D3EE,#A78BFA,#F472B6,#FBBF24) 1;border-radius:0}
.nlprof .av.fr-laurel{border-color:#FBBF24;box-shadow:0 0 0 4px rgba(251,191,36,.25)}
.nlprof .ttl{color:var(--acc);font-weight:800;font-size:.85rem}
.nlxp{height:8px;border-radius:99px;background:rgba(148,163,184,.18);overflow:hidden;margin:6px 0 2px}.nlxp i{display:block;height:100%;background:var(--acc)}
.nlstat{display:grid;grid-template-columns:118px 1fr 48px;gap:8px;align-items:center;font-size:.88rem;margin:5px 0}
.nlstat .bar{height:7px;border-radius:99px;background:rgba(148,163,184,.18);overflow:hidden}.nlstat .bar i{display:block;height:100%;background:var(--acc)}
.nlchips{display:flex;gap:6px;flex-wrap:wrap}
.nlchip{border:1px solid var(--ln);background:var(--card2);color:var(--tx);border-radius:99px;padding:5px 11px;font:700 .82rem "Atkinson Hyperlegible",sans-serif;cursor:pointer}
.nlchip.on{border-color:var(--acc);color:var(--acc)}.nlchip[disabled]{opacity:.45;cursor:default}
.nlsw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}.nlsw.on{border-color:#fff;box-shadow:0 0 0 2px #0B1020}
/* Word and equation grids */
.pzwrap{display:grid;justify-items:center;gap:14px}
.pzgrid{display:grid;gap:6px}
.pzrow{display:grid;gap:6px}
.pzc{width:var(--s,54px);height:var(--s,54px);display:grid;place-items:center;border:2px solid #334155;border-radius:10px;font:800 1.5rem "Bricolage Grotesque",sans-serif;text-transform:uppercase;color:var(--tx);background:#0F172A}
.pzc.f{border-color:#64748B}
.pzc.g{background:#16A34A;border-color:#16A34A;color:#fff}.pzc.y{background:#CA8A04;border-color:#CA8A04;color:#fff}.pzc.n{background:#334155;border-color:#334155;color:#CBD5E1}
.pzc.flip{animation:pzflip .45s ease both}@keyframes pzflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.pzshake{animation:pzshake .35s}@keyframes pzshake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pzkb{display:grid;gap:6px;width:min(560px,100%)}
.pzkr{display:flex;gap:5px;justify-content:center}
.pzk{flex:1;max-width:46px;min-height:52px;border-radius:9px;border:0;background:#475569;color:#fff;font:800 1rem "Atkinson Hyperlegible",sans-serif;cursor:pointer;text-transform:uppercase}
.pzk.wide{max-width:76px;flex:1.5;font-size:.8rem}.pzk.g{background:#16A34A}.pzk.y{background:#CA8A04}.pzk.n{background:#1E293B;color:#64748B}
.pzk:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.pzmsg{min-height:26px;font-weight:700;text-align:center}
.pzend{text-align:center;max-width:560px}
.pzdist{display:grid;gap:4px;margin:8px auto;max-width:360px}.pzdist div{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:center;font-size:.85rem}.pzdist i{display:block;background:#334155;color:#fff;text-align:right;padding:1px 6px;border-radius:4px;font-style:normal;min-width:22px}.pzdist i.me{background:var(--acc);color:#0B1020}
@media(max-width:480px){.pzc{--s:46px;font-size:1.25rem}.pzk{min-height:48px;font-size:.9rem}}
/* Market Sim */
.mkgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}@media(max-width:960px){.mkgrid{grid-template-columns:1fr}}
.mktop{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.mktop div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}.mktop b{display:block;font:800 1.3rem "Bricolage Grotesque",sans-serif}.mktop span{color:var(--mt);font-size:.82rem}
.mka{display:grid;grid-template-columns:minmax(150px,1.4fr) 92px 100px minmax(170px,1.3fr);gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--ln)}
.mka:first-of-type{border-top:0}
.mka .nm b{display:block}.mka .nm small{color:var(--mt)}
.mka .px b{display:block;font-variant-numeric:tabular-nums}.up{color:#4ADE80}.dn{color:#FB7185}
.mka .tr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mka input{width:64px;min-height:36px;border-radius:10px;border:1px solid var(--ln);background:#0F172A;color:var(--tx);padding:0 8px;font:inherit}
.mka .own{font-size:.82rem;color:var(--mt)}
@media(max-width:640px){.mka{grid-template-columns:1fr 1fr}.mka .tr{grid-column:1/-1}.mka svg{display:none}}
.mknews{border-left:4px solid var(--acc)}
.mkrep{border-left:4px solid #FBBF24}
.mklesson{display:grid;gap:8px;margin-top:10px}.mklesson div{background:var(--card2);border-radius:12px;padding:10px 12px;border:1px solid var(--ln)}
.mkbig{font:800 clamp(2rem,6vw,3rem)/1 "Bricolage Grotesque",sans-serif}

<script type="text/x-lumen">
/* ===== Next Level: the Arcade section for older learners =====
   The Arcade has two tabs for everyone: Young Explorers (the original games) and Next Level. Next Level games
   reward reasoning over recall and use no play time: two daily puzzles (Cipher, a five-letter academic word,
   and Equation Code, an eight-character equation) and Market Sim (a 12-month investing simulation). A daily
   loop of all three builds a streak; a player card shows stats from real subject mastery, earned titles and an
   accent colour. State lives in GM.nl. */
const NLACC={cyan:'#22D3EE',violet:'#A78BFA',lime:'#A3E635',amber:'#FBBF24',rose:'#FB7185',sky:'#60A5FA'};
const NL=()=>{const n=GM.nl||(GM.nl={});n.acc=n.acc||'cyan';n.st=n.st||{};for(const k of ['c','e'])n.st[k]=n.st[k]||{p:0,w:0,dist:[0,0,0,0,0,0]};n.st.mk=n.st.mk||{runs:0,best:null,beat:0,pos:0};n.loop=n.loop||{};n.got=n.got||[];return n};
function nlRng(seed){let s=seed>>>0;const r=()=>{s=(s+0x6d2b79f5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
  r.int=(a,b)=>a+Math.floor(r()*(b-a+1));r.pick=a=>a[Math.floor(r()*a.length)];r.gauss=()=>(r()+r()+r()+r()-2)*1.7;return r}
const nlDayNum=(d=dstr())=>Math.round(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/864e5);
const nlYesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const money=v=>(v<0?'−$':'$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgnPct=v=>(v>=0?'+':'−')+Math.abs(v*100).toFixed(1)+'%';

/* ---------- The two Arcade tabs ---------- */
const arcTab=()=>GM.arc||(myGrade()>=6?'next':'young');
function arcTabs(){const t=arcTab();
  return `<div class="arctabs" role="tablist" aria-label="Arcade sections"><button role="tab" aria-selected="${t==='young'}" class="${t==='young'?'on':''}" onclick="GM.arc='young';SYNC();rerealm()">🧸 Young Explorers<small>Pre-K to grade 5 · playful learning games</small></button><button role="tab" aria-selected="${t==='next'}" class="next ${t==='next'?'on':''}" onclick="GM.arc='next';SYNC();rerealm()">🚀 Next Level<small>Grades 6 to 12 · puzzles, strategy and simulations</small></button></div>`}
const _hubNL=hubView;hubView=function(){return arcTabs()+(arcTab()==='next'?nlHub():_hubNL().replace('<h2 class="gtitle">Bose Arcade</h2><p class="gsub">Every move is powered by what you learn.</p>','<h2 class="gtitle">Young Explorers</h2><p class="gsub">Games for younger learners. Every move is powered by what you learn.</p>'))};
function nlOpen(id){AR.mode=id;rerealm();scrollTo({top:0,behavior:calmOn()?'auto':'smooth'})}
const nlHeadBar=(t,s)=>`<div class="nlhead"><div class="nlhb"><button class="nlbtn ghost sm" onclick="toHub()">← Next Level</button><div><div class="kick">Next Level</div><h2 class="nltitle" style="margin:2px 0 0">${t}</h2><p class="mt" style="margin:4px 0 0">${s}</p></div></div></div>`;
const nlWrap=html=>`<div class="nl" style="--acc:${NLACC[NL().acc]}">${html}</div>`;

/* ---------- Stats from real mastery, titles and the daily loop ---------- */
const NLSTATS=[['math','🧮','Logic'],['ela','📜','Rhetoric'],['sci','🔬','Science'],['soc','🏛️','History'],['cs','💻','Code'],['fin','💰','Finance'],['es','🌎','Languages']];
function nlStats(){const g=myGrade();return NLSTATS.filter(([s])=>ORDER.some(k=>SK[k].sub===s)).map(([s,i,n])=>{const all=ORDER.filter(k=>SK[k].sub===s),band=all.filter(k=>Math.abs((ST.gr[k]??g)-g)<=1);
  const lv=all.filter(k=>level(k)>=3).length,b=band.length?band.filter(k=>level(k)>=3).length/band.length:0;return{s,i,n,lv,b}})}
const NLTITLES=[
  {id:'rookie',n:'Rookie',d:'Start playing Next Level',ok:()=>true},
  {id:'codebreaker',n:'Codebreaker',d:'Solve 3 Ciphers',ok:N=>N.st.c.w>=3},
  {id:'lexicon',n:'Lexicon',d:'Solve 10 Ciphers',ok:N=>N.st.c.w>=10},
  {id:'engine',n:'Equation Engine',d:'Solve 3 Equation Codes',ok:N=>N.st.e.w>=3},
  {id:'mathlete',n:'Mathlete',d:'Solve 10 Equation Codes',ok:N=>N.st.e.w>=10},
  {id:'investor',n:'Investor',d:'Finish a Market Sim year',ok:N=>N.st.mk.runs>=1},
  {id:'bull',n:'Bull Run',d:'Finish a Market Sim year up 15% or more',ok:N=>N.st.mk.best!=null&&N.st.mk.best>=.15},
  {id:'beat',n:'Beat the Market',d:'Finish ahead of the index fund',ok:N=>N.st.mk.beat>=1},
  {id:'fire',n:'On Fire',d:'Reach a 3-day loop streak',ok:N=>(N.best||0)>=3},
  {id:'unstoppable',n:'Unstoppable',d:'Reach a 7-day loop streak',ok:N=>(N.best||0)>=7},
  {id:'polymath',n:'Polymath',d:'Reach Proficient in a skill in 4 different subjects',ok:()=>nlStats().filter(x=>x.lv>0).length>=4}];
function nlAwards(){const N=NL(),fresh=NLTITLES.filter(t=>!N.got.includes(t.id)&&t.ok(N));if(!fresh.length)return;
  N.got.push(...fresh.map(t=>t.id));if(!N.title)N.title=fresh[fresh.length-1].id;SYNC();
  if(fresh.some(t=>t.id!=='rookie'))setTimeout(()=>celebrate(fresh.filter(t=>t.id!=='rookie').map(t=>`New title: ${t.n}!`)),300)}
const NLLOOP=[['cipher','🔤','Cipher','Crack today\'s five-letter word'],['eqcode','🧮','Equation Code','Find today\'s hidden equation'],['market','📈','Market Sim','Trade through one month']];
function nlLoopDone(id){const N=NL(),d=dstr();if(id==='market')return N.loop.mk===d;const P=N.pz&&N.pz.d===d?N.pz[id==='cipher'?'c':'e']:null;return !!(P&&P.done)}
/* All three done today: +1 streak (if yesterday was done too), +20 XP and +5 gems, once a day */
function nlLoopCheck(){const N=NL(),d=dstr();if(N.loopDay===d||!NLLOOP.every(([id])=>nlLoopDone(id)))return;
  const kept=N.last===nlYesterday(),froze=!kept&&N.last===nlDaysAgo(2)&&(N.freeze||0)>0;if(froze)N.freeze--;
  N.streak=kept||froze?(N.streak||0)+1:1;N.last=d;N.loopDay=d;N.best=Math.max(N.best||0,N.streak);const xp=Math.round(20*nlMult(N.streak));addXP(xp,'your daily loop');addGems(5);SYNC();
  setTimeout(()=>celebrate([`Daily loop complete! 🔥 ${N.streak}-day streak`,`+${xp} XP${xp>20?` (×${nlMult(N.streak).toFixed(1)} streak bonus)`:''} and +5 💎`,...(froze?['🧊 A streak freeze saved your streak!']:[])],true),400);nlAwards()}
/* Streak multiplier for the loop's XP: +10% a day in a row, up to ×1.5 */
const nlMult=s=>1+.1*Math.min(5,Math.max(0,s-1));
const nlDaysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};
const nlStreak=()=>{const N=NL();return N.last===dstr()||N.last===nlYesterday()||(N.last===nlDaysAgo(2)&&(N.freeze||0)>0)?N.streak||0:0};
/* Next Level games, in hub order. Later layers push their own. */
const NLGAMES=[
  {id:'cipher',tag:'Daily puzzle',n:'Cipher',p:'Six tries to crack the academic word of the day. Every guess must be a real word.'},
  {id:'eqcode',tag:'Daily puzzle',n:'Equation Code',p:'Find the hidden 8-character equation. Every guess must be a true equation.',art:'eq'},
  {id:'market',tag:'Simulation',n:'Market Sim',p:'Invest $10,000 for a year of news, booms and crashes. Can you beat the market?'}];
/* A line under the loop (the skill tree layer fills it in with the learner's goal) */
let nlNextUp=()=>'';

function nlHub(){const N=NL(),P=lvProg(),st=nlStats(),t=NLTITLES.find(x=>x.id===N.title)||NLTITLES[0],done=NLLOOP.filter(([id])=>nlLoopDone(id)).length,sk=nlStreak();nlAwards();
  const tile=(id,tag,name,pitch,art)=>`<button class="nltile" onclick="nlOpen('${id}')" aria-label="${esc(name)}"><span aria-hidden="true">${art}</span><span class="nlb"><span class="tag">${tag}</span><span class="nlname">${name}</span><span class="mt">${pitch}</span></span></button>`;
  return nlWrap(`<div class="nlhead"><div><div class="kick">Next Level · grades 6 to 12</div><h2 class="nltitle">Think. Compete. Build.</h2><p class="mt" style="margin:0">Strategy, logic and real-world simulations. Next Level games use no play time: every move is thinking.</p></div><span class="nlpill" title="Days in a row you finished the daily loop">🔥 ${sk}-day streak</span></div>
  <div class="nlgrid"><div>
    <div class="nlcard"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h3 style="margin:0">⏱️ Today's loop <span class="mt" style="font-weight:600">· about 5 minutes</span></h3><span class="nlpill">${done} of 3</span></div>
      <div class="nlloop">${NLLOOP.map(([id,i,n,d])=>{const ok=nlLoopDone(id);return `<div class="nlstep ${ok?'done':''}"><span class="ic" aria-hidden="true">${ok?'✅':i}</span><div><b>${n}</b><span class="mt">${d}</span></div><button class="nlbtn ${ok?'ghost':''} sm" onclick="nlOpen('${id}')" aria-label="${ok?'Open':'Play'} ${n}">${ok?'Open':'Play'}</button></div>`}).join('')}</div>
      <p class="mt" style="margin:10px 0 0;font-size:.88rem">Finish all three for +${Math.round(20*nlMult(sk+1))} XP${sk?` (×${nlMult(sk+1).toFixed(1)} streak bonus)`:''}, +5 💎 and a longer streak.${NL().freeze?` 🧊 ${NL().freeze} streak freeze${NL().freeze>1?'s':''} ready.`:''}</p></div>

  let k=e.key;if(k==='x'&&AR.mode==='eqcode')k='*';if(k==='÷')k='/';if(k.length===1)k=k.toLowerCase();
  if(k==='Enter'||k==='Backspace'||(AR.mode==='cipher'?/^[a-z]$/:/^[0-9+\-*/=]$/).test(k)){
    // Enter on a focused page button (Share, Back...) presses it; on an on-screen key it submits the guess
    if(tg&&tg.tagName==='BUTTON'&&k==='Enter'&&!tg.classList.contains('pzk'))return;e.preventDefault();pzKey(AR.mode,k)}});

/* ---------- Market Sim: a year of investing $10,000 ---------- */
const MKA=[
  {id:'BYTE',n:'ByteForge',sec:'tech',i:'💻',p:80,vol:.085,dr:.011,div:0,d:'Chips and apps. Big swings.'},
  {id:'SOLR',n:'Solaris Energy',sec:'energy',i:'⚡',p:45,vol:.065,dr:.007,div:.02,d:'Power plants and solar farms.'},
  {id:'LEAF',n:'GreenLeaf Foods',sec:'food',i:'🥫',p:30,vol:.03,dr:.004,div:.04,d:'Groceries people buy in good times and bad.'},
  {id:'MEDI',n:'MediCore Health',sec:'health',i:'💊',p:60,vol:.045,dr:.006,div:.03,d:'Medicines and hospitals.'},
  {id:'URBN',n:'UrbanWear',sec:'retail',i:'👟',p:25,vol:.06,dr:.006,div:0,d:'Clothes and sneakers.'},
  {id:'INDX',n:'Total Market Index Fund',sec:'index',i:'📊',p:100,fund:1,div:.015,d:'Owns all five companies at once. No trading fee.'},
  {id:'BOND',n:'Government Bond Fund',sec:'bond',i:'🏛️',p:50,fund:1,vol:.006,dr:.0005,div:.036,d:'Steady interest. Pays a little every month. No trading fee.'}];
const MKSTOCKS=MKA.filter(a=>!a.fund);
/* div is the yearly dividend or interest rate: paid every quarter (every month for the bond fund) */
/* News events: the effect on each sector (and on everything, "all") with the reason */
const MKEV=[
  {h:'Chip shortage hits factories',x:'Factories can\'t get enough chips, so ByteForge sells fewer devices and stores have less to sell.',e:{tech:-.12,retail:-.03}},
  {h:'Record heat wave',x:'Air conditioners run all day, so electricity demand jumps.',e:{energy:.08}},
  {h:'Interest rates rise',x:'Borrowing costs more, so fast-growing companies slow down. New bonds pay more, so older bonds are worth a bit less.',e:{all:-.02,tech:-.05,bond:-.025}},
  {h:'Interest rates cut',x:'Cheaper borrowing helps companies grow, and existing bonds with higher payments become worth more.',e:{all:.02,tech:.05,bond:.025}},
  {h:'New medicine approved',x:'Regulators approve MediCore\'s new medicine, which means years of new sales.',e:{health:.14}},
  {h:'Drug trial fails',x:'A big MediCore trial didn\'t work, so expected future profits fall.',e:{health:-.15}},
  {h:'Holiday shopping boom',x:'Shoppers spend more than expected on clothes and gadgets.',e:{retail:.12,tech:.03}},
  {h:'Recession fears',x:'Investors worry the economy is slowing. They sell riskier stocks and buy bonds, but people still buy groceries.',e:{all:-.06,food:.05,bond:.02}},
  {h:'Oil spill fine',x:'Solaris must pay a large fine, which cuts its profit this year.',e:{energy:-.1}},
  {h:'Battery breakthrough',x:'A new battery makes solar power cheaper to store, and gadgets last longer.',e:{energy:.1,tech:.04}},
  {h:'Viral sneaker trend',x:'A UrbanWear sneaker goes viral and sells out everywhere.',e:{retail:.15}},
  {h:'Drought hurts crops',x:'Less harvest means GreenLeaf pays more for ingredients, so its profit shrinks.',e:{food:-.08}},
  {h:'Record harvest',x:'Cheap, plentiful crops lower GreenLeaf\'s costs.',e:{food:.06}},
  {h:'Data breach',x:'Hackers steal ByteForge customer data. Customers and investors lose trust.',e:{tech:-.1}},
  {h:'Strong jobs report',x:'More people have jobs, so they spend more.',e:{all:.03,retail:.04}},
  {h:'Inflation jumps',x:'Prices rise across the economy. Costs go up for most companies, but energy prices rise too. Bonds lose value because their fixed payments buy less.',e:{all:-.03,energy:.05,bond:-.02}},
  {h:'AI boom',x:'Everyone wants AI chips, and ByteForge makes them.',e:{tech:.16}},
  {h:'Shipping delays end',x:'Goods arrive on time again, so stores have full shelves.',e:{retail:.06,tech:.04}},
  {h:'Hospital merger',x:'MediCore joins with a big hospital network and will save money.',e:{health:.06}},
  {h:'Factory strike',x:'UrbanWear workers strike, and production stops for weeks.',e:{retail:-.08}},
  {h:'Solar tax credit',x:'A new law pays people to install solar panels.',e:{energy:.12}},
  {h:'Food safety recall',x:'GreenLeaf recalls a product, which costs money and trust.',e:{food:-.12}},
  {h:'Market rally',x:'Good news everywhere: investors feel confident and buy.',e:{all:.05}},
  {h:'Market slump',x:'Investors get nervous and sell almost everything.',e:{all:-.06,bond:.015}}];
const MKCALM={h:'A quiet month',x:'No big news. Prices just drift with normal ups and downs.',e:{}};
/* Concept checks at the Research Desk: answer right to see next month's headline early */
const MKQ=[
  ['You put $1,000 in savings that earns 5% a year, compounded yearly. How much is there after 2 years?',['$1,100.00','$1,102.50','$1,050.00','$1,125.00'],1,'Year 1: $1,000 × 1.05 = $1,050. Year 2: $1,050 × 1.05 = $1,102.50. Interest earns interest: that\'s compounding.'],
  ['Why does spreading your money across many companies (diversifying) lower risk?',['It guarantees a profit','One company\'s bad news only hits part of your money','It removes all fees','It stops prices from falling'],1,'If one company has a bad month, the others can balance it out. Diversifying lowers risk; it can\'t guarantee a profit.'],
  ['A stock costs $50 and pays a $2 dividend each year. What is its dividend yield?',['2%','4%','25%','0.4%'],1,'Yield = $2 ÷ $50 = 0.04 = 4%.'],
  ['When interest rates rise, what usually happens to the prices of bonds people already own?',['They rise','They fall','They stay exactly the same','They double'],1,'New bonds now pay more, so older bonds with lower payments are worth less.'],
  ['Inflation is 4% this year and your savings earn 1%. What happens to what your money can buy?',['It grows by 5%','It shrinks by about 3%','It stays the same','It grows by 3%'],1,'Your money grows 1% but prices grow 4%, so it buys about 3% less.'],
  ['What is an index fund?',['A fund that owns many companies to match a whole market','A loan from a bank','One company\'s stock','A kind of savings account'],0,'An index fund buys a little of many companies, so you get the whole market\'s return with less single-company risk.'],
  ['Which usually has the highest risk and the highest possible reward?',['A government bond','A savings account','Shares of a young tech company','Cash in a drawer'],2,'Young growth companies can soar or crash. Savings and bonds are steadier but grow slower.'],
  ['Each stock trade costs $2. You make 15 trades. How much did fees cost you?',['$15','$30','$17','$2'],1,'15 × $2 = $30. Small fees add up when you trade a lot.'],
  ['You buy 10 shares at $40 and sell them at $46. What is your profit, before fees?',['$6','$46','$60','$460'],2,'($46 − $40) × 10 shares = $60.'],
  ['A stock falls 50%, then rises 50%. Compared with where it started, it is…',['back to even','down 25%','up 25%','down 50%'],1,'$100 → $50 → $75. After a big loss you need an even bigger gain to recover.'],
  ['What does owning one share of a company mean?',['You lent the company money','You own a small piece of the company','You work for the company','You must pay the company\'s debts'],1,'A share is a slice of ownership. If the company does well, your slice can be worth more.'],
  ['Rule of 72: at 8% a year, about how many years does it take money to double?',['6 years','9 years','12 years','72 years'],1,'72 ÷ 8 = 9 years.']];
const MKFEE=2,MKSAV=.03/12,MKN=12;
const MK=()=>NL().mk;
function mkNew(){const seed=(Math.random()*1e9)|0,r=nlRng(seed),deck=MKEV.map((_,i)=>i);for(let i=deck.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  const ev=[-1,...deck.slice(0,MKN-1)];for(let i=2;i<MKN;i++)if(r()<.15)ev[i]=-1;  // some quiet months
  const qs=MKQ.map((_,i)=>i);for(let i=qs.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
  NL().mk={seed,m:0,cash:10000,sav:0,hold:{},px:Object.fromEntries(MKA.map(a=>[a.id,a.p])),hist:Object.fromEntries(MKA.map(a=>[a.id,[a.p]])),nw:[10000],bench:[10000],
    ev,qs:qs.slice(0,3),checks:{},peek:null,news:null,trades:0,fees:0,divs:0,held:[],done:0};SYNC();rerealm()}
const mkWorth=M=>M.cash+M.sav+MKA.reduce((s,a)=>s+(M.hold[a.id]||0)*M.px[a.id],0);
function mkTrade(id,dir){const M=MK(),a=MKA.find(x=>x.id===id),inp=$('mkq'+id),q=Math.floor(+(inp&&inp.value)||0);if(!M||M.done||!a)return;
  if(q<=0){msg('Type how many shares first.');return}const fee=a.fund?0:MKFEE,px=M.px[id];
  if(dir>0){const cost=q*px+fee;if(cost>M.cash+1e-9){msg(`That costs ${money(cost)} but you have ${money(M.cash)} in cash.`);return}M.cash-=cost;M.hold[id]=(M.hold[id]||0)+q}
  else{const have=M.hold[id]||0;if(q>have){msg(`You only own ${have} share${have===1?'':'s'}.`);return}M.cash+=q*px-fee;M.hold[id]=have-q}
  M.trades++;M.fees+=fee;MKQTY[id]=q;SYNC();rerealm()}
function mkMax(id){const M=MK(),a=MKA.find(x=>x.id===id),fee=a.fund?0:MKFEE,n=Math.max(0,Math.floor((M.cash-fee)/M.px[id]));const i=$('mkq'+id);if(i)i.value=n}
function mkSave(dir){const M=MK(),i=$('mksv'),v=Math.round((+(i&&i.value)||0)*100)/100;if(v<=0){msg('Type an amount first.');return}
  if(dir>0){if(v>M.cash+1e-9){msg('Not enough cash.');return}M.cash-=v;M.sav+=v}else{if(v>M.sav+1e-9){msg('Not that much in savings.');return}M.sav-=v;M.cash+=v}SYNC();rerealm()}
let MKQTY={};
/* One month passes: news moves prices, dividends and interest are paid */
function mkNext(){const M=MK();if(!M||M.done)return;const r=nlRng(M.seed+M.m*101),E=M.ev[M.m]>=0?MKEV[M.ev[M.m]]:MKCALM,eff=E.e,mv={};
  for(const a of MKSTOCKS){mv[a.id]=Math.max(-.6,a.dr+a.vol*r.gauss()+(eff.all||0)+(eff[a.sec]||0))}
  mv.INDX=MKSTOCKS.reduce((s,a)=>s+mv[a.id],0)/MKSTOCKS.length-.0002;
  const B=MKA.find(a=>a.id==='BOND');mv.BOND=B.dr+B.vol*r.gauss()+(eff.bond||0);
  const benchUnits=10000/100,quarter=(M.m+1)%3===0;let divs=0;
  for(const a of MKA){M.px[a.id]=Math.max(1,Math.round(M.px[a.id]*(1+mv[a.id])*100)/100);M.hist[a.id].push(M.px[a.id]);
    const pay=a.id==='BOND'?a.div/12:quarter?a.div/4:0;if(pay&&M.hold[a.id])divs+=M.hold[a.id]*M.px[a.id]*pay}
  M.benchDiv=(M.benchDiv||0)+(quarter?benchUnits*M.px.INDX*MKA.find(a=>a.id==='INDX').div/4:0);
  M.cash+=divs;M.divs+=divs;M.sav=Math.round(M.sav*(1+MKSAV)*100)/100;
  M.held.push(MKA.filter(a=>(M.hold[a.id]||0)>0).length);
  M.m++;M.news={h:E.h,x:E.x,mv,divs};M.peek=null;M.nw.push(mkWorth(M));M.bench.push(benchUnits*M.px.INDX+M.benchDiv);
  NL().loop.mk=dstr();
  if(M.m>=MKN)mkFinish();SYNC();nlLoopCheck();rerealm()}
function mkFinish(){const M=MK(),N=NL(),S=N.st.mk,ret=mkWorth(M)/10000-1,b=M.bench[M.bench.length-1]/10000-1;M.done=1;M.ret=ret;M.bret=b;
  S.runs++;if(S.best==null||ret>S.best)S.best=ret;if(ret>b)S.beat++;if(ret>0)S.pos++;addXP(30,'finishing a Market Sim year');nlAwards()}
function mkResearch(){const M=MK(),qi=M.qs[[3,6,9].indexOf(M.m)];if(qi==null||M.checks[M.m])return;const [q,ch,a,s]=MKQ[qi];
  nlAsk({title:'Research Desk',intro:'Answer right to read next month\'s headline before anyone else.',q,choices:ch,a,s}).then(ok=>{if(ok===null)return;
    M.checks[M.m]=ok?1:-1;if(ok){const E=M.ev[M.m]>=0?MKEV[M.ev[M.m]]:MKCALM;M.peek=E.h;addXP(10,'a market concept check')}SYNC();rerealm()})}
/* A question from a fixed set, in the shared question modal (choices; explanation shown on a miss) */
function nlAsk(o){return new Promise(res=>{QM={o:{title:o.title,intro:o.intro,cancel:true},k:null,q:{q:esc(o.q),choices:o.choices,a:[o.a],s:esc(o.s)},res,phase:'ask',fb:''};qmRender()})}
function mkSpark(arr,w=96,h=30){const lo=Math.min(...arr),hi=Math.max(...arr),k=hi-lo||1,pts=arr.map((v,i)=>`${(i/(Math.max(1,MKN))*w).toFixed(1)},${(h-2-(v-lo)/k*(h-4)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${arr[arr.length-1]>=arr[0]?'#4ADE80':'#FB7185'}" stroke-width="2"/></svg>`}
function mkChart(M){const w=520,h=170,all=[...M.nw,...M.bench],lo=Math.min(...all)*.98,hi=Math.max(...all)*1.02,k=hi-lo||1,X=i=>(i/MKN*(w-50)+40).toFixed(1),Y=v=>(h-20-(v-lo)/k*(h-36)).toFixed(1);
  const line=(arr,c,dash)=>`<polyline points="${arr.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="${dash?2:3}" ${dash?'stroke-dasharray="6 5"':''}/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Your net worth ${money(M.nw[M.nw.length-1])} compared with the index fund ${money(M.bench[M.bench.length-1])}">
    ${[lo+k*.25,lo+k*.5,lo+k*.75].map(v=>`<line x1="40" x2="${w-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1E293B"/><text x="36" y="${+Y(v)+4}" font-size="10" fill="#94A3B8" text-anchor="end">$${(v/1000).toFixed(1)}k</text>`).join('')}
    ${line(M.bench,'#64748B',1)}${line(M.nw,'var(--acc)',0)}<text x="${w-10}" y="14" font-size="11" fill="#94A3B8" text-anchor="end">— you   - - index fund</text></svg>`}
function mkReport(M){const ret=M.ret,b=M.bret,sav=Math.pow(1+MKSAV,MKN)-1,avgHeld=M.held.length?M.held.reduce((a,c)=>a+c,0)/M.held.length:0,L=[];
  L.push(ret>b?`<b>You beat the market.</b> Your ${sgnPct(ret)} topped the index fund's ${sgnPct(b)}. Doing that reliably is hard, even for professionals, which is why many people simply buy index funds.`:`<b>The index fund won this year</b> (${sgnPct(b)} vs your ${sgnPct(ret)}). Just owning the whole market is a strong strategy, and it beats most professional stock-pickers over time.`);
  L.push(avgHeld<2?`<b>Diversification:</b> you usually held ${avgHeld<1?'nothing':'just one investment'}. With everything in one place, one piece of bad news can sink you. Holding several different sectors smooths out the bumps.`:`<b>Diversification:</b> you held about ${avgHeld.toFixed(1)} different investments each month. Spreading across sectors means no single headline can sink you.`);
  if(M.fees>=20)L.push(`<b>Fees:</b> ${M.trades} trades cost ${money(M.fees)}. Frequent trading adds up; patient investors keep more.`);
  if(M.divs>0)L.push(`<b>Income:</b> you earned ${money(M.divs)} in dividends and bond interest just for holding on.`);
  L.push(`<b>Safe choice:</b> leaving everything in savings would have earned ${sgnPct(sav)}, with no risk. Higher possible rewards come with higher risk.`);
  return `<div class="nlcard" style="margin-bottom:16px"><div class="kick">Year complete</div><div class="mkbig ${ret>=0?'up':'dn'}" style="margin:8px 0">${sgnPct(ret)}</div><p style="margin:0">You turned $10,000 into <b>${money(mkWorth(M))}</b>.</p>
    <div class="mktop" style="margin-top:12px"><div><span>Index fund</span><b>${sgnPct(b)}</b></div><div><span>Savings only</span><b>${sgnPct(sav)}</b></div><div><span>Trades · fees</span><b>${M.trades} · ${money(M.fees)}</b></div><div><span>Dividends + interest</span><b>${money(M.divs)}</b></div></div>
    ${mkChart(M)}<div class="mklesson">${L.map(x=>`<div>${x}</div>`).join('')}</div>
    <div class="row" style="gap:8px;margin-top:12px"><button class="nlbtn" onclick="mkNew()">▶ Play another year</button><button class="nlbtn ghost" onclick="toHub()">Back to Next Level</button></div></div>`}
GVIEW.market=function(){const N=NL(),M=N.mk,S=N.st.mk,head=nlHeadBar('Market Sim','Invest $10,000 for one year. Read the news, spread your risk, and see if you can beat the market.');
  if(!M)return nlWrap(head+`<div class="nlgrid"><div class="nlcard"><h3>How it works</h3><ul class="pearn"><li>You start with <b>$10,000</b> in cash. Each turn is one month; a year is 12 turns.</li><li>Buy and sell shares of five companies, an <b>index fund</b> that owns all of them, and a <b>bond fund</b>. Or park cash in <b>savings</b> at 3% a year, risk-free.</li><li>Each month brings news that moves prices. Read why, and decide what to do.</li><li>Stock trades cost a $${MKFEE} fee. Some investments pay dividends.</li><li>At months 3, 6 and 9 the <b>Research Desk</b> asks a concept question. Get it right to read next month's headline early.</li></ul><button class="nlbtn" style="margin-top:12px" onclick="mkNew()">▶ Start investing</button></div>
    <div class="nlcard"><h3>Your record</h3><p class="mt">Years played: <b style="color:var(--tx)">${S.runs}</b><br>Best year: <b style="color:var(--tx)">${S.best==null?'–':sgnPct(S.best)}</b><br>Years you beat the market: <b style="color:var(--tx)">${S.beat}</b></p></div></div>`);
  const nw=mkWorth(M),ch=nw/10000-1,canAsk=[3,6,9].includes(M.m)&&!M.checks[M.m]&&!M.done;
  const asset=a=>{const h=M.hist[a.id],p=M.px[a.id],last=h.length>1?p/h[h.length-2]-1:0,own=M.hold[a.id]||0;
    return `<div class="mka"><div class="nm"><b>${a.i} ${esc(a.n)} <span class="mt" style="font-weight:600">${a.id}</span></b><small>${esc(a.d)}${a.div?` Pays ${(a.div*100).toFixed(1)}% a year, ${a.id==='BOND'?'monthly':'every 3 months'}.`:''}</small></div>
      <div class="px"><b>${money(p)}</b><span class="${last>=0?'up':'dn'}">${h.length>1?sgnPct(last):'—'}</span></div><div>${mkSpark(h)}</div>
      <div class="tr">${M.done?'':`<input id="mkq${a.id}" type="number" min="1" step="1" value="${MKQTY[a.id]||10}" aria-label="How many ${esc(a.n)} shares"><button class="nlbtn sm" onclick="mkTrade('${a.id}',1)">Buy</button><button class="nlbtn ghost sm" ${own?'':'disabled'} onclick="mkTrade('${a.id}',-1)">Sell</button><button class="nlbtn ghost sm" onclick="mkMax('${a.id}')" title="Most you can afford">Max</button>`}<span class="own">${own?`You own ${own} · ${money(own*p)}`:'You own none'}</span></div></div>`};
  return nlWrap(head+`${M.done?mkReport(M):''}
    <div class="mktop"><div><span>Month</span><b>${Math.min(M.m+1,MKN)}${M.done?'':' of '+MKN}</b></div><div><span>Net worth</span><b class="${ch>=0?'up':'dn'}">${money(nw)}</b></div><div><span>Return so far</span><b class="${ch>=0?'up':'dn'}">${sgnPct(ch)}</b></div><div><span>Cash</span><b>${money(M.cash)}</b></div><div><span>Savings (3%/yr)</span><b>${money(M.sav)}</b></div></div>
    <div class="mkgrid"><div class="nlcard" style="padding:6px 4px">${MKA.map(asset).join('')}</div>
    <div style="display:grid;gap:14px">
      ${M.news?`<div class="nlcard mknews"><div class="kick">Last month's news</div><h3 style="margin:6px 0">📰 ${esc(M.news.h)}</h3><p class="mt" style="margin:0">${esc(M.news.x)}</p>${M.news.divs?`<p style="margin:8px 0 0">💵 You received ${money(M.news.divs)} in dividends and interest.</p>`:''}</div>`:`<div class="nlcard mknews"><div class="kick">Month 1</div><p class="mt" style="margin:6px 0 0">Make your first moves, then press <b>Next month</b> to see what happens.</p></div>`}
      ${M.peek?`<div class="nlcard mkrep"><div class="kick" style="color:#FBBF24">Research report</div><p style="margin:6px 0 0">Next month's headline: <b>${esc(M.peek)}</b>. What will it do to each company?</p></div>`:''}
      ${canAsk?`<div class="nlcard mkrep"><div class="kick" style="color:#FBBF24">Research Desk</div><p style="margin:6px 0 10px">Answer one concept question to read next month's headline early.</p><button class="nlbtn sm" onclick="mkResearch()">📚 Take the question</button></div>`:''}
      ${M.done?'':`<div class="nlcard"><h4>🏦 Savings account</h4><p class="mt" style="margin:0 0 8px">Safe, 3% a year, paid monthly.</p><div class="tr" style="display:flex;gap:6px;flex-wrap:wrap"><input id="mksv" type="number" min="0" step="100" value="1000" aria-label="Amount" style="width:100px;min-height:36px;border-radius:10px;border:1px solid var(--ln);background:#0F172A;color:var(--tx);padding:0 8px"><button class="nlbtn sm" onclick="mkSave(1)">Deposit</button><button class="nlbtn ghost sm" ${M.sav?'':'disabled'} onclick="mkSave(-1)">Withdraw</button></div></div>
      <button class="nlbtn" style="min-height:56px;font-size:1.15rem" onclick="mkNext()">Next month ▶</button>`}
      <div class="nlcard"><h4>Your year so far</h4>${mkChart(M)}</div>
    </div></div>`)};
</script>
